<!DOCTYPE html>
<html lang="en" data-mode="day">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="DigiSoma: fun lessons in coding, AI, online safety and wellbeing for African kids aged 6 to 16.">
<meta name="theme-color" content="#9FDBFF">
<title>DigiSoma</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@500;700;800&family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<style>
/* Design: a savanna under the night sky (or at sunrise in Day mode). Stars are the reward currency, so the sky is the stage.
   Kids navigate with 4 big tabs (Home, Learn, Awards, Me): bottom bar on phones, side rail on computers. Lessons open in a focus mode with no distractions. */
:root{
  --sky:linear-gradient(180deg,#9FDBFF 0%,#D6F0FF 42%,#FFF1D6 100%);
  --ink:#1E1147;--mute:#5A5480;--panel:#FFFFFF;--panel2:#F2EEFF;--line:#E1DAF7;--shade:rgba(30,17,71,.14);
  --sun:#FFC93C;--sunD:#C99300;--vio:#6A3CE0;--vioD:#3B1F8F;--mint:#14B886;--pink:#FF5D8F;
  --hill1:#E9C46A;--hill2:#D9A84E;--tree:#5B4022;--glow:rgba(255,201,60,.35);
  --display:"Fredoka","Trebuchet MS",system-ui,sans-serif;--body:"Nunito","Segoe UI",system-ui,sans-serif;
  color-scheme:light}
[data-mode="night"]{
  --sky:radial-gradient(1200px 600px at 80% -10%,rgba(94,242,194,.18),transparent 60%),radial-gradient(900px 500px at 10% 10%,rgba(155,107,255,.28),transparent 60%),linear-gradient(180deg,#070B26 0%,#13104A 55%,#29165E 100%);
  --ink:#F4F2FF;--mute:#B7B2E3;--panel:#1C1A4C;--panel2:#2A2768;--line:#3A3780;--shade:rgba(0,0,0,.35);
  --hill1:#1A1446;--hill2:#120E36;--tree:#0A0826;--glow:rgba(94,242,194,.25);
  color-scheme:dark}
*{box-sizing:border-box}[hidden]{display:none!important}
html,body{margin:0;min-height:100%}
body{font-family:var(--body);font-weight:500;font-size:18px;line-height:1.5;color:var(--ink);background:var(--sky) fixed;background-color:#13104A}
[data-mode="day"] body{background-color:#D6F0FF}
h1,h2,h3{font-family:var(--display);font-weight:600;line-height:1.1;margin:0;text-wrap:balance}
a{color:inherit;text-decoration:none}button{font:inherit;cursor:pointer;color:inherit}
:focus-visible{outline:4px solid var(--sun);outline-offset:3px;border-radius:12px}

/* scene */
.scene{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.stars{position:absolute;inset:0;opacity:0;transition:opacity .6s}
[data-mode="night"] .stars{opacity:1}
.stars i{position:absolute;width:2px;height:2px;border-radius:50%;background:#fff;animation:tw 4s ease-in-out infinite}
@keyframes tw{50%{opacity:.25}}
.orb{position:absolute;top:70px;right:8%;width:90px;height:90px;border-radius:50%;background:#FFE08A;box-shadow:0 0 80px 30px rgba(255,201,60,.45)}
[data-mode="night"] .orb{background:#F6F1D8;box-shadow:0 0 60px 14px rgba(246,241,216,.25),inset -18px -6px 0 #DCD5B4;width:70px;height:70px}
.land{position:absolute;left:0;right:0;bottom:0;width:100%;height:180px}
.land .h1{fill:var(--hill1)}.land .h2{fill:var(--hill2)}.land .t{fill:var(--tree)}

/* shell */
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 20px;background:color-mix(in srgb,var(--panel) 82%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.logo{font-family:var(--display);font-weight:700;font-size:26px;display:flex;align-items:center;gap:8px}.logo b{color:var(--sun)}
.logo svg{width:34px;height:34px}
.pills{display:flex;gap:8px;align-items:center}
.pill{display:inline-flex;align-items:center;gap:6px;background:var(--panel2);border:0;border-radius:99px;padding:5px 12px;font-weight:800;font-size:15px;white-space:nowrap}
.pill.me{padding:3px 12px 3px 4px}.pill.me span{font-size:22px;background:var(--panel);border-radius:50%;width:32px;height:32px;display:grid;place-items:center}
.nav{position:fixed;z-index:20;display:flex;background:var(--panel);border-top:1px solid var(--line);left:0;right:0;bottom:0;justify-content:space-around;padding:6px 6px calc(6px + env(safe-area-inset-bottom))}
.nav a{display:flex;flex-direction:column;align-items:center;gap:0;padding:6px 8px;border-radius:18px;font-family:var(--display);font-weight:600;font-size:13px;color:var(--mute);min-width:62px}
.nav a span{font-size:26px;line-height:1.1;transition:transform .15s}
.nav a.on{background:var(--sun);color:#1E1147}.nav a.on span{transform:translateY(-2px) scale(1.08)}
main{position:relative;z-index:1;padding:20px 16px 120px;max-width:1080px;margin:0 auto}
body.focus .nav,body.focus .top .pills{display:none}body.focus main{padding-bottom:60px}
@media(min-width:900px){
  .nav{top:0;bottom:0;right:auto;width:104px;flex-direction:column;justify-content:flex-start;gap:8px;padding:84px 10px 10px;border-top:0;border-right:1px solid var(--line)}
  .nav a{padding:12px 6px;font-size:14px}
  body:not(.focus) main,body:not(.focus) .top{margin-left:104px}
  body:not(.focus) main{padding:28px 32px 140px}
  .top{z-index:21}
}

/* type + buttons */
.kick{font-family:var(--display);font-weight:600;color:var(--sun);font-size:18px;margin:0 0 2px}
[data-mode="day"] .kick{color:#B4570B}
h1{font-size:clamp(34px,5.5vw,52px)}h2{font-size:clamp(24px,3.6vw,32px)}
.sub{color:var(--mute);margin:4px 0 16px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:99px;padding:12px 24px;font-family:var(--display);font-weight:600;font-size:19px;background:var(--sun);color:#1E1147;box-shadow:0 5px 0 var(--sunD);margin:4px}
.btn.v{background:var(--vio);color:#fff;box-shadow:0 5px 0 var(--vioD)}.btn.s{background:var(--panel2);color:var(--ink);box-shadow:0 5px 0 var(--line)}.btn.r{background:#D7265B;color:#fff;box-shadow:0 5px 0 #8E1239}
.btn:active{transform:translateY(4px);box-shadow:none}.btn:disabled{opacity:.45;cursor:not-allowed;transform:none;box-shadow:none}
.card{background:var(--panel);border:1px solid var(--line);border-radius:28px;padding:20px;box-shadow:0 8px 0 var(--shade)}
.c{text-align:center}.mute{color:var(--mute)}

/* home */
.hi{display:grid;grid-template-columns:1fr auto;gap:16px;align-items:center;margin-bottom:18px}
.zuri-wrap{text-align:center;position:relative}
.bub{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:10px 14px;max-width:250px;font-size:16px;margin:0 auto 10px;position:relative;box-shadow:0 6px 0 var(--shade)}
.bub:after{content:"";position:absolute;bottom:-10px;left:50%;margin-left:-10px;border:10px solid transparent;border-top-color:var(--panel);border-bottom:0}
.zbig{width:150px;height:150px;cursor:pointer;animation:bob 3s ease-in-out infinite;filter:drop-shadow(0 10px 18px var(--glow))}
@keyframes bob{50%{transform:translateY(-8px)}}
.eye{transform-origin:center;transform-box:fill-box;animation:blink 4s infinite}@keyframes blink{0%,94%,100%{transform:scaleY(1)}97%{transform:scaleY(.1)}}
.bento{display:grid;grid-template-columns:1.4fr 1fr;gap:16px}
.cont{grid-row:span 2;border-radius:28px;padding:22px;color:#fff;display:flex;flex-direction:column;justify-content:space-between;gap:12px;min-height:240px;box-shadow:0 8px 0 var(--shade);position:relative;overflow:hidden}
.cont:after{content:"";position:absolute;right:-40px;top:-40px;width:200px;height:200px;border-radius:50%;background:rgba(255,255,255,.12)}
.cont .em{font-size:64px;line-height:1}.cont h2{font-size:30px}.cont small{font-weight:800;opacity:.85;text-transform:uppercase;letter-spacing:.06em;font-size:13px}
.mini{display:flex;gap:14px;align-items:center}.mini .em{font-size:40px;line-height:1}.mini small{display:block;font-weight:800;color:var(--mute);text-transform:uppercase;letter-spacing:.06em;font-size:12px}.mini b{font-family:var(--display);font-weight:600;font-size:21px;display:block;line-height:1.15}
.week{display:flex;gap:6px;margin-top:10px}.week div{flex:1;text-align:center;font-size:12px;color:var(--mute);font-weight:800}.week i{display:grid;place-items:center;height:34px;border-radius:12px;background:var(--panel2);font-style:normal;font-size:18px;margin-bottom:3px}.week i.on{background:var(--sun)}.week .td i{outline:2px dashed var(--sun);outline-offset:1px}
.shelf{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(170px,1fr);gap:14px;overflow-x:auto;padding:4px 2px 14px;scroll-snap-type:x mandatory}
.wt{scroll-snap-align:start;border-radius:24px;padding:16px;color:#fff;min-height:150px;display:flex;flex-direction:column;justify-content:space-between;box-shadow:0 6px 0 var(--shade);transition:transform .15s}.wt:hover{transform:translateY(-4px)}
.wt .em{font-size:40px;line-height:1}.wt b{font-family:var(--display);font-weight:600;font-size:19px;line-height:1.15}
.pb{height:9px;background:rgba(255,255,255,.3);border-radius:9px;overflow:hidden;margin-top:6px}.pb i{display:block;height:100%;background:#fff;border-radius:9px}
.pb.k{background:var(--panel2)}
.sec{margin:28px 0 10px;display:flex;justify-content:space-between;align-items:end;gap:10px}

/* learn map */
.map{position:relative;max-width:640px;margin:10px auto 0;display:grid;gap:26px;padding:10px 0}
.map:before{content:"";position:absolute;left:50%;top:30px;bottom:30px;border-left:6px dashed var(--line);transform:translateX(-50%)}
.stop{position:relative;display:flex;align-items:center;gap:16px;width:82%;background:var(--panel);border:1px solid var(--line);border-radius:99px;padding:10px 24px 10px 10px;box-shadow:0 8px 0 var(--shade);transition:transform .15s}
.stop:nth-child(even){margin-left:auto;flex-direction:row-reverse;padding:10px 10px 10px 24px;text-align:right}
.stop:hover{transform:scale(1.03)}
.stop .ball{flex:none;width:86px;height:86px;border-radius:50%;display:grid;place-items:center;font-size:44px;color:#fff;box-shadow:inset 0 -6px 0 rgba(0,0,0,.2)}
.stop b{font-family:var(--display);font-weight:600;font-size:22px;display:block;line-height:1.1}.stop small{color:var(--mute);font-size:15px}
.stop .tx{flex:1;min-width:0}
/* world path */
.banner{border-radius:28px;padding:20px 22px;color:#fff;display:flex;gap:16px;align-items:center;box-shadow:0 8px 0 var(--shade);margin-bottom:8px}
.banner .em{font-size:56px;line-height:1}.banner a{color:#fff;font-weight:800;font-size:15px;opacity:.9}
.unit{margin:26px 0 6px;display:flex;align-items:center;gap:12px;background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:12px 16px}
.unit .em{font-size:34px}.unit b{font-family:var(--display);font-weight:600;font-size:20px;display:block;line-height:1.1}.unit small{color:var(--mute)}.unit .ct{margin-left:auto;font-weight:800;color:var(--mute);font-size:15px;white-space:nowrap}
.trail{display:flex;flex-direction:column;align-items:center;gap:14px;padding:16px 0 4px}
.lnode{position:relative;display:flex;flex-direction:column;align-items:center;gap:4px;width:150px;text-align:center}
.lnode .o{width:78px;height:78px;border-radius:50%;display:grid;place-items:center;font-size:34px;color:#fff;box-shadow:0 7px 0 rgba(0,0,0,.28),inset 0 -6px 0 rgba(0,0,0,.18);transition:transform .15s}
a.lnode:hover .o{transform:scale(1.08)}
.lnode b{font-family:var(--display);font-weight:600;font-size:15px;line-height:1.15}.lnode small{font-size:13px;letter-spacing:1px}
.lnode.lock .o{background:var(--panel2)!important;color:var(--mute);box-shadow:0 7px 0 var(--line)}.lnode.lock b{color:var(--mute)}
.lnode.cur .o{outline:5px solid var(--sun);outline-offset:5px;animation:pulse 1.6s ease-in-out infinite}
.lnode .go{position:absolute;top:-34px;background:var(--sun);color:#1E1147;font-family:var(--display);font-weight:600;font-size:14px;padding:3px 12px;border-radius:12px;white-space:nowrap}
.lnode .go:after{content:"";position:absolute;bottom:-7px;left:50%;margin-left:-7px;border:7px solid transparent;border-top-color:var(--sun);border-bottom:0}
@keyframes pulse{50%{outline-offset:9px}}

/* lesson focus */
.lbar{display:flex;align-items:center;gap:14px;max-width:680px;margin:0 auto 14px}
.x{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:var(--panel2);font-size:20px;font-weight:800;flex:none}
.lprog{flex:1;height:16px;background:var(--panel2);border-radius:99px;overflow:hidden}.lprog i{display:block;height:100%;width:8%;border-radius:99px;transition:width .4s}
.lc{max-width:680px;margin:0 auto;background:var(--panel);border:1px solid var(--line);border-radius:32px;overflow:hidden;box-shadow:0 10px 0 var(--shade)}
.dh{color:#fff;padding:16px 24px}.dh small{font-weight:800;opacity:.85;font-size:13px;text-transform:uppercase;letter-spacing:.06em}.dh h2{font-size:28px}
#st{padding:20px 24px 26px}
.zrow{display:flex;gap:12px;align-items:center;margin-bottom:14px}.zrow svg{flex:none}
.say{background:var(--panel2);border-radius:20px;padding:12px 16px;font-size:17px}
.tts{border:0;background:var(--line);border-radius:99px;padding:0 8px;font-size:15px;margin-left:4px;vertical-align:middle}
.step{margin:0;font-size:15px;color:var(--mute);display:block;font-weight:700}
.opts{display:grid;gap:10px;margin:14px 0}.opt{background:var(--panel2);border:3px solid transparent;border-radius:18px;padding:13px 16px;text-align:left;font-weight:700;font-size:17px}
.opt:hover{border-color:var(--vio)}.opt.good{background:#C9F5E4;border-color:var(--mint);color:#0B3B2C}.opt.bad{background:#FFD6E1;border-color:var(--pink);color:#5A0F27}
.grid{display:grid;gap:6px;margin:10px auto}.cell{aspect-ratio:1;background:var(--panel2);border-radius:14px;display:grid;place-items:center;font-size:clamp(22px,6vw,32px)}.cell.st{background:color-mix(in srgb,var(--sun) 35%,var(--panel2))}
.pad{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:8px 0}.ar{background:#E1E7FF;color:#1E1147;border:0;border-radius:14px;padding:8px 16px;font-size:24px;box-shadow:0 4px 0 #9FAAE0}.ar:active{transform:translateY(3px);box-shadow:none}
.ar.lp{background:#FFE7A8;box-shadow:0 4px 0 #D9B24A;font-size:17px;font-weight:800}
.q{min-height:50px;background:var(--panel2);border-radius:14px;padding:8px;font-size:24px;display:flex;flex-wrap:wrap;gap:4px;justify-content:center;align-items:center}
.q span{border-radius:10px;padding:0 4px}.q .hl{background:var(--sun)}.q small{font-size:16px;color:var(--mute)}.q .loop{border:2px dashed #D9B24A;background:rgba(255,201,60,.15)}
pre{background:#0E1530;color:#7CF5D0;border-radius:14px;padding:12px;text-align:left;font-size:14px;overflow:auto;margin:10px 0}
.moods{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}.moods button{background:var(--panel2);border:3px solid transparent;border-radius:20px;padding:6px 12px;font-size:34px;line-height:1.2}.moods button:hover{border-color:var(--vio)}.moods small{display:block;font-size:14px;font-family:var(--body);font-weight:800}
.breath{width:96px;height:96px;border-radius:50%;background:radial-gradient(circle,#CFC2FF,#8E73F2);margin:16px auto;animation:br 8s ease-in-out infinite;display:grid;place-items:center;font-weight:800;color:#1E1147}@keyframes br{0%,100%{transform:scale(.6)}50%{transform:scale(1.15)}}
.big{font-size:56px;text-align:center}
.help{background:rgba(255,201,60,.18);border-radius:16px;padding:10px 14px;font-size:16px}
.homecard{background:rgba(20,184,134,.15);border-radius:18px;padding:12px 16px;margin:12px 0;font-size:16px}
.phone{max-width:330px;margin:10px auto;background:#120E36;border:3px solid var(--line);border-radius:34px;padding:14px 14px 22px;color:#fff}.pt{font-size:13px;opacity:.7;text-align:center}.from{font-weight:800;margin:10px 4px 6px}.msgb{background:#fff;color:#1E1147;border-radius:18px 18px 18px 4px;padding:12px 14px;font-size:16px}
.pw{width:100%;border:3px solid var(--line);border-radius:16px;font:inherit;font-size:22px;padding:10px 14px;margin:6px 0;background:var(--panel2);color:var(--ink)}
.meter{height:14px;background:var(--panel2);border-radius:99px;overflow:hidden}.meter i{display:block;height:100%;width:0;transition:width .3s}
.ck{list-style:none;padding:0;columns:2;font-size:16px;margin:8px 0}.ck .y{color:var(--mint);font-weight:800}
.mrow{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:10px 0}.mrow div{text-align:center;width:96px}.mrow small{display:block;font-size:13px;line-height:1.25}

/* awards */
.lvl{display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.ring{--p:0;width:110px;height:110px;border-radius:50%;background:conic-gradient(var(--sun) calc(var(--p)*1%),var(--panel2) 0);display:grid;place-items:center;flex:none}
.ring div{width:84px;height:84px;border-radius:50%;background:var(--panel);display:grid;place-items:center;text-align:center;font-family:var(--display);font-weight:600;line-height:1}.ring b{font-size:30px;display:block}.ring small{font-size:12px;color:var(--mute)}
.skybox{position:relative;height:260px;border-radius:24px;background:linear-gradient(180deg,#070B26,#1E1458);overflow:hidden;margin-top:12px}
.skybox i{position:absolute;font-style:normal;font-size:11px;color:#4B4785;transform:translate(-50%,-50%)}
.skybox i.on{color:#FFE08A;text-shadow:0 0 10px #FFC93C;font-size:15px}
.skybox p{position:absolute;left:16px;bottom:10px;margin:0;color:#fff;font-weight:800;font-size:15px}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px}
.bdg{background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:14px;text-align:center;box-shadow:0 6px 0 var(--shade)}.bdg span{font-size:40px;display:block}.bdg b{font-family:var(--display);font-weight:600}.bdg small{display:block;color:var(--mute);font-size:13px;line-height:1.2}
.bdg.off>*{opacity:.4;filter:grayscale(1)}

/* me */
.prof{display:flex;align-items:center;gap:18px;flex-wrap:wrap}.prof .av{font-size:64px;width:100px;height:100px;border-radius:50%;background:var(--panel2);display:grid;place-items:center;border:4px solid var(--sun)}
.rowset{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;padding:14px 0;border-bottom:1px solid var(--line)}.rowset:last-child{border-bottom:0}.rowset b{display:block}.rowset small{color:var(--mute);font-size:14px}
.seg{display:inline-flex;background:var(--panel2);border-radius:99px;padding:4px;gap:4px;flex-wrap:wrap}.seg button{border:0;background:transparent;border-radius:99px;padding:6px 14px;font-weight:800;font-size:15px;color:var(--ink)}.seg button.on{background:var(--sun);color:#1E1147}
.sw button{width:32px;height:32px;border-radius:50%;border:3px solid var(--panel);box-shadow:0 0 0 2px var(--line);margin:0 3px}
.avs{display:flex;gap:6px;flex-wrap:wrap}.avs button{font-size:30px;background:var(--panel2);border:3px solid transparent;border-radius:16px;padding:2px 8px}.avs .on{border-color:var(--sun)}
.price{background:linear-gradient(135deg,#FFC93C,#FF9F43);color:#1E1147;border-radius:28px;padding:22px;box-shadow:0 8px 0 #C77A1A}.price .n{font-family:var(--display);font-size:48px;font-weight:700;line-height:1}.price ul{padding-left:20px;margin:10px 0;font-weight:700}

/* onboarding + learners */
.ob{display:grid;grid-template-columns:1fr 1fr;gap:28px;align-items:center;min-height:calc(100vh - 140px)}
.ob h1{font-size:clamp(38px,6vw,62px)}.ob h1 em{font-style:normal;color:var(--sun)}
.feat{display:flex;flex-wrap:wrap;gap:8px;margin:16px 0}.feat span{background:var(--panel);border:1px solid var(--line);border-radius:99px;padding:6px 14px;font-weight:800;font-size:15px}
.ob label{display:block;font-weight:800;margin:14px 0 6px}
.ob input{width:100%;font:inherit;font-size:20px;padding:12px 16px;border-radius:16px;border:3px solid var(--line);background:var(--panel2);color:var(--ink)}
.kids{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:16px;max-width:720px;margin:20px auto}
.kc{background:var(--panel);border:1px solid var(--line);border-radius:28px;padding:22px;text-align:center;box-shadow:0 8px 0 var(--shade);transition:transform .15s}.kc:hover{transform:translateY(-4px)}
.kc .av{font-size:66px;display:block;line-height:1.1}.kc b{font-family:var(--display);font-weight:600;font-size:22px;display:block}.kc small{color:var(--mute)}
.kc.add{background:transparent;border:3px dashed var(--line);box-shadow:none}

/* parent dialog */
dialog{border:0;padding:0;width:min(600px,94vw);max-height:92vh;overflow:auto;background:var(--panel);color:var(--ink);border-radius:28px;box-shadow:0 20px 60px rgba(0,0,0,.4)}dialog::backdrop{background:rgba(7,11,38,.75)}

<script>
const $=s=>document.querySelector(s),app=$("#app"),pz=$("#pz");
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const esc=s=>String(s).replace(/[&<>"']/g,c=>"&#"+c.charCodeAt(0)+";"),strip=s=>s.replace(/<[^>]+>/g,"");
const calm=matchMedia("(prefers-reduced-motion: reduce)").matches,canTalk="speechSynthesis" in window;
const TT=["Explorer","Maker","Inventor","Wizard","Legend"],AV=["🦁","🦒","🐘","🦓","🐆","🦜","🐢","🦩"];
const AG=["Sprouts · 6–8","Builders · 9–12","Pioneers · 13–16"],AGs=["Sprouts","Builders","Pioneers"],HL=["Ready to train your first AI robot?","Build smart AI logic and beat online tricks!","Go from block code to real AI and Python!"];
const TK=["Easier maths and a 🔊 read-aloud helper.","See the Python version of your robot code.","Python, harder maths and ⚡ bonus questions."];
const WD=[["Kompyuta","Computer","💻"],["Akili bandia","Artificial intelligence (AI)","🧠"],["Programu","Program or app","📱"],["Nenosiri","Password","🔐"],["Mtandao","Internet or network","🌍"],["Roboti","Robot","🤖"],["Simu janja","Smartphone","📲"]];
const D={
code:{t:"Code & AI Lab",e:"🤖",c:"#4361EE",d:"Code robots, understand and use AI",topics:[
{t:"Think Like a Coder",e:"🕹️",d:"Instructions, steps and algorithms",L:[
{t:"What is code?",k:"vid",v:[["💻","Computers are super fast, but they can’t think for themselves."],["📝","Code is a list of instructions that tells a computer exactly what to do."],["🤖 ➡️ ⬆️","Like telling Akili: move right, move up, pick the mango!"],["🔁","Coders use tricks like loops to repeat steps without writing them again."],["🌍","Apps, games and even M-Pesa are built with code. You can learn it too!"]]},
{t:"Guide Akili",k:"robot",lv:0,home:"Be the robot! Ask someone at home to give you arrow steps to walk from the door to the kitchen."},
{t:"Dodge the rocks",k:"robot",lv:1},
{t:"Algorithms everywhere",k:"q",learn:"An <b>algorithm</b> is a list of steps to get something done. A recipe for chapati is an algorithm. So is your morning routine!",Q:[["Which one is an algorithm?",["A recipe for chapati","The colour blue"],0,"A recipe is a list of steps in order."],["Making tea: boil water, add tea leaves, add milk. What if you pour the milk before boiling the water?",["The steps are in the wrong order","Nothing changes"],0,"Order matters in algorithms, just like in code."]],X:["Computers follow algorithms…",["Exactly as written","However they feel like"],0,"Computers do exactly what the code says, even when it’s a mistake."],home:"Write the algorithm for brushing your teeth. Can someone at home follow it exactly?"},
{t:"Mango delivery",k:"robot",lv:2,home:"Draw a map of your street on paper and write the steps to get to the duka."}]},
{t:"Loops & Bugs",e:"🔁",d:"Repeat, fix and decide",L:[
{t:"Spot the pattern",k:"q",learn:"A loop repeats steps for you. Instead of writing ➡️➡️➡️➡️, you say “repeat 4 times: ➡️”. Programmers use loops every day.",Q:[["Clap, stomp, clap, stomp, clap, stomp. How many times does “clap, stomp” repeat?",["2","3","4"],1,"Three times. You just found a loop!"],["Which code is shorter?",["➡️➡️➡️➡️➡️","🔁×5 [ ➡️ ]"],1,"Loops save you from writing the same step again and again."]],X:["In Python, for i in range(3): repeats the code…",["3 times","4 times","Forever"],0,"range(3) counts 0, 1, 2, so the code runs three times."]},
{t:"Rooftop garden",k:"robot",lv:3,home:"Make up a dance with a repeating pattern, then teach it to someone using “repeat 3 times”."},
{t:"The long road",k:"robot",lv:4},
{t:"Debugging detective",k:"q",learn:"A <b>bug</b> is a mistake in code. <b>Debugging</b> means finding and fixing it. Every coder makes bugs, even experts!",Q:[["Akili should go ➡️➡️⬆️ but the code says ➡️⬆️⬆️. Where is the bug?",["Step 2 should be ➡️","Step 1 is wrong"],0,"Check each step, one at a time, to find the bug."],["Your code doesn’t work. A good coder…",["Gives up","Tests one step at a time to find the mistake"],1,"Patient testing finds bugs."]],X:["Computer “bugs” got their name partly because in 1947 engineers found…",["A real moth stuck in a computer","A spider in a phone"],0,"They taped the moth into their logbook as the first “bug” ever found!"]},
{t:"If this, then that",k:"q",learn:"Code makes choices with <b>if</b>: IF it is raining, THEN take an umbrella, ELSE wear a cap. This is called a <b>condition</b>.",Q:[["IF the traffic light is red, THEN…",["Stop","Go faster"],0,"Conditions help code decide what to do."],["A game says: IF score is 10, THEN show “You win!” Your score is 10. What happens?",["“You win!” appears","Nothing"],0,"The condition is true, so that code runs."]],X:["Which Python line checks a condition?",["if score == 10:","print(score)"],0,"if starts a condition in Python."],home:"Make up an IF-THEN rule with your family, like: IF it is 8pm, THEN screens go off."}]},
{t:"How AI Works",e:"🧠",d:"See, think, act, learn",L:[
{t:"How does AI learn?",k:"vid",v:[["🧠","AI stands for artificial intelligence: computers that can learn."],["🥭 🥭 🥭","Instead of giving it rules, we show AI lots of examples."],["🔍","The AI looks for patterns, like: yellow mangoes are ripe."],["✅ ❌","Then it guesses about new things. Sometimes it’s right, sometimes it’s wrong."],["👩🏾‍💻","Good examples make good AI. Bad examples make bad AI!"]]},
{t:"See, Think, Act",k:"order",learn:"Every AI robot works in 3 steps. It sees the world, thinks about what it saw, then acts."},
{t:"Teach the AI",k:"train",learn:"Let’s build a mango-sorting AI! First you teach it with examples. Then we test it on mangoes it has never seen.",home:"Sort fruit at home into ripe and not ripe. What clues did you use? AI calls those clues “features”."},
{t:"Learning from examples",k:"q",learn:"AI isn’t told every rule. It studies lots of examples, like cat photos, and finds patterns.",Q:[["How does AI learn to spot a cat?",["It’s born knowing","It studies lots of cat photos"],1,"Examples are what AI learns from."],["Next in the pattern: 🔴🔵🔴🔵 ?",["🔴","🔵","🟢"],0,"Spotting patterns is what AI does best."]],X:["The examples an AI learns from are called…",["Training data","Wi-Fi","A charger"],0,"Training data shapes everything the AI learns."]},
{t:"AI around you",k:"q",learn:"AI is already in things you use: maps that find the fastest route, phones that unlock with your face, and email that hides spam.",Q:[["Which one uses AI?",["A phone that unlocks with your face","A wooden spoon"],0,"Face unlock uses AI to recognise faces."],["A map app finds the fastest way through Nairobi traffic. That is…",["AI using data about traffic","Magic"],0,"It learns from lots of traffic data."]],X:["Which decision should people make, not AI?",["Who your friends should be","Which words to translate"],0,"Some choices belong to people."],home:"Count how many things at home or in town might use AI."}]},
{t:"AI & Me",e:"🤝",d:"Use AI smartly, safely and fairly",L:[
{t:"Prompt power",k:"prompt",learn:"A <b>prompt</b> is the message you give an AI. Clear prompts get better answers: say who to act like, who it’s for, and how to answer. And never put personal details in a prompt!",home:"With a grown-up, think of a question for an AI. How could you make the prompt clearer?"},
{t:"Teach Akili kind words",k:"words",learn:"Some AI reads words and sorts them, like an email app that spots spam. Let’s build one that spots kind and unkind messages!",home:"Say three kind things to people at home today. Notice how they react!"},
{t:"Can AI be wrong?",k:"verify",set:0,learn:"AI can sound very sure and still be wrong. Use the habit <b>Pause, protect, verify</b>: stop and think, keep personal details private, and check facts with a trusted source.",home:"Ask a grown-up about something you read online this week. How could you check if it’s true?"},
{t:"Using AI wisely",k:"q",learn:"AI can be wrong. Check facts with a book or a grown-up, and keep private things private.",Q:[["An AI says something odd. You…",["Believe it","Check another source"],1,"AI makes mistakes, so double-check."],["Tell an AI your home address?",["Sure","No, keep it private"],1,"Private stays private, even with robots."]],X:["Using AI to write your whole homework and saying you wrote it is…",["Not honest","Fine"],0,"Use AI to help you learn, and be honest about how you used it."]},
{t:"Fair AI",k:"q",learn:"AI learns from data. If the data leaves people out, the AI can be unfair. This is called <b>bias</b>. Good AI builders test their AI with all kinds of people.",Q:[["A face-recognition AI was trained mostly on one kind of face. It may…",["Work worse for other faces","Work the same for everyone"],0,"Missing data causes unfair results."],["How can we make AI fairer?",["Use data from many different people and places","Use less data"],0,"Varied data helps AI work for everyone."]],X:["Who is responsible for checking that an AI is fair?",["The people who build and use it","Nobody, AI is always fair"],0,"Humans are responsible for the AI they make."]}]}]},
math:{t:"Math Arena",e:"🧮",c:"#D9620F",d:"Numbers, money, data and logic",topics:[
{t:"Number Power",e:"🔢",d:"Fast, fun number skills",L:[{t:"Add and subtract",k:"math",m:0},{t:"Times tables",k:"math",m:1},{t:"Sharing equally",k:"math",m:2},
{t:"Place value",k:"q",learn:"In 352, the 3 means 3 hundreds, the 5 means 5 tens and the 2 means 2 ones.",Q:[["In 472, what does the 7 mean?",["7 tens (70)","7 ones (7)","7 hundreds (700)"],0,"The middle digit shows tens."],["Which number is bigger?",["509","590"],1,"Both have 5 hundreds, but 590 has 9 tens."]],X:["In 4,038, what does the 4 mean?",["4 thousands","4 hundreds"],0,"The 4 is in the thousands place."]},
{t:"Number patterns",k:"math",m:4}]},
{t:"Money Smart",e:"🛒",d:"Shillings, saving and budgets",L:[
{t:"Shopping with shillings",k:"q",learn:"To find your change, subtract. Pay KSh 100 for something that costs KSh 60 and you get 100 − 60 = 40 back.",Q:[["3 mandazi at KSh 20 each. Total?",["KSh 40","KSh 60","KSh 80"],1,"3 × 20 = 60."],["Pay KSh 100 for KSh 65. Change?",["KSh 25","KSh 35","KSh 45"],1,"100 − 65 = 35."]],X:["You save KSh 50 a week. How long to reach KSh 400?",["6 weeks","8 weeks","10 weeks"],1,"400 ÷ 50 = 8."],home:"Next time at the duka, work out the change before the shopkeeper does!"},
{t:"Change at the duka",k:"math",m:3},
{t:"Save, spend, share",k:"q",learn:"A smart money habit: split your money into three jars, one to <b>save</b>, one to <b>spend</b> and one to <b>share</b>.",Q:[["You get KSh 90 and split it equally into 3 jars. How much goes in each?",["KSh 30","KSh 45","KSh 20"],0,"90 ÷ 3 = 30."],["Why save money?",["To buy something bigger later","Saving is never useful"],0,"Saving helps you reach big goals."]],X:["You save KSh 20 every week. After 10 weeks you have…",["KSh 200","KSh 120","KSh 30"],0,"20 × 10 = 200."]},
{t:"Needs and wants",k:"q",learn:"A <b>need</b> is something you must have, like food, water and school books. A <b>want</b> is nice to have, like sweets or a new game.",Q:[["Which is a need?",["Clean water","A new toy"],0,"We cannot live without water."],["Which is a want?",["A video game","Shoes for school"],0,"A game is fun, but not essential."]]},
{t:"Plan a budget",k:"q",learn:"A <b>budget</b> is a plan for your money. Add up what things cost and make sure the total is not more than what you have.",Q:[["You have KSh 200. Bus fare is KSh 100 and lunch is KSh 60. How much is left?",["KSh 40","KSh 60","KSh 140"],0,"100 + 60 = 160, and 200 − 160 = 40."],["Your plan costs more than your money. You should…",["Cut something from the plan","Ignore it"],0,"A budget must fit the money you have."]],X:["You earn KSh 500 selling mandazi and spend KSh 350 on ingredients. Your profit is…",["KSh 150","KSh 850","KSh 350"],0,"Profit = money earned − costs."]}]},
{t:"Data Detectives",e:"📊",d:"Collect, count and read data",L:[
{t:"What is data?",k:"vid",v:[["📊","Data is information we collect, like numbers, words or pictures."],["🌦️","Weather forecasts use data to predict rain."],["🌽","Farmers use data to decide when to plant."],["📈","Charts help us see patterns in data quickly."],["🧠","And AI learns from data too!"]]},
{t:"Tally marks",k:"q",learn:"Tally marks help you count fast. Draw four lines, then cross them with a fifth line to make a group of 5.",Q:[["Three full groups of tally marks show…",["15","3","12"],0,"3 groups × 5 = 15."],["Two full groups and three more lines show…",["13","23","5"],0,"5 + 5 + 3 = 13."]]},
{t:"Reading a chart",k:"q",learn:"A bar chart shows data with bars. The taller the bar, the bigger the number.",Q:[["Favourite fruits: mango 12, banana 8, orange 5. Which bar is tallest?",["Mango","Banana","Orange"],0,"12 is the biggest number."],["How many more children chose mango than banana?",["4","20","3"],0,"12 − 8 = 4."]]},
{t:"Finding the average",k:"q",learn:"The <b>mean</b> (average) is the total divided by how many numbers there are. The mean of 2, 4 and 6 is (2 + 4 + 6) ÷ 3 = 4.",Q:[["What is the mean of 3, 5 and 7?",["5","15","7"],0,"(3 + 5 + 7) ÷ 3 = 15 ÷ 3 = 5."],["Rain on 4 days: 10, 20, 30 and 20 mm. The mean is…",["20 mm","80 mm","30 mm"],0,"80 ÷ 4 = 20."]]},
{t:"Data in real life",k:"q",learn:"Data helps people make good choices: farmers check rainfall, doctors track health and shops track what sells.",Q:[["A farmer wants to know when to plant. Which data helps most?",["Rainfall data","Football scores"],0,"Rain data helps plan planting."],["A duka sells 50 sodas on hot days and 10 on cold days. Before a hot day it should…",["Stock more sodas","Stock fewer sodas"],0,"Data helps the shop plan."]],X:["Data about people should be…",["Kept private and safe","Shared with anyone"],0,"Personal data must be protected."]}]},
{t:"Shapes & Logic",e:"🔺",d:"Fractions, logic and computer counting",L:[
{t:"Shapes around us",k:"q",learn:"Shapes are everywhere: a chapati is a circle, a door is a rectangle, and a pyramid has triangle sides.",Q:[["How many sides does a triangle have?",["3","4","5"],0,"Tri means three."],["A chapati is shaped like a…",["Circle","Square"],0,"Round shapes are circles."]],X:["How many sides does a hexagon have?",["6","8","5"],0,"Hex means six, like a honeycomb cell."]},
{t:"Fractions",k:"q",learn:"A fraction is part of a whole. Cut a chapati into 4 equal pieces and each piece is one quarter (¼).",Q:[["A chapati is cut into 2 equal parts. Each part is…",["One half","One third"],0,"2 equal parts are halves."],["Which is bigger?",["½","¼"],0,"A half is bigger than a quarter."]]},
{t:"Halves and quarters",k:"math",m:5},
{t:"Logic puzzles",k:"q",learn:"Logic means thinking step by step to find an answer that must be true.",Q:[["Amina is taller than Juma. Juma is taller than Otieno. Who is tallest?",["Amina","Juma","Otieno"],0,"Amina > Juma > Otieno."],["All cats have tails. Simba is a cat. So Simba…",["Has a tail","Can fly"],0,"If it’s true for all cats, it’s true for Simba."]]},
{t:"Counting like a computer",k:"q",learn:"Computers count with only two digits, 0 and 1. This is called <b>binary</b>. In binary, 1 = 1, 10 = 2, 11 = 3 and 100 = 4.",Q:[["Binary uses which digits?",["0 and 1","0 to 9"],0,"Just two digits!"],["What is binary 11 as a normal number?",["3","11","2"],0,"Binary 11 = 2 + 1 = 3."]],X:["What is binary 101 as a normal number?",["5","101","3"],0,"4 + 0 + 1 = 5."]}]}]},
safe:{t:"Cyber Shield",e:"🛡️",c:"#0E8A63",d:"Smart, safe and kind online",topics:[
{t:"Protect Yourself",e:"🔒",d:"Secrets, scams, passwords",L:[
{t:"Strangers and secrets",k:"q",learn:"Online, anyone can pretend to be anyone. Keep your school, address and photos private.",Q:[["A gamer says, “Free gems! Send your address and password.”",["Send them","Block, and tell a grown-up"],1,"Real prizes never ask for passwords or addresses."],["Someone says, “Keep this secret from your parents.”",["OK","Tell a trusted grown-up now"],1,"Safe people never ask for secrets like that."]]},
{t:"Scam or safe?",k:"scam",set:0,learn:"Scammers send messages that look real. Red flags: a rush, a prize, a secret, or a request for money, PINs or photos.",home:"With a grown-up, look through recent SMS messages together. Can you spot any scams?"},
{t:"Password builder",k:"pass",learn:"Strong passwords are long and mixed. A great trick: three random words plus a number and a symbol.",home:"With a grown-up, check that family accounts use long passphrases, not names or birthdays."},
{t:"Private or public?",k:"q",learn:"Some information is <b>private</b>: your address, school, phone number, passwords and photos. Keep it off the internet unless a trusted grown-up says it’s okay.",Q:[["Which is private?",["Your home address","Your favourite colour"],0,"An address can help a stranger find you."],["A website asks for your phone number so you can play a game. You…",["Ask a trusted grown-up first","Type it in quickly"],0,"Always check before sharing."]]},
{t:"Your digital footprint",k:"vid",v:[["👣","Everything you do online leaves a footprint."],["📸","Photos, comments and likes can stay online for a very long time."],["🔒","Keep your name, school, address and photos private."],["🤔","Before you post, ask: would I be happy for anyone to see this?"],["🌟","Leave footprints you’re proud of!"]]}]},
{t:"Be Kind Online",e:"💬",d:"Bullying, kindness and balance",L:[
{t:"If someone is mean",k:"q",learn:"If someone is unkind online: don’t reply, save proof, block them, tell a grown-up. It’s never your fault.",Q:[["First step if someone bullies you online?",["Be mean back","Don’t reply, tell a grown-up"],1,"Getting help is the brave move."],["Is bullying ever your fault?",["Yes","Never"],1,"Never."]]},
{t:"Be an upstander",k:"q",learn:"A <b>bystander</b> watches bullying happen. An <b>upstander</b> helps: they support the person, refuse to join in and tell a grown-up.",Q:[["Someone posts a mean joke about a classmate. An upstander…",["Doesn’t share it and checks on the classmate","Shares it with friends"],0,"Small actions stop bullying."],["Telling a grown-up about bullying is…",["Brave and right","Snitching"],0,"Getting help is the right thing to do."]]},
{t:"Think before you post",k:"q",learn:"Before posting, ask THINK: is it True, Helpful, Inspiring, Necessary and Kind?",Q:[["You’re angry at a friend. Posting about it right away is…",["A bad idea. Calm down first","A great idea"],0,"Posts can stay online for a long time."],["Which post is kind?",["“Great goal today, Achieng!”","“You played so badly lol”"],0,"Kind words build people up."]]},
{t:"Screen balance",k:"q",learn:"Try the 20-20-20 rule: every 20 minutes, look at something 20 feet away for 20 seconds. Sleep, play and friends matter too.",Q:[["The 20-20-20 rule helps your…",["Eyes","Shoes"],0,"Looking far away rests tired eyes."],["Screens right before bed…",["Help you sleep","Make sleep harder"],1,"Screen light keeps your brain awake."]],home:"Agree on a family “screens off” time before bed."},
{t:"Gaming safely",k:"q",learn:"Games are fun! Play safely: use a nickname, never share personal details, don’t buy things without permission, and take breaks.",Q:[["A player you don’t know asks you to video chat. You…",["Say no and tell a grown-up","Say yes"],0,"Never video chat with strangers."],["A game asks you to buy coins using a parent’s phone. You…",["Ask permission first","Buy them secretly"],0,"Always ask before spending money."]]}]},
{t:"Think Before You Share",e:"🔎",d:"Fake news, scams and deepfakes",L:[
{t:"Real or fake?",k:"q",learn:"Not everything online is true. Fake posts often shout, scare you or say “share now!” AI can even make fake photos, voices and videos, called <b>deepfakes</b>. Before you share, pause and check.",Q:[["“SHOCKING! Eating mangoes makes you fly! Share before they delete this!”",["Probably real","Probably fake"],1,"Shouting, shocking claims and “share now” are big warning signs."],["A news story has no date and no author. You should…",["Share it fast","Check a trusted news source first"],1,"Real news says who wrote it and when."],["A video shows a famous footballer saying something very strange. It could be…",["Always real","A deepfake made by AI"],1,"AI can fake faces and voices. Check trusted sources first."]],X:["The best first question to ask about any post is…",["Who made this, and how do they know?","How many likes does it have?"],0,"Likes don’t make something true."],home:"Find one news story with a grown-up and check: who wrote it, when, and is it on other trusted sites?"},
{t:"WhatsApp tricks",k:"scam",set:1,learn:"Scams also arrive on WhatsApp and social media: fake job offers, fake prizes and people pretending to be family who need money."},
{t:"Clickbait",k:"q",learn:"<b>Clickbait</b> is a headline made to make you click, like “You won’t BELIEVE what happened next!” It often hides a boring or false story.",Q:[["Which headline is clickbait?",["“This ONE trick will make you a millionaire!”","“Schools open on Monday”"],0,"Too good to be true is a warning sign."],["Clickbait mainly wants you to…",["Click","Learn something true"],0,"More clicks can mean more money for them."]]},
{t:"Fact or fiction?",k:"verify",set:1,learn:"People and AI share things online that sound true but aren’t. Let’s practise checking!"},
{t:"Photos and permission",k:"q",learn:"Always ask before taking or sharing a photo of someone. And never share photos of yourself with people you only know online.",Q:[["You took a funny photo of your friend. Before posting it you…",["Ask your friend first","Post it right away"],0,"Permission shows respect."],["Someone you met online asks for a photo of you. You…",["Say no and tell a trusted grown-up","Send one"],0,"Never send photos to online strangers."]]}]},
{t:"Digital Citizen",e:"🌍",d:"Rights, respect and leadership online",L:[
{t:"Give credit",k:"q",learn:"When you use someone else’s picture, music or words, say who made it. This is called giving <b>credit</b>. Copying without credit isn’t fair.",Q:[["You use a photo from a website in your project. You should…",["Say where it came from","Pretend you made it"],0,"Giving credit is fair."],["Your friend drew a great picture. Sharing it as yours is…",["Not fair","Fine"],0,"Creators deserve credit."]]},
{t:"Privacy settings",k:"q",learn:"Apps have <b>privacy settings</b> that control who sees what you share. With a grown-up, set them so only people you know can see your posts.",Q:[["Who should help set up privacy settings?",["A trusted grown-up","A stranger online"],0,"Do it together with someone you trust."],["“Only friends can see” is…",["Safer than “everyone can see”","The same"],0,"Fewer viewers means more privacy."]]},
{t:"Rights and respect",k:"q",learn:"Everyone has the right to be safe and respected online, just like offline. Treat others the way you want to be treated.",Q:[["Is it okay to say things online that you wouldn’t say face to face?",["No","Yes"],0,"Real people read your words."],["You see someone being treated unfairly online. You can…",["Report it and tell a grown-up","Join in"],0,"Speaking up helps keep the internet safe."]]},
{t:"Two-step locks",k:"q",learn:"Use a different strong password for each account, and turn on <b>two-step verification</b> with a grown-up: a code on a phone keeps strangers out.",Q:[["Using the same password everywhere is…",["Risky","Smart"],0,"If one account is broken into, they all are."],["Your best friend asks for your password. You…",["Kindly keep it secret","Share it"],0,"Passwords are for you and your parents only."]]},
{t:"Be a digital leader",k:"q",learn:"A digital leader uses technology to help others: teaching grandparents to spot scams, sharing true information and being kind online.",Q:[["Grandma gets an SMS asking for her M-Pesa PIN. A digital leader…",["Helps her spot the scam","Tells her to send it"],0,"Share what you know to protect your family."],["Which makes the internet better?",["Sharing true, helpful things","Sharing rumours"],0,"Be the good on the internet."]],home:"Teach someone at home one thing you learned in Cyber Shield."}]}]},
feel:{t:"Mind & Heart",e:"💛",c:"#D1336A",d:"Feelings, calm and kindness",topics:[
{t:"Know Your Feelings",e:"🪞",d:"Name it to tame it",L:[
{t:"Feelings are messengers",k:"vid",v:[["💛","Everyone has feelings, every single day."],["😠 😢 😰","Even big ones like anger, sadness and worry are okay."],["📬","Feelings are like messengers. They tell us what we need."],["🫧","When a feeling is big, breathe slowly and name it."],["🤗","And you can always talk to a trusted grown-up."]]},
{t:"Mood check-in",k:"feel",home:"At dinner, everyone shares one feeling from today."},
{t:"Feelings detective",k:"q",learn:"Feelings have names: happy, sad, angry, scared, proud. Naming one makes it easier to handle.",Q:[["Your heart races before a test. You may feel…",["Nervous","Sleepy"],0,"Nerves make the heart beat faster."],["You lose a game and want to cry. That’s…",["Normal","Silly"],0,"All feelings are okay."]]},
{t:"Body clues",k:"q",learn:"Our bodies give clues about feelings: a racing heart when scared, hot cheeks when angry, a heavy chest when sad.",Q:[["Your fists are tight and your face feels hot. You might be feeling…",["Angry","Sleepy"],0,"Tight fists and hot cheeks are anger clues."],["Butterflies in your tummy before a race might mean…",["Nervous or excited","Only hungry"],0,"Nerves and excitement can feel alike."]]},
{t:"Feelings words",k:"q",learn:"The more feelings words you know, the easier it is to explain how you feel: proud, frustrated, lonely, hopeful, calm.",Q:[["You finished a really hard puzzle. You feel…",["Proud","Lonely"],0,"Proud is the feeling when hard work pays off."],["Your drawing keeps going wrong and you want to give up. You feel…",["Frustrated","Calm"],0,"Frustrated means stuck and annoyed."]]}]},
{t:"Calm Toolbox",e:"🧘",d:"Tools for big feelings",L:[
{t:"Belly breathing",k:"breathe",home:"Teach belly breathing to someone in your family tonight."},
{t:"Kind self-talk",k:"q",learn:"The voice in your head can be a friend or a bully. Talk to yourself like you would to a friend.",Q:[["You made a mistake. Kind self-talk is…",["“I’m so dumb”","“I’m still learning”"],1,"Mistakes help you learn."],["Who can you talk to when you feel low?",["Nobody","A trusted grown-up or friend"],1,"Sharing makes it lighter."]]},
{t:"5-4-3-2-1 calm",k:"q",learn:"When worry feels big, use your senses. Notice 5 things you see, 4 you can touch, 3 you hear, 2 you smell and 1 you taste.",Q:[["The 5-4-3-2-1 trick uses your…",["Senses","Phone"],0,"Noticing your senses brings you back to now."],["How many things do you SEE in 5-4-3-2-1?",["5","1","3"],0,"Start with 5 things you can see."]]},
{t:"Steps to calm",k:"order",steps:[["✋","Stop","Pause what you are doing"],["🫧","Breathe","Take 3 slow belly breaths"],["🏷️","Name it","Say how you feel: “I feel angry”"],["✅","Choose","Pick a helpful next step"]],learn:"When a feeling gets big, follow 4 steps: Stop, Breathe, Name it, Choose. Put them in order!"},
{t:"Growth mindset",k:"q",learn:"Your brain grows when you practise! Instead of “I can’t do it”, say “I can’t do it <b>yet</b>.”",Q:[["Which is a growth mindset?",["“I can’t do this yet, but I’ll keep practising”","“I’m just bad at maths”"],0,"Yet is a powerful word."],["Mistakes help your brain…",["Learn and grow","Stop working"],0,"Every mistake is practice."]]}]},
{t:"Friends & Empathy",e:"🤝",d:"Understand and care for others",L:[
{t:"Walk in their shoes",k:"q",learn:"<b>Empathy</b> means trying to feel what someone else feels. Imagine you are in their shoes.",Q:[["A new pupil looks lonely on the first day. With empathy you think…",["“Being new is scary. I’ll say hi.”","“Not my problem.”"],0,"Empathy leads to kindness."],["Your friend lost a race and is upset. You say…",["“That’s tough. You tried hard.”","“You’re slow.”"],0,"Kind words help."]]},
{t:"Listening ears",k:"q",learn:"Good listeners look at the speaker, wait their turn and ask questions. It shows people they matter.",Q:[["Good listening means…",["Looking at the speaker and not interrupting","Playing on a phone"],0,"Full attention shows you care."],["Your friend tells a story. A good question is…",["“What happened next?”","“Can we talk about me?”"],0,"Questions show you’re interested."]]},
{t:"Saying sorry",k:"q",learn:"A real sorry has 3 parts: say what you did, say sorry, and say how you’ll fix it.",Q:[["Which sorry is best?",["“I’m sorry I took your pencil. I’ll give it back.”","“Sorry, whatever.”"],0,"Name it, say sorry, fix it."],["After saying sorry, you should…",["Try not to do it again","Do it again"],0,"Actions matter most."]]},
{t:"Everyone belongs",k:"q",learn:"People are different in many ways: languages, looks, abilities and families. Differences make the world richer, and everyone deserves respect.",Q:[["A classmate speaks a different language at home. That is…",["Something interesting about them","A reason to tease"],0,"Kenya is home to many languages!"],["A child uses a wheelchair. To include them in a game you…",["Choose a game everyone can play","Leave them out"],0,"Include everyone."]]},
{t:"Teamwork",k:"q",learn:"Great teams share ideas, listen, give everyone a job and cheer each other on.",Q:[["In a team project, the best plan is…",["Everyone gets a job","One person does everything"],0,"Teams work best together."],["A teammate’s idea is different from yours. You…",["Listen and talk about both","Ignore it"],0,"Different ideas make better solutions."]]}]},
{t:"Healthy Me",e:"🌙",d:"Sleep, movement and asking for help",L:[
{t:"Sleep power",k:"q",learn:"Sleep helps your brain learn and your body grow. Keep screens off before bed so you can fall asleep easily.",Q:[["Sleep helps your brain…",["Remember what you learned","Forget everything"],0,"Your brain sorts memories while you sleep."],["In the hour before bed, it’s best to…",["Read or relax without screens","Play exciting games"],0,"Calm time helps you fall asleep."]]},
{t:"Move your body",k:"q",learn:"Moving every day makes you stronger and happier: play football, dance, skip rope or go for a walk.",Q:[["After sitting for a long time you should…",["Stretch or move","Sit longer"],0,"Movement wakes up your brain."],["Which is good daily movement?",["Skipping rope with friends","Scrolling a phone"],0,"Fun movement counts!"]]},
{t:"Gratitude",k:"q",learn:"<b>Gratitude</b> means noticing good things. Thinking of 3 good things each day can help you feel happier.",Q:[["Which is a gratitude thought?",["“I’m thankful my friend helped me today”","“Nothing good ever happens”"],0,"Noticing good things grows happiness."],["When can you practise gratitude?",["Any day, any time","Only on birthdays"],0,"Try it tonight!"]],home:"At dinner, everyone shares one thing they are grateful for."},
{t:"Asking for help",k:"q",learn:"Everyone needs help sometimes. Talk to a parent, carer, teacher or another trusted grown-up. In Kenya you can also call Childline on 116 for free.",Q:[["Who is a trusted grown-up?",["A parent, carer or teacher you feel safe with","A stranger online"],0,"Choose someone you know and feel safe with."],["Asking for help is…",["Brave and smart","Weak"],0,"Strong people ask for help."]]},
{t:"My calm plan",k:"q",learn:"A calm plan lists what helps YOU feel better: breathing, drawing, music, a walk or a hug from someone you trust.",Q:[["A calm plan is…",["Your list of things that help you feel better","A maths test"],0,"Everyone’s plan is different."],["Which could go on a calm plan?",["Drawing or a short walk","Shouting at people"],0,"Choose healthy helpers."]],home:"Make your own calm plan on paper and stick it somewhere you’ll see it."}]}]},
grow:{t:"Growing Up",e:"🌱",c:"#7B4DE0",d:"Body, friends, future and changing the world",topics:[
{t:"Me and My Body",e:"📏",d:"Growing, staying clean and safe",L:[
{t:"Growing at your pace",k:"q",learn:"Bodies and voices change at different times for everyone. There is no “right” time. Questions? Ask a parent, carer or school nurse.",Q:[["Your voice and body are changing. That is…",["Wrong","Normal for growing up"],1,"Everyone goes through it."],["A friend grows faster than you. This means…",["Something’s wrong","Everyone has their own pace"],1,"No two bodies grow the same."]]},
{t:"Clean and healthy",k:"q",learn:"Washing hands with soap, brushing teeth twice a day and bathing keep germs away.",Q:[["When should you wash your hands with soap?",["Before eating and after the toilet","Only on Sundays"],0,"Clean hands stop germs."],["How often should you brush your teeth?",["Twice a day","Once a week"],0,"Morning and night!"]]},
{t:"My body belongs to me",k:"q",learn:"Your body belongs to you. If anyone touches you in a way that feels wrong, or asks you to keep a secret about touching, say no, get away and tell a trusted grown-up. It is never your fault.",Q:[["Someone asks you to keep a secret that makes you feel uncomfortable. You…",["Tell a trusted grown-up","Keep it forever"],0,"Unsafe secrets should always be told."],["If something unsafe happens, whose fault is it?",["Never the child’s","The child’s"],0,"It is never your fault."]]},
{t:"Eat a rainbow",k:"q",learn:"Eating many colours of food, like sukuma wiki, carrots, beans, fruit and ugali, gives your body what it needs to grow. Clean water helps too.",Q:[["Which plate has the most colours?",["Ugali, sukuma wiki, beans and carrots","Just white bread"],0,"Different colours give different goodness."],["When you’re thirsty, the best drink is usually…",["Clean water","Soda"],0,"Water keeps your body working well."]]},
{t:"Proud to be me",k:"q",learn:"Everyone is unique. Be proud of what makes you, you, and remember that many photos online are edited to look “perfect”.",Q:[["Photos online are often…",["Edited or filtered","Always real"],0,"Many photos are changed to look perfect."],["What makes you special?",["Being uniquely you","Looking like someone else"],0,"There’s only one you!"]]}]},
{t:"Friends and Me",e:"🤝",d:"Respect and good choices",L:[
{t:"Being a good friend",k:"q",learn:"Good friends listen, share, include others and say sorry.",Q:[["A classmate sits alone. Kind move?",["Ignore it","Invite them to join"],1,"Small kindness, big difference."],["A friend hurt you. You can…",["Say how you feel, calmly","Never speak again"],0,"Talking helps friendships grow."]]},
{t:"Saying no",k:"q",learn:"You can say no to things that feel wrong, even to friends. Your body and choices belong to you.",Q:[["A friend wants you to do something unsafe. You…",["Say no and walk away","Go along"],0,"Real friends respect your no."],["If you feel unsafe, you should…",["Keep quiet","Tell a trusted adult"],1,"Telling is always right."]]},
{t:"Peer pressure",k:"q",learn:"<b>Peer pressure</b> is when friends push you to do something. Good pressure helps you try new things. Bad pressure pushes you to do unsafe or unkind things.",Q:[["Friends dare you to cross a busy road without looking. You…",["Say no and stay safe","Do it to look cool"],0,"Safety beats a dare."],["Which is good peer pressure?",["Friends encouraging you to join the science club","Friends telling you to skip school"],0,"Good friends push you to grow."]]},
{t:"Solving conflicts",k:"q",learn:"When friends disagree: cool down, take turns to talk, listen, and find a solution you both like.",Q:[["You and a friend want different games. A fair fix is…",["Take turns choosing","Shout until you win"],0,"Taking turns is fair."],["The first step when you’re very angry with a friend?",["Cool down","Say something mean"],0,"Calm first, talk second."]]},
{t:"Respect differences",k:"q",learn:"Friends can be different from you in religion, language, culture and ideas. Respect means being kind even when you disagree.",Q:[["Your friend believes something different from you. Respect means…",["Listening kindly","Laughing at them"],0,"Kindness, even when you disagree."],["Learning about other cultures is…",["Interesting and fun","A waste of time"],0,"Africa has so many amazing cultures!"]]}]},
{t:"Future You",e:"🚀",d:"Careers and African innovators",L:[
{t:"Jobs of the future",k:"vid",v:[["🚀","Many jobs of the future don’t even exist yet!"],["🤖","AI engineers build smart systems that help people."],["📊","Data engineers, like DigiSoma’s founder Allan, use data to solve problems."],["🌾","Agri-tech experts help farmers grow more food."],["🌍","Africa needs creators, coders and dreamers. That could be you!"]]},
{t:"Your big dream",k:"dream"},
{t:"African tech heroes",k:"q",learn:"Africa builds amazing tech! M-Pesa, made in Kenya, lets people send money by phone. Ushahidi, also from Kenya, maps reports during emergencies. Zipline drones carry medicine to clinics in Rwanda.",Q:[["Which Kenyan invention lets people send money with a phone?",["M-Pesa","Bluetooth","Email"],0,"M-Pesa changed how millions of people pay."],["Drones in Rwanda deliver…",["Pizza","Medicine to clinics","Homework"],1,"Fast deliveries help clinics far from cities."]],X:["Ushahidi helps people during emergencies by…",["Mapping reports people send in","Selling phones"],0,"Many small reports on a map show where help is needed."],home:"Ask a grown-up how M-Pesa changed the way your family pays for things."},
{t:"Careers in tech",k:"q",learn:"Tech careers include software developer, data scientist, AI engineer, cybersecurity expert, game designer and robotics engineer.",Q:[["Who keeps computers safe from hackers?",["A cybersecurity expert","A chef"],0,"Cybersecurity experts are digital guards."],["Who finds patterns in data to answer questions?",["A data scientist","A pilot"],0,"Data scientists are data detectives."]],X:["Which skill helps in almost every tech career?",["Problem solving","Memorising phone numbers"],0,"Tech is all about solving problems."]},
{t:"Young entrepreneur",k:"q",learn:"An <b>entrepreneur</b> starts a business to solve a problem. Many great businesses started small, like a mandazi stand or a phone repair kiosk.",Q:[["An entrepreneur starts by finding…",["A problem people have","A fancy logo"],0,"Great businesses solve real problems."],["You sell 10 mandazi at KSh 10 each. You earn…",["KSh 100","KSh 20","KSh 1,000"],0,"10 × 10 = 100."]]}]},
{t:"Make a Difference",e:"🌍",d:"Design thinking and tech for good",L:[
{t:"Design thinking",k:"order",steps:[["❤️","Empathise","Understand the people with the problem"],["🎯","Define","Say exactly what the problem is"],["💡","Ideate","Think of lots of ideas"],["🛠️","Prototype","Build a quick model"],["🧪","Test","Try it out and improve it"]],learn:"Inventors solve problems in 5 steps: empathise, define, ideate, prototype and test. Put them in order!"},
{t:"Problems in my community",k:"q",learn:"Inventors start by noticing problems around them: long queues for water, rubbish in the street, or children walking far to school.",Q:[["Which is a problem an inventor could solve?",["Rubbish piling up at the market","The sky being blue"],0,"Real problems lead to real solutions."],["Before building a solution, you should…",["Talk to the people who have the problem","Guess"],0,"Listening is the first step."]]},
{t:"Tech for good in Africa",k:"q",learn:"African innovators use tech to help people. M-KOPA in Kenya lets families pay for solar power bit by bit using their phones, and drones in Rwanda carry medicine to clinics.",Q:[["Pay-as-you-go solar helps families…",["Get electricity with small payments","Buy video games"],0,"Small phone payments make solar affordable."],["Medicine drones help clinics that are…",["Far from cities","Inside shopping malls"],0,"Drones fly over difficult roads quickly."]]},
{t:"Test and improve",k:"q",learn:"Inventions rarely work the first time. Test them, ask for feedback and improve. Every version gets better.",Q:[["Your prototype breaks. You…",["Find out why and improve it","Quit forever"],0,"Failing is part of inventing."],["Feedback is…",["Helpful ideas to make it better","An insult"],0,"Feedback makes inventions better."]]},
{t:"My project plan",k:"q",learn:"Plan your own project: pick a problem, who it helps, your idea, and what you need to build it.",Q:[["The first part of a project plan is…",["The problem you want to solve","The price"],0,"Start with the problem."],["Who should you ask for feedback?",["The people your idea will help","Nobody"],0,"Users know best."]],home:"Draw your invention idea on paper and explain it to someone at home."}]}]},
hw:{t:"Hardware Hub",e:"🔌",c:"#0E7490",d:"Circuits, sensors, chips and robots",topics:[
{t:"Electricity & Circuits",e:"⚡",d:"Power, loops and safety",L:[
{t:"What is electricity?",k:"vid",v:[["⚡","Electricity is energy that can flow through wires."],["🔋 ☀️","Batteries and solar panels push electricity around."],["🔁","It flows in a loop called a circuit. Break the loop, and everything stops."],["💡","When electricity flows through an LED, it lights up!"],["⚠️","Mains electricity is dangerous. Only experiment with small batteries and a grown-up."]]},
{t:"Complete the circuit",k:"q",learn:"Electricity only flows in a complete loop called a <b>circuit</b>. A switch works by making a gap in the loop, which stops the flow.",Q:[["A torch won’t light and one wire has come loose. Why?",["The circuit is broken, so electricity can’t flow","The bulb is too happy"],0,"Any gap in the loop stops the electricity."],["When you switch a light OFF, the switch…",["Makes a gap in the circuit","Adds more electricity"],0,"Off means open: there’s a gap."]],X:["In a circuit, electricity flows from the battery’s…",["+ side, around the loop, back to the − side","− side to the sky"],0,"Current flows round the loop from + to −."]},
{t:"Conductors and insulators",k:"q",learn:"<b>Conductors</b> let electricity flow, like copper and other metals. <b>Insulators</b> block it, like plastic, rubber and dry wood. That’s why wires are covered in plastic.",Q:[["Which is a good conductor?",["A copper wire","A plastic spoon"],0,"Metals like copper conduct electricity."],["Why are wires covered in plastic?",["Plastic is an insulator that keeps us safe","To make them taste nice"],0,"The plastic stops electricity reaching your hand."]]},
{t:"Batteries and solar",k:"q",learn:"A <b>battery</b> stores energy. A <b>solar panel</b> turns sunlight into electricity. Kenya gets lots of sunshine, so solar power is used in many homes and schools.",Q:[["What does a solar panel do?",["Turns sunlight into electricity","Makes rain"],0,"Panels capture the sun’s energy."],["A solar lamp charges in the day. At night it uses energy stored in its…",["Battery","Shadow"],0,"The battery saves daytime energy for the night."]]},
{t:"Stay safe with electricity",k:"q",learn:"Never touch sockets or switches with wet hands, never poke things into sockets, and stay far away from fallen power lines. Tell a grown-up straight away.",Q:[["You see a power line lying on the ground after a storm. You…",["Stay far away and tell a grown-up","Go closer to look"],0,"Fallen lines can still be live and deadly."],["Is it safe to touch a switch with wet hands?",["No","Yes"],0,"Water and electricity are a dangerous mix."]]}]},
{t:"Sensors & Actuators",e:"🌡️",d:"How machines sense and move",L:[
{t:"Electronic senses",k:"q",learn:"<b>Sensors</b> are a machine’s senses. A light sensor ‘sees’ brightness, a temperature sensor ‘feels’ heat, and a microphone ‘hears’ sound.",Q:[["Which sensor could tell when it gets dark?",["A light sensor","A speaker"],0,"Light sensors measure brightness."],["Your phone turns its screen sideways when you rotate it. It uses…",["A motion sensor","A battery only"],0,"An accelerometer senses movement."]]},
{t:"Actuators make things happen",k:"q",learn:"<b>Actuators</b> turn electrical signals into action: motors spin, LEDs glow, buzzers beep and pumps move water.",Q:[["Which is an actuator?",["A motor","A temperature sensor"],0,"Motors create movement."],["A buzzer that beeps when a door opens is…",["An actuator","A sensor"],0,"It produces sound, which is an action."]]},
{t:"Input, process, output",k:"order",steps:[["🌡️","Input","A sensor measures the soil"],["🧠","Process","A chip compares it with a rule"],["🚿","Output","A pump waters the plants"]],learn:"Every smart machine works in 3 steps: <b>input</b> from a sensor, <b>process</b> in a computer chip, and <b>output</b> from an actuator. Put them in order!"},
{t:"Sensors around Kenya",k:"q",learn:"Sensors help everywhere: weather stations measure rain for farmers, smart water meters spot leaks, and phones use GPS to find your location.",Q:[["A weather station helps farmers by…",["Measuring rain and temperature","Selling seeds"],0,"Weather data helps farmers plan."],["A smart water meter can warn a family about…",["A leaking pipe","A football score"],0,"Sensors spot unusual water use."]]},
{t:"Invent a gadget",k:"q",learn:"Inventors combine a sensor and an actuator to solve a problem. A night light = light sensor + LED. A door alarm = motion sensor + buzzer.",Q:[["To make a lamp that turns on by itself at night, you need…",["A light sensor and an LED","A motor and a fan"],0,"The sensor notices dark, then the LED lights up."],["To warn when water in a tank is low, you could use…",["A water-level sensor and a buzzer","A light sensor and a motor"],0,"Measure the water, then sound an alarm."]],X:["A fan that turns on when it’s hot needs a temperature sensor, a motor and…",["A microcontroller to decide","Nothing else"],0,"A chip runs the rule: IF hot THEN fan on."]}]},
{t:"Microcontrollers",e:"🖥️",d:"Tiny computers you can program",L:[
{t:"Tiny computers everywhere",k:"vid",v:[["🖥️","A microcontroller is a tiny computer on a single chip."],["🧺 🚗 📱","They hide inside washing machines, cars, phones and toys."],["🔌","Pins connect them to sensors and motors."],["📝","You write code, upload it, and the hardware follows it!"],["🤖","Add sensors and motors, and you’ve built a robot!"]]},
{t:"Meet the microcontroller",k:"q",learn:"A <b>microcontroller</b> is a small computer chip that runs one program over and over. Learners around the world build projects with boards like the micro:bit and Arduino.",Q:[["A microcontroller is…",["A tiny computer on a chip","A type of battery"],0,"It runs your code inside gadgets."],["Where might you find a microcontroller?",["Inside a washing machine","Inside a mango"],0,"Many machines have one inside."]]},
{t:"Pins: in and out",k:"q",learn:"A microcontroller has <b>pins</b>. <b>Input pins</b> read sensors and buttons. <b>Output pins</b> control LEDs, buzzers and motors.",Q:[["A button connects to an…",["Input pin","Output pin"],0,"The chip reads the button as an input."],["An LED connects to an…",["Output pin","Input pin"],0,"The chip sends power out to light it."]]},
{t:"Blink: your first hardware code",k:"q",learn:"The first hardware program most people write is <b>Blink</b>: turn the LED on, wait 1 second, turn it off, wait 1 second, and repeat forever. That’s a loop!",Q:[["What makes Blink repeat forever?",["A loop","The battery"],0,"The code runs inside a loop."],["To make the LED blink faster, you should…",["Wait for less time","Wait for more time"],0,"Shorter waits mean faster blinks."]],X:["In MicroPython, which line pauses for 1 second?",["sleep(1000)","led.on()"],0,"On a micro:bit, sleep(1000) waits 1000 milliseconds."]},
{t:"On, off and binary",k:"q",learn:"Digital pins are either <b>on (1)</b> or <b>off (0)</b>. That’s binary again! Eight on/off switches together can store any number from 0 to 255.",Q:[["A digital pin that is ON is written as…",["1","0"],0,"1 means on."],["How many states can one digital pin have?",["2","10"],0,"Just on or off."]],X:["Eight bits (on/off switches) can store how many different values?",["256","8","100"],0,"2 × 2 × … eight times = 256."]}]},

/* ---------- LESSON (focus mode) ---------- */
function lesson(w,t,l){const W=D[w],T=W.topics[t],N=T.L[l],t0=Date.now();
  if(l>0&&!st(w,t,l-1)){toast("🔒 Finish the lesson before this one first!");location.hash="learn/"+w;return}
  S.l=`${w}/${t}/${l}`;save();

  <div class="lc"><div class="dh" style="background:${W.c}"><small>${W.e} ${W.t} · ${T.t}</small><h2>${N.t}</h2></div><div id="st"></div></div>`;
  const box=$("#st");prog(.08);
  const fin=s=>{const old=st(w,t,l),lv0=Math.floor(xp()/100);if(s>old){S.p[key(w,t,l)]=s;S.sg=S.sg||{};S.sg[today()]=(S.sg[today()]||0)+s-old}
    const d=today();if(S.d!=d){S.s=S.d==yday()?S.s+1:1;S.d=d}S.b=Math.max(S.b||0,S.s);S.h[d]=(S.h[d]||0)+1;S.mn[d]=(S.mn[d]||0)+Math.max(1,Math.min(30,Math.round((Date.now()-t0)/6e4)));
    [S.h,S.mn].forEach(o=>Object.keys(o).sort().slice(0,-30).forEach(k=>delete o[k]));
