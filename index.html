<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="DigiSoma: fun lessons in coding, AI, online safety and wellbeing for African kids aged 6 to 16.">
<meta name="theme-color" content="#3B1F8F">
<title>DigiSoma Prototype</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Plan: violet + sunshine world, one colour per world, chunky 3D buttons, Zuri the robot as guide. Profiles > Home > World > Topic > Lesson. */
:root{--ink:#1E1147;--bg:#F4F0FF;--sun:#FFC93C;--vio:#3B1F8F;--soft:#E5E0F7;--mint:#12A87F;--pink:#FF5D8F;color-scheme:light}
*{box-sizing:border-box}
body{margin:0;font-family:Fredoka,"Trebuchet MS",system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:18px;line-height:1.5}
a{color:inherit;text-decoration:none}button{font:inherit;cursor:pointer;color:inherit}:focus-visible{outline:4px solid var(--sun);outline-offset:3px}
header{position:sticky;top:0;z-index:5;background:var(--vio);color:#fff;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 20px;flex-wrap:wrap}
.logo{font-weight:700;font-size:28px}.logo b{color:var(--sun)}
.stats{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.chip{background:rgba(255,255,255,.15);border-radius:99px;padding:3px 13px;font-weight:600;font-size:16px;border:0;color:#fff;white-space:nowrap}
button.chip:hover{background:rgba(255,255,255,.28)}
.bar{width:80px;height:14px;border-radius:99px;background:rgba(255,255,255,.2);overflow:hidden}.bar i{display:block;height:100%;width:0;background:var(--sun);transition:width .5s}
.wrap{max-width:1050px;margin:0 auto}
.hero,.screen{background:linear-gradient(120deg,#3B1F8F,#6A3CE0);color:#fff;padding:28px 20px 70px;border-radius:0 0 40px 40px}
.screen{padding-bottom:50px;min-height:calc(100vh - 60px)}
.hero .wrap{display:grid;grid-template-columns:1.2fr 1fr;gap:20px;align-items:center}
h1{font-size:clamp(34px,6vw,54px);line-height:1.05;margin:0 0 12px}.hero p{font-size:20px;margin:0 0 14px}
.ages,.seg{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:6px}.ages button,.seg button{border:0;border-radius:99px;padding:6px 14px;background:rgba(255,255,255,.18);color:#fff;font-weight:600;font-size:15px}.ages .on{background:var(--sun);color:var(--ink)}
.seg button{background:var(--bg);color:var(--ink);border:3px solid transparent}.seg .on{background:#FFF1C4;border-color:var(--sun)}
.tk{font-size:15px;opacity:.85;margin:0 0 12px!important}
input{font:inherit;border:0;border-radius:99px;padding:10px 18px}
.cta,.go{background:var(--sun);color:var(--ink);border:0;border-radius:99px;padding:12px 24px;font-weight:700;box-shadow:0 5px 0 #C79A00;display:inline-block}
.go{background:var(--vio);color:#fff;box-shadow:0 5px 0 #1E1147;margin:6px 4px;font-size:17px}.go.alt{background:#6F6596;box-shadow:0 5px 0 #4A4270}.go.red{background:#C21E50;box-shadow:0 5px 0 #7E1236}
.cta:active,.go:active{transform:translateY(3px);box-shadow:none}.go:disabled{opacity:.45;cursor:not-allowed;transform:none;box-shadow:none}
.mascot{text-align:center}.bz{width:min(250px,70%);cursor:pointer;animation:bob 3s ease-in-out infinite}
.sw button{width:28px;height:28px;border-radius:50%;border:3px solid #fff;margin:4px 3px}
.say{background:#fff;color:var(--ink);border-radius:22px;padding:10px 18px;display:inline-block;max-width:360px;font-weight:500;font-size:17px;position:relative;margin-bottom:14px}
.say:after{content:"";position:absolute;bottom:-11px;left:50%;margin-left:-11px;border:11px solid transparent;border-top-color:#fff;border-bottom:0}
.tts{border:0;background:var(--soft);border-radius:99px;padding:0 8px;font-size:16px;margin-left:4px;vertical-align:middle}
.eye{transform-origin:center;transform-box:fill-box;animation:blink 4s infinite}
@keyframes bob{50%{transform:translateY(-10px)}}@keyframes blink{0%,94%,100%{transform:scaleY(1)}97%{transform:scaleY(.1)}}
section{padding:36px 20px}h2{font-size:clamp(26px,4vw,34px);margin:0 0 6px}.sub{margin:0 0 20px;opacity:.8}
.duo{display:grid;grid-template-columns:1.5fr 1fr;gap:16px;margin-top:-56px;position:relative}
.mis,.wotd{border-radius:24px;padding:16px 20px;display:flex;gap:14px;align-items:center}
.mis{background:#fff;box-shadow:0 8px 0 rgba(30,17,71,.12)}.mis .em,.wotd .em{font-size:44px;line-height:1}.mis small,.wotd small{display:block;font-weight:600;opacity:.7;font-size:14px;text-transform:uppercase;letter-spacing:.05em}.mis b{font-size:21px;display:block;line-height:1.2}
.wotd{background:var(--sun);box-shadow:0 8px 0 #C79A00}.wotd b{font-size:24px;display:block;line-height:1.1}
.worlds{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:18px}
.w{display:block;border-radius:28px;color:#fff;padding:20px;min-height:190px;box-shadow:0 8px 0 rgba(0,0,0,.22);transition:transform .15s}
.w:hover{transform:translateY(-6px) rotate(-1deg)}.w .em{font-size:50px;line-height:1.1;display:block}.w h3{margin:6px 0 2px;font-size:24px}.w .d{font-size:16px}
.pb{height:10px;background:rgba(255,255,255,.3);border-radius:9px;margin-top:10px;overflow:hidden}.pb i{display:block;height:100%;background:#fff}.pb.dk{background:var(--soft)}
.prog{display:block;font-size:15px;font-weight:600;margin-top:6px}
.row{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:16px}
.card{background:#fff;border-radius:24px;padding:16px 20px;border:4px solid transparent}.card.now{border-color:var(--sun)}.card small{opacity:.8}
.b{background:#fff;border-radius:22px;padding:10px 14px;text-align:center;width:128px}.b span{font-size:36px;display:block}.b small{display:block;font-size:13px;opacity:.75;line-height:1.2}.b.off{filter:grayscale(1);opacity:.4}.badges{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:24px}
.price{max-width:420px;margin:0 auto;background:var(--sun);border-radius:36px;padding:26px;text-align:center;box-shadow:0 10px 0 #C79A00}
.price .n{font-size:60px;font-weight:700;line-height:1}.price .n small{font-size:22px;font-weight:500}.price ul{list-style:none;padding:0;text-align:left;font-weight:500;margin:12px 0}.price li:before{content:"✔ ";color:var(--vio)}
.cr{max-width:1050px;margin:0 auto;padding:16px 20px 0;font-weight:500}.cr a{color:var(--vio);text-decoration:underline}.page{padding:14px 20px 50px}
.path{display:grid;gap:18px;max-width:560px;margin:10px auto}
.node{display:flex;align-items:center;gap:14px;background:#fff;border-radius:99px;padding:12px 24px;width:84%;box-shadow:0 6px 0 rgba(30,17,71,.15);border:4px solid var(--c);transition:transform .15s}
.node:nth-child(even){margin-left:auto}a.node:hover{transform:scale(1.03)}.node.lock{opacity:.45;border-color:#999}.node .em{font-size:32px}.node b{display:block;font-size:20px;line-height:1.2}.node small{font-size:15px}
.lc,dialog{background:#fff;border-radius:32px;overflow:hidden;box-shadow:0 10px 0 rgba(30,17,71,.15);color:var(--ink)}.lc{max-width:640px;margin:10px auto}
dialog{border:0;padding:0;width:min(580px,94vw);max-height:92vh;overflow:auto}dialog::backdrop{background:rgba(30,17,71,.7)}
.dh{color:#fff;padding:14px 24px}.dh h3{margin:0;font-size:25px}#st,.pbody{padding:20px 24px 24px}
.zrow{display:flex;gap:12px;align-items:center;margin-bottom:12px}.zrow svg{flex:none}.zrow .say{margin:0;background:var(--bg)}.zrow .say:after{display:none}
.step{margin:0;font-size:15px;opacity:.7;display:block}.c{text-align:center}
.opts{display:grid;gap:10px;margin:12px 0}.opt{background:var(--bg);border:3px solid transparent;border-radius:18px;padding:12px 16px;text-align:left;font-weight:500}
.opt:hover{border-color:var(--vio)}.opt.good{background:#C9F5E4;border-color:var(--mint)}.opt.bad{background:#FFD6E1;border-color:var(--pink)}
.grid{display:grid;gap:6px;margin:10px auto}.cell{aspect-ratio:1;background:var(--bg);border-radius:14px;display:grid;place-items:center;font-size:clamp(22px,6vw,32px)}.cell.st{background:#FFF1C4}
.pad{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:6px 0}.ar{background:#E1E7FF;border:0;border-radius:14px;padding:8px 16px;font-size:24px;box-shadow:0 4px 0 #B9C2EE}.ar:active{transform:translateY(3px);box-shadow:none}
.ar.lp{background:#FFE7A8;box-shadow:0 4px 0 #D9B24A;font-size:18px;font-weight:600}
.q{min-height:48px;background:var(--bg);border-radius:14px;padding:8px;text-align:center;font-size:24px;display:flex;flex-wrap:wrap;gap:4px;justify-content:center;align-items:center}
.q span{border-radius:10px;padding:0 4px}.q .hl{background:var(--sun)}.q small{font-size:16px}.q .loop{background:#FFF1C4;border:2px dashed #D9B24A}
pre{background:#1E293B;color:#7CF5D0;border-radius:14px;padding:12px;text-align:left;font-size:14px;overflow:auto;margin:10px 0}
.moods{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}.moods button{background:var(--bg);border:3px solid transparent;border-radius:20px;padding:6px 12px;font-size:34px;line-height:1.2}.moods button:hover{border-color:var(--vio)}.moods small{display:block;font-size:14px;font-family:inherit}
.breath{width:90px;height:90px;border-radius:50%;background:#B9A6FF;margin:16px auto;animation:br 8s ease-in-out infinite;display:grid;place-items:center;font-weight:600}@keyframes br{0%,100%{transform:scale(.6)}50%{transform:scale(1.15)}}
.big{font-size:54px;text-align:center}
.help{background:#FFF1C4;border-radius:16px;padding:10px 14px;font-size:16px}
.homecard{background:#E2F8EE;border-radius:18px;padding:12px 16px;margin:12px 0;font-size:16px}
.phone{max-width:330px;margin:10px auto;background:var(--ink);border-radius:32px;padding:14px 14px 20px;color:#fff}.pt{font-size:13px;opacity:.7;text-align:center}.from{font-weight:600;margin:10px 4px 6px}.msgb{background:#fff;color:var(--ink);border-radius:18px 18px 18px 4px;padding:12px 14px;font-size:16px}
.pw{width:100%;border:3px solid var(--soft);border-radius:16px;font-size:22px;padding:10px 14px;margin:6px 0;background:var(--bg)}
.meter{height:14px;background:var(--soft);border-radius:99px;overflow:hidden}.meter i{display:block;height:100%;width:0;transition:width .3s}
.ck{list-style:none;padding:0;columns:2;font-size:16px;margin:8px 0}.ck .y{color:#0B7A5C;font-weight:600}
.mrow{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:10px 0}.mrow div{text-align:center;width:96px}.mrow small{display:block;font-size:13px;line-height:1.25}
.ob{background:#fff;color:var(--ink);border-radius:32px;max-width:540px;margin:10px auto;padding:24px;box-shadow:0 10px 0 rgba(0,0,0,.2)}
.ob label{display:block;font-weight:600;margin:14px 0 6px}.ob input{width:100%;background:var(--bg);border:3px solid var(--soft);font-size:20px}
.avs{display:flex;gap:8px;flex-wrap:wrap}.avs button{font-size:34px;background:var(--bg);border:3px solid transparent;border-radius:18px;padding:2px 10px}.avs .on{border-color:var(--vio);background:#FFF1C4}
.kids{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:16px;max-width:720px;margin:20px auto}
.kc{background:#fff;color:var(--ink);border:0;border-radius:28px;padding:20px;text-align:center;box-shadow:0 8px 0 rgba(0,0,0,.2);transition:transform .15s}.kc:hover{transform:translateY(-4px)}.kc .av{font-size:64px;display:block;line-height:1.1}.kc b{font-size:22px;display:block}.kc small{opacity:.75}
.kc.add{background:rgba(255,255,255,.12);color:#fff;border:3px dashed rgba(255,255,255,.6);box-shadow:none}
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:8px 0 14px}.tile{background:var(--bg);border-radius:16px;padding:8px 10px;font-size:14px;line-height:1.2}.tile b{font-size:24px;display:block;line-height:1.15}
.wk{display:flex;gap:6px;align-items:flex-end;height:96px;margin:8px 0 2px}.wk div{flex:1;text-align:center;font-size:13px}.wk i{display:block;background:var(--vio);border-radius:6px 6px 0 0;margin:0 auto 2px;width:70%;min-height:3px}
.ptabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}.ptabs button{border:2px solid var(--soft);background:#fff;border-radius:99px;padding:4px 12px}.ptabs .on{background:var(--vio);color:#fff;border-color:var(--vio)}
.note{font-size:14px;opacity:.85;border-top:2px dashed var(--soft);margin-top:14px;padding-top:10px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 22px;border-radius:99px;font-weight:600;z-index:40;box-shadow:0 6px 20px rgba(0,0,0,.3);text-align:center;max-width:92vw}
.cf{position:fixed;top:-30px;font-style:normal;font-size:28px;z-index:30;pointer-events:none;animation:fall 2s ease-in forwards}@keyframes fall{to{transform:translate(var(--dx),105vh) rotate(360deg)}}
footer{text-align:center;padding:24px;opacity:.75;font-size:15px}
@media(max-width:760px){.hero .wrap,.duo{grid-template-columns:1fr}.node{width:100%}.tiles{grid-template-columns:repeat(2,1fr)}.bar,#lvl{display:none}.chip{font-size:15px;padding:3px 10px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

<ellipse class="eye" cx="78" cy="94" rx="10" ry="13" fill="#7CF5D0"/><ellipse class="eye" cx="122" cy="94" rx="10" ry="13" fill="#7CF5D0"/>

const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const esc=s=>String(s).replace(/[&<>"']/g,c=>"&#"+c.charCodeAt(0)+";"),strip=s=>s.replace(/<[^>]+>/g,"");
const calm=matchMedia("(prefers-reduced-motion: reduce)").matches,canTalk="speechSynthesis" in window;
const TT=["Explorer","Maker","Inventor","Wizard","Legend"],AV=["🦁","🦒","🐘","🦓","🐆","🦜","🐢","🦩"];
const AG=["Sprouts · 6–8","Builders · 9–12","Pioneers · 13–16"],HL=["Ready to train your first AI robot?","Build smart AI logic and beat online tricks!","Go from block code to real AI and Python!"];
const TK=["Sprouts get easier maths and a 🔊 read-aloud helper.","Builders see the Python version of their robot code.","Pioneers get Python, harder maths and ⚡ bonus questions."];
const WD=[["Kompyuta","Computer","💻"],["Akili bandia","Artificial intelligence (AI)","🧠"],["Programu","Program or app","📱"],["Nenosiri","Password","🔐"],["Mtandao","Internet or network","🌍"],["Roboti","Robot","🤖"],["Simu janja","Smartphone","📲"]];
const D={
code:{t:"Code & AI Lab",e:"🤖",c:"#4361EE",d:"Teach robots, understand AI",topics:[
{t:"Robot Basics",e:"🕹️",d:"Tell a robot what to do",L:[{t:"Guide Zuri",k:"robot",lv:0,home:"Be the robot! Ask someone at home to give you arrow steps to walk from the door to the kitchen."},{t:"Dodge the rocks",k:"robot",lv:1},{t:"Mango delivery",k:"robot",lv:2,home:"Draw a map of your street on paper and write the steps to get to the duka."}]},
{t:"Loops",e:"🔁",d:"Repeat without rewriting",L:[
{t:"Spot the pattern",k:"q",learn:"A loop repeats steps for you. Instead of writing ➡️➡️➡️➡️, you say “repeat 4 times: ➡️”. Programmers use loops every day.",Q:[["Clap, stomp, clap, stomp, clap, stomp. How many times does “clap, stomp” repeat?",["2","3","4"],1,"Three times. You just found a loop!"],["Which code is shorter?",["➡️➡️➡️➡️➡️","🔁×5 [ ➡️ ]"],1,"Loops save you from writing the same step again and again."]],X:["In Python, for i in range(3): repeats the code…",["3 times","4 times","Forever"],0,"range(3) counts 0, 1, 2, so the code runs three times."]},
{t:"Rooftop garden",k:"robot",lv:3,home:"Make up a dance with a repeating pattern, then teach it to someone using “repeat 3 times”."}]},
{t:"How AI Works",e:"🧠",d:"See, think, act, learn",L:[
{t:"See, Think, Act",k:"order",learn:"Every AI robot works in 3 steps. It sees the world, thinks about what it saw, then acts."},
{t:"Teach the AI",k:"train",learn:"Let’s build a mango-sorting AI! First you teach it with examples. Then we test it on mangoes it has never seen.",home:"Sort fruit at home into ripe and not ripe. What clues did you use? AI calls those clues “features”."},
{t:"Learning from examples",k:"q",learn:"AI isn’t told every rule. It studies lots of examples, like cat photos, and finds patterns.",Q:[["How does AI learn to spot a cat?",["It’s born knowing","It studies lots of cat photos"],1,"Examples are what AI learns from."],["Next in the pattern: 🔴🔵🔴🔵 ?",["🔴","🔵","🟢"],0,"Spotting patterns is what AI does best."]],X:["The examples an AI learns from are called…",["Training data","Wi-Fi","A charger"],0,"Training data shapes everything the AI learns."]},
{t:"Using AI wisely",k:"q",learn:"AI can be wrong. Check facts with a book or a grown-up, and keep private things private.",Q:[["An AI says something odd. You…",["Believe it","Check another source"],1,"AI makes mistakes, so double-check."],["Tell an AI your home address?",["Sure","No, keep it private"],1,"Private stays private, even with robots."]],X:["An AI learned only from photos of one country. It may…",["Work the same everywhere","Make more mistakes with other places and faces"],1,"That is called bias. Varied data makes fairer AI."]}]}]},
math:{t:"Math Arena",e:"🧮",c:"#C2570C",d:"Numbers, puzzles, real life",topics:[
{t:"Number Power",e:"🔢",d:"New puzzles every time, set to your age",L:[{t:"Add and subtract",k:"math",m:0},{t:"Times tables",k:"math",m:1}]},
{t:"Math in Real Life",e:"🛒",d:"Money sense",L:[{t:"Shopping with shillings",k:"q",learn:"To find your change, subtract. Pay KSh 100 for something that costs KSh 60 and you get 100 − 60 = 40 back.",Q:[["3 mandazi at KSh 20 each. Total?",["KSh 40","KSh 60","KSh 80"],1,"3 × 20 = 60."],["Pay KSh 100 for KSh 65. Change?",["KSh 25","KSh 35","KSh 45"],1,"100 − 65 = 35."]],X:["You save KSh 50 a week. How long to reach KSh 400?",["6 weeks","8 weeks","10 weeks"],1,"400 ÷ 50 = 8."],home:"Next time at the duka, work out the change before the shopkeeper does!"}]}]},
safe:{t:"Cyber Shield",e:"🛡️",c:"#0B7A5C",d:"Smart, kind and balanced online",topics:[

{t:"Scam or safe?",k:"scam",learn:"Scammers send messages that look real. Red flags: a rush, a prize, a secret, or a request for money, PINs or photos.",home:"With a grown-up, look through recent SMS messages together. Can you spot any scams?"},
{t:"Password builder",k:"pass",learn:"Strong passwords are long and mixed. A great trick: three random words plus a number and a symbol.",home:"With a grown-up, check that family accounts use long passphrases, not names or birthdays."}]},
{t:"Be Kind Online",e:"💬",d:"Bullying and balance",L:[
{t:"If someone is mean",k:"q",learn:"If someone is unkind online: don’t reply, save proof, block them, tell a grown-up. It’s never your fault.",Q:[["First step if someone bullies you online?",["Be mean back","Don’t reply, tell a grown-up"],1,"Getting help is the brave move."],["Is bullying ever your fault?",["Yes","Never"],1,"Never."]]},
{t:"Screen balance",k:"q",learn:"Try the 20-20-20 rule: every 20 minutes, look at something 20 feet away for 20 seconds. Sleep, play and friends matter too.",Q:[["The 20-20-20 rule helps your…",["Eyes","Shoes"],0,"Looking far away rests tired eyes."],["Screens right before bed…",["Help you sleep","Make sleep harder"],1,"Screen light keeps your brain awake."]],home:"Agree on a family “screens off” time before bed."}]}]},

function quiz(it,fin,box){let i=0,ok=0;
  const go=()=>{if(i>=it.length)return fin(Math.max(1,Math.round(3*ok/it.length)));
    const[q,o,a,w]=it[i],ord=shuffle(o.map((_,j)=>j)),bonus=S.a==2&&i==it.length-1&&it.length>2&&!/^What is/.test(q);
    box.innerHTML=`<p class="step">${bonus?"⚡ Pioneer bonus · ":""}Question ${i+1} of ${it.length}</p><h3>${q} ${tb(q)}</h3><div class="opts">${ord.map(j=>`<button class="opt" data-j="${j}">${o[j]}</button>`).join("")}</div><div id="fb" aria-live="polite"></div>`;
    let lock=0;const bs=[...box.querySelectorAll(".opt")];
    bs.forEach(b=>b.onclick=()=>{if(lock)return;lock=1;const r=+b.dataset.j==a;sfx(r?"ok":"no");
      if(r){ok++;b.classList.add("good")}else{b.classList.add("bad");bs.find(x=>+x.dataset.j==a).classList.add("good")}
      $("#fb").innerHTML=`<p><b>${r?"Yes! ":"Good try. "}</b>${w}</p><button class="go" id="nx">${i+1<it.length?"Next":"Finish"}</button>`;$("#nx").focus();$("#nx").onclick=()=>{i++;go()}})};
  go()}
function mg(m){const R=[[10,6],[40,11],[90,13]][S.a],rn=n=>2+Math.random()*n|0;
  return[...Array(4)].map(()=>{let a,b,r,sg;
    if(m){a=rn(R[1]-2);b=rn(R[1]-2);r=a*b;sg="×"}else{a=rn(R[0]);b=rn(R[0]/2);if(Math.random()<.5){r=a+b;sg="+"}else{if(b>a)[a,b]=[b,a];r=a-b;sg="−"}}
    const s=new Set([r]);let g=0;while(s.size<3&&g++<50){const v=r+Math.max(1,Math.round(r/10))*(1+Math.random()*3|0)*(Math.random()<.5?-1:1);if(v>=0)s.add(v)}
