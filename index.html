<!DOCTYPE html>
<html lang="en" data-mode="night">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="DigiSoma: fun lessons in coding, AI, online safety and wellbeing for African kids aged 6 to 16.">
<meta name="theme-color" content="#0B1030">
<title>DigiSoma</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@500;700;800&family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<style>
/* Design: a savanna under the night sky (or at sunrise in Day mode). Stars are the reward currency, so the sky is the stage.
   Kids navigate with 4 big tabs (Home, Learn, Awards, Me): bottom bar on phones, side rail on computers. Lessons open in a focus mode with no distractions. */
:root{
  --sky:linear-gradient(180deg,#9FDBFF 0%,#D6F0FF 42%,#FFF1D6 100%);
  --ink:#1E1147;--mute:#5A5480;--panel:#FFFFFF;--panel2:#F2EEFF;--line:#E1DAF7;--shade:rgba(30,17,71,.14);
  --sun:#FFC93C;--sunD:#C99300;--vio:#6A3CE0;--vioD:#3B1F8F;--mint:#14B886;--pink:#FF5D8F;
  --hill1:#E9C46A;--hill2:#D9A84E;--tree:#5B4022;--glow:rgba(255,201,60,.35);
  --display:"Fredoka","Trebuchet MS",system-ui,sans-serif;--body:"Nunito","Segoe UI",system-ui,sans-serif;
  color-scheme:light}
[data-mode="night"]{
  --sky:radial-gradient(1200px 600px at 80% -10%,rgba(94,242,194,.18),transparent 60%),radial-gradient(900px 500px at 10% 10%,rgba(155,107,255,.28),transparent 60%),linear-gradient(180deg,#070B26 0%,#13104A 55%,#29165E 100%);
  --ink:#F4F2FF;--mute:#B7B2E3;--panel:#1C1A4C;--panel2:#2A2768;--line:#3A3780;--shade:rgba(0,0,0,.35);
  --hill1:#1A1446;--hill2:#120E36;--tree:#0A0826;--glow:rgba(94,242,194,.25);
  color-scheme:dark}
*{box-sizing:border-box}[hidden]{display:none!important}
html,body{margin:0;min-height:100%}
body{font-family:var(--body);font-weight:500;font-size:18px;line-height:1.5;color:var(--ink);background:var(--sky) fixed;background-color:#13104A}
[data-mode="day"] body{background-color:#D6F0FF}
h1,h2,h3{font-family:var(--display);font-weight:600;line-height:1.1;margin:0;text-wrap:balance}
a{color:inherit;text-decoration:none}button{font:inherit;cursor:pointer;color:inherit}
:focus-visible{outline:4px solid var(--sun);outline-offset:3px;border-radius:12px}

/* scene */
.scene{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.stars{position:absolute;inset:0;opacity:0;transition:opacity .6s}
[data-mode="night"] .stars{opacity:1}
.stars i{position:absolute;width:2px;height:2px;border-radius:50%;background:#fff;animation:tw 4s ease-in-out infinite}
@keyframes tw{50%{opacity:.25}}
.orb{position:absolute;top:70px;right:8%;width:90px;height:90px;border-radius:50%;background:#FFE08A;box-shadow:0 0 80px 30px rgba(255,201,60,.45)}
[data-mode="night"] .orb{background:#F6F1D8;box-shadow:0 0 60px 14px rgba(246,241,216,.25),inset -18px -6px 0 #DCD5B4;width:70px;height:70px}
.land{position:absolute;left:0;right:0;bottom:0;width:100%;height:180px}
.land .h1{fill:var(--hill1)}.land .h2{fill:var(--hill2)}.land .t{fill:var(--tree)}

/* shell */
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 20px;background:color-mix(in srgb,var(--panel) 82%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.logo{font-family:var(--display);font-weight:700;font-size:26px;display:flex;align-items:center;gap:8px}.logo b{color:var(--sun)}
.logo svg{width:34px;height:34px}
.pills{display:flex;gap:8px;align-items:center}
.pill{display:inline-flex;align-items:center;gap:6px;background:var(--panel2);border:0;border-radius:99px;padding:5px 12px;font-weight:800;font-size:15px;white-space:nowrap}
.pill.me{padding:3px 12px 3px 4px}.pill.me span{font-size:22px;background:var(--panel);border-radius:50%;width:32px;height:32px;display:grid;place-items:center}
.nav{position:fixed;z-index:20;display:flex;background:var(--panel);border-top:1px solid var(--line);left:0;right:0;bottom:0;justify-content:space-around;padding:6px 6px calc(6px + env(safe-area-inset-bottom))}
.nav a{display:flex;flex-direction:column;align-items:center;gap:0;padding:6px 8px;border-radius:18px;font-family:var(--display);font-weight:600;font-size:13px;color:var(--mute);min-width:62px}
.nav a span{font-size:26px;line-height:1.1;transition:transform .15s}
.nav a.on{background:var(--sun);color:#1E1147}.nav a.on span{transform:translateY(-2px) scale(1.08)}
main{position:relative;z-index:1;padding:20px 16px 120px;max-width:1080px;margin:0 auto}
body.focus .nav,body.focus .top .pills{display:none}body.focus main{padding-bottom:60px}
@media(min-width:900px){
  .nav{top:0;bottom:0;right:auto;width:104px;flex-direction:column;justify-content:flex-start;gap:8px;padding:84px 10px 10px;border-top:0;border-right:1px solid var(--line)}
  .nav a{padding:12px 6px;font-size:14px}
  body:not(.focus) main,body:not(.focus) .top{margin-left:104px}
  body:not(.focus) main{padding:28px 32px 140px}
  .top{z-index:21}
}

/* type + buttons */
.kick{font-family:var(--display);font-weight:600;color:var(--sun);font-size:18px;margin:0 0 2px}
[data-mode="day"] .kick{color:#B4570B}
h1{font-size:clamp(34px,5.5vw,52px)}h2{font-size:clamp(24px,3.6vw,32px)}
.sub{color:var(--mute);margin:4px 0 16px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:99px;padding:12px 24px;font-family:var(--display);font-weight:600;font-size:19px;background:var(--sun);color:#1E1147;box-shadow:0 5px 0 var(--sunD);margin:4px}
.btn.v{background:var(--vio);color:#fff;box-shadow:0 5px 0 var(--vioD)}.btn.s{background:var(--panel2);color:var(--ink);box-shadow:0 5px 0 var(--line)}.btn.r{background:#D7265B;color:#fff;box-shadow:0 5px 0 #8E1239}
.btn:active{transform:translateY(4px);box-shadow:none}.btn:disabled{opacity:.45;cursor:not-allowed;transform:none;box-shadow:none}
.card{background:var(--panel);border:1px solid var(--line);border-radius:28px;padding:20px;box-shadow:0 8px 0 var(--shade)}
.c{text-align:center}.mute{color:var(--mute)}

/* home */
.hi{display:grid;grid-template-columns:1fr auto;gap:16px;align-items:center;margin-bottom:18px}
.zuri-wrap{text-align:center;position:relative}
.bub{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:10px 14px;max-width:250px;font-size:16px;margin:0 auto 10px;position:relative;box-shadow:0 6px 0 var(--shade)}
.bub:after{content:"";position:absolute;bottom:-10px;left:50%;margin-left:-10px;border:10px solid transparent;border-top-color:var(--panel);border-bottom:0}
.zbig{width:150px;height:150px;cursor:pointer;animation:bob 3s ease-in-out infinite;filter:drop-shadow(0 10px 18px var(--glow))}
@keyframes bob{50%{transform:translateY(-8px)}}
.eye{transform-origin:center;transform-box:fill-box;animation:blink 4s infinite}@keyframes blink{0%,94%,100%{transform:scaleY(1)}97%{transform:scaleY(.1)}}
.bento{display:grid;grid-template-columns:1.4fr 1fr;gap:16px}
.cont{grid-row:span 2;border-radius:28px;padding:22px;color:#fff;display:flex;flex-direction:column;justify-content:space-between;gap:12px;min-height:240px;box-shadow:0 8px 0 var(--shade);position:relative;overflow:hidden}
.cont:after{content:"";position:absolute;right:-40px;top:-40px;width:200px;height:200px;border-radius:50%;background:rgba(255,255,255,.12)}
.cont .em{font-size:64px;line-height:1}.cont h2{font-size:30px}.cont small{font-weight:800;opacity:.85;text-transform:uppercase;letter-spacing:.06em;font-size:13px}
.mini{display:flex;gap:14px;align-items:center}.mini .em{font-size:40px;line-height:1}.mini small{display:block;font-weight:800;color:var(--mute);text-transform:uppercase;letter-spacing:.06em;font-size:12px}.mini b{font-family:var(--display);font-weight:600;font-size:21px;display:block;line-height:1.15}
.week{display:flex;gap:6px;margin-top:10px}.week div{flex:1;text-align:center;font-size:12px;color:var(--mute);font-weight:800}.week i{display:grid;place-items:center;height:34px;border-radius:12px;background:var(--panel2);font-style:normal;font-size:18px;margin-bottom:3px}.week i.on{background:var(--sun)}.week .td i{outline:2px dashed var(--sun);outline-offset:1px}
.shelf{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(170px,1fr);gap:14px;overflow-x:auto;padding:4px 2px 14px;scroll-snap-type:x mandatory}
.wt{scroll-snap-align:start;border-radius:24px;padding:16px;color:#fff;min-height:150px;display:flex;flex-direction:column;justify-content:space-between;box-shadow:0 6px 0 var(--shade);transition:transform .15s}.wt:hover{transform:translateY(-4px)}
.wt .em{font-size:40px;line-height:1}.wt b{font-family:var(--display);font-weight:600;font-size:19px;line-height:1.15}
.pb{height:9px;background:rgba(255,255,255,.3);border-radius:9px;overflow:hidden;margin-top:6px}.pb i{display:block;height:100%;background:#fff;border-radius:9px}
.pb.k{background:var(--panel2)}
.sec{margin:28px 0 10px;display:flex;justify-content:space-between;align-items:end;gap:10px}

/* learn map */
.map{position:relative;max-width:640px;margin:10px auto 0;display:grid;gap:26px;padding:10px 0}
.map:before{content:"";position:absolute;left:50%;top:30px;bottom:30px;border-left:6px dashed var(--line);transform:translateX(-50%)}
.stop{position:relative;display:flex;align-items:center;gap:16px;width:82%;background:var(--panel);border:1px solid var(--line);border-radius:99px;padding:10px 24px 10px 10px;box-shadow:0 8px 0 var(--shade);transition:transform .15s}
.stop:nth-child(even){margin-left:auto;flex-direction:row-reverse;padding:10px 10px 10px 24px;text-align:right}
.stop:hover{transform:scale(1.03)}
.stop .ball{flex:none;width:86px;height:86px;border-radius:50%;display:grid;place-items:center;font-size:44px;color:#fff;box-shadow:inset 0 -6px 0 rgba(0,0,0,.2)}
.stop b{font-family:var(--display);font-weight:600;font-size:22px;display:block;line-height:1.1}.stop small{color:var(--mute);font-size:15px}
.stop .tx{flex:1;min-width:0}
/* world path */
.banner{border-radius:28px;padding:20px 22px;color:#fff;display:flex;gap:16px;align-items:center;box-shadow:0 8px 0 var(--shade);margin-bottom:8px}
.banner .em{font-size:56px;line-height:1}.banner a{color:#fff;font-weight:800;font-size:15px;opacity:.9}
.unit{margin:26px 0 6px;display:flex;align-items:center;gap:12px;background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:12px 16px}
.unit .em{font-size:34px}.unit b{font-family:var(--display);font-weight:600;font-size:20px;display:block;line-height:1.1}.unit small{color:var(--mute)}.unit .ct{margin-left:auto;font-weight:800;color:var(--mute);font-size:15px;white-space:nowrap}
.trail{display:flex;flex-direction:column;align-items:center;gap:14px;padding:16px 0 4px}
.lnode{position:relative;display:flex;flex-direction:column;align-items:center;gap:4px;width:150px;text-align:center}
.lnode .o{width:78px;height:78px;border-radius:50%;display:grid;place-items:center;font-size:34px;color:#fff;box-shadow:0 7px 0 rgba(0,0,0,.28),inset 0 -6px 0 rgba(0,0,0,.18);transition:transform .15s}
a.lnode:hover .o{transform:scale(1.08)}
.lnode b{font-family:var(--display);font-weight:600;font-size:15px;line-height:1.15}.lnode small{font-size:13px;letter-spacing:1px}
.lnode.lock .o{background:var(--panel2)!important;color:var(--mute);box-shadow:0 7px 0 var(--line)}.lnode.lock b{color:var(--mute)}
.lnode.cur .o{outline:5px solid var(--sun);outline-offset:5px;animation:pulse 1.6s ease-in-out infinite}
.lnode .go{position:absolute;top:-34px;background:var(--sun);color:#1E1147;font-family:var(--display);font-weight:600;font-size:14px;padding:3px 12px;border-radius:12px;white-space:nowrap}
.lnode .go:after{content:"";position:absolute;bottom:-7px;left:50%;margin-left:-7px;border:7px solid transparent;border-top-color:var(--sun);border-bottom:0}
@keyframes pulse{50%{outline-offset:9px}}

/* lesson focus */
.lbar{display:flex;align-items:center;gap:14px;max-width:680px;margin:0 auto 14px}
.x{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:var(--panel2);font-size:20px;font-weight:800;flex:none}
.lprog{flex:1;height:16px;background:var(--panel2);border-radius:99px;overflow:hidden}.lprog i{display:block;height:100%;width:8%;border-radius:99px;transition:width .4s}
.lc{max-width:680px;margin:0 auto;background:var(--panel);border:1px solid var(--line);border-radius:32px;overflow:hidden;box-shadow:0 10px 0 var(--shade)}
.dh{color:#fff;padding:16px 24px}.dh small{font-weight:800;opacity:.85;font-size:13px;text-transform:uppercase;letter-spacing:.06em}.dh h2{font-size:28px}
#st{padding:20px 24px 26px}
.zrow{display:flex;gap:12px;align-items:center;margin-bottom:14px}.zrow svg{flex:none}
.say{background:var(--panel2);border-radius:20px;padding:12px 16px;font-size:17px}
.tts{border:0;background:var(--line);border-radius:99px;padding:0 8px;font-size:15px;margin-left:4px;vertical-align:middle}
.step{margin:0;font-size:15px;color:var(--mute);display:block;font-weight:700}
.opts{display:grid;gap:10px;margin:14px 0}.opt{background:var(--panel2);border:3px solid transparent;border-radius:18px;padding:13px 16px;text-align:left;font-weight:700;font-size:17px}
.opt:hover{border-color:var(--vio)}.opt.good{background:#C9F5E4;border-color:var(--mint);color:#0B3B2C}.opt.bad{background:#FFD6E1;border-color:var(--pink);color:#5A0F27}
.grid{display:grid;gap:6px;margin:10px auto}.cell{aspect-ratio:1;background:var(--panel2);border-radius:14px;display:grid;place-items:center;font-size:clamp(22px,6vw,32px)}.cell.st{background:color-mix(in srgb,var(--sun) 35%,var(--panel2))}
.pad{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:8px 0}.ar{background:#E1E7FF;color:#1E1147;border:0;border-radius:14px;padding:8px 16px;font-size:24px;box-shadow:0 4px 0 #9FAAE0}.ar:active{transform:translateY(3px);box-shadow:none}
.ar.lp{background:#FFE7A8;box-shadow:0 4px 0 #D9B24A;font-size:17px;font-weight:800}
.q{min-height:50px;background:var(--panel2);border-radius:14px;padding:8px;font-size:24px;display:flex;flex-wrap:wrap;gap:4px;justify-content:center;align-items:center}
.q span{border-radius:10px;padding:0 4px}.q .hl{background:var(--sun)}.q small{font-size:16px;color:var(--mute)}.q .loop{border:2px dashed #D9B24A;background:rgba(255,201,60,.15)}
pre{background:#0E1530;color:#7CF5D0;border-radius:14px;padding:12px;text-align:left;font-size:14px;overflow:auto;margin:10px 0}
.moods{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}.moods button{background:var(--panel2);border:3px solid transparent;border-radius:20px;padding:6px 12px;font-size:34px;line-height:1.2}.moods button:hover{border-color:var(--vio)}.moods small{display:block;font-size:14px;font-family:var(--body);font-weight:800}
.breath{width:96px;height:96px;border-radius:50%;background:radial-gradient(circle,#CFC2FF,#8E73F2);margin:16px auto;animation:br 8s ease-in-out infinite;display:grid;place-items:center;font-weight:800;color:#1E1147}@keyframes br{0%,100%{transform:scale(.6)}50%{transform:scale(1.15)}}
.big{font-size:56px;text-align:center}
.help{background:rgba(255,201,60,.18);border-radius:16px;padding:10px 14px;font-size:16px}
.homecard{background:rgba(20,184,134,.15);border-radius:18px;padding:12px 16px;margin:12px 0;font-size:16px}
.phone{max-width:330px;margin:10px auto;background:#120E36;border:3px solid var(--line);border-radius:34px;padding:14px 14px 22px;color:#fff}.pt{font-size:13px;opacity:.7;text-align:center}.from{font-weight:800;margin:10px 4px 6px}.msgb{background:#fff;color:#1E1147;border-radius:18px 18px 18px 4px;padding:12px 14px;font-size:16px}
.pw{width:100%;border:3px solid var(--line);border-radius:16px;font:inherit;font-size:22px;padding:10px 14px;margin:6px 0;background:var(--panel2);color:var(--ink)}
.meter{height:14px;background:var(--panel2);border-radius:99px;overflow:hidden}.meter i{display:block;height:100%;width:0;transition:width .3s}
.ck{list-style:none;padding:0;columns:2;font-size:16px;margin:8px 0}.ck .y{color:var(--mint);font-weight:800}
.mrow{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:10px 0}.mrow div{text-align:center;width:96px}.mrow small{display:block;font-size:13px;line-height:1.25}

/* awards */
.lvl{display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.ring{--p:0;width:110px;height:110px;border-radius:50%;background:conic-gradient(var(--sun) calc(var(--p)*1%),var(--panel2) 0);display:grid;place-items:center;flex:none}
.ring div{width:84px;height:84px;border-radius:50%;background:var(--panel);display:grid;place-items:center;text-align:center;font-family:var(--display);font-weight:600;line-height:1}.ring b{font-size:30px;display:block}.ring small{font-size:12px;color:var(--mute)}
.skybox{position:relative;height:220px;border-radius:24px;background:linear-gradient(180deg,#070B26,#1E1458);overflow:hidden;margin-top:12px}
.skybox i{position:absolute;font-style:normal;font-size:14px;color:#4B4785;transform:translate(-50%,-50%)}
.skybox i.on{color:#FFE08A;text-shadow:0 0 10px #FFC93C;font-size:18px}
.skybox p{position:absolute;left:16px;bottom:10px;margin:0;color:#fff;font-weight:800;font-size:15px}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px}
.bdg{background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:14px;text-align:center;box-shadow:0 6px 0 var(--shade)}.bdg span{font-size:40px;display:block}.bdg b{font-family:var(--display);font-weight:600}.bdg small{display:block;color:var(--mute);font-size:13px;line-height:1.2}
.bdg.off>*{opacity:.4;filter:grayscale(1)}

/* me */
.prof{display:flex;align-items:center;gap:18px;flex-wrap:wrap}.prof .av{font-size:64px;width:100px;height:100px;border-radius:50%;background:var(--panel2);display:grid;place-items:center;border:4px solid var(--sun)}
.rowset{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;padding:14px 0;border-bottom:1px solid var(--line)}.rowset:last-child{border-bottom:0}.rowset b{display:block}.rowset small{color:var(--mute);font-size:14px}
.seg{display:inline-flex;background:var(--panel2);border-radius:99px;padding:4px;gap:4px;flex-wrap:wrap}.seg button{border:0;background:transparent;border-radius:99px;padding:6px 14px;font-weight:800;font-size:15px;color:var(--ink)}.seg button.on{background:var(--sun);color:#1E1147}
.sw button{width:32px;height:32px;border-radius:50%;border:3px solid var(--panel);box-shadow:0 0 0 2px var(--line);margin:0 3px}
.avs{display:flex;gap:6px;flex-wrap:wrap}.avs button{font-size:30px;background:var(--panel2);border:3px solid transparent;border-radius:16px;padding:2px 8px}.avs .on{border-color:var(--sun)}
.price{background:linear-gradient(135deg,#FFC93C,#FF9F43);color:#1E1147;border-radius:28px;padding:22px;box-shadow:0 8px 0 #C77A1A}.price .n{font-family:var(--display);font-size:48px;font-weight:700;line-height:1}.price ul{padding-left:20px;margin:10px 0;font-weight:700}

/* onboarding + learners */
.ob{display:grid;grid-template-columns:1fr 1fr;gap:28px;align-items:center;min-height:calc(100vh - 140px)}
.ob h1{font-size:clamp(38px,6vw,62px)}.ob h1 em{font-style:normal;color:var(--sun)}
.feat{display:flex;flex-wrap:wrap;gap:8px;margin:16px 0}.feat span{background:var(--panel);border:1px solid var(--line);border-radius:99px;padding:6px 14px;font-weight:800;font-size:15px}
.ob label{display:block;font-weight:800;margin:14px 0 6px}
.ob input{width:100%;font:inherit;font-size:20px;padding:12px 16px;border-radius:16px;border:3px solid var(--line);background:var(--panel2);color:var(--ink)}
.kids{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:16px;max-width:720px;margin:20px auto}
.kc{background:var(--panel);border:1px solid var(--line);border-radius:28px;padding:22px;text-align:center;box-shadow:0 8px 0 var(--shade);transition:transform .15s}.kc:hover{transform:translateY(-4px)}
.kc .av{font-size:66px;display:block;line-height:1.1}.kc b{font-family:var(--display);font-weight:600;font-size:22px;display:block}.kc small{color:var(--mute)}
.kc.add{background:transparent;border:3px dashed var(--line);box-shadow:none}

/* parent dialog */
dialog{border:0;padding:0;width:min(600px,94vw);max-height:92vh;overflow:auto;background:var(--panel);color:var(--ink);border-radius:28px;box-shadow:0 20px 60px rgba(0,0,0,.4)}dialog::backdrop{background:rgba(7,11,38,.75)}
.pbody{padding:20px 24px 24px}
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:10px 0 14px}.tile{background:var(--panel2);border-radius:16px;padding:8px 10px;font-size:13px;line-height:1.2;color:var(--mute);font-weight:700}.tile b{font-family:var(--display);font-size:24px;display:block;color:var(--ink)}
.wk{display:flex;gap:6px;align-items:flex-end;height:96px;margin:8px 0 2px}.wk div{flex:1;text-align:center;font-size:12px;color:var(--mute);font-weight:800}.wk i{display:block;background:var(--vio);border-radius:6px 6px 0 0;margin:0 auto 2px;width:70%;min-height:3px}
.ptabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}.ptabs button{border:2px solid var(--line);background:var(--panel);border-radius:99px;padding:4px 12px;font-weight:800}.ptabs .on{background:var(--vio);color:#fff;border-color:var(--vio)}
.note{font-size:14px;color:var(--mute);border-top:2px dashed var(--line);margin-top:14px;padding-top:10px}

html.easy body,html.easy h1,html.easy h2,html.easy h3,html.easy .btn,html.easy .nav a{font-family:"Atkinson Hyperlegible",Verdana,sans-serif!important;letter-spacing:.02em}
html.big main{zoom:1.15}
/* front page */
.lhero{display:grid;grid-template-columns:1.25fr .75fr;gap:24px;align-items:center;padding:24px 0 6px}
.lhero h1{font-size:clamp(40px,6.5vw,66px)}.lhero h1 em{font-style:normal;color:var(--sun)}
.lsec{margin:60px 0 0}
.three{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px;margin-top:16px}
.three .n{font-family:var(--display);font-weight:700;font-size:38px;color:var(--sun);line-height:1;display:block;margin-bottom:6px}
.three h3{font-size:21px;margin-bottom:4px}.three p{margin:0;color:var(--mute);font-size:16px}
.founder{display:grid;grid-template-columns:auto 1fr;gap:24px;align-items:center}
.fav{width:120px;height:120px;border-radius:50%;background:linear-gradient(135deg,var(--sun),#FF9F43);display:grid;place-items:center;font-family:var(--display);font-size:52px;color:#1E1147;font-weight:700;box-shadow:0 0 0 6px var(--panel2)}
details{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:14px 18px;margin-top:10px}summary{font-weight:800;cursor:pointer}details p{margin:8px 0 0;color:var(--mute)}
.lcta{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}
.tag{display:inline-block;background:var(--panel2);border-radius:99px;padding:3px 12px;font-weight:800;font-size:13px;color:var(--mute);margin:2px}
/* create */
.mk{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px;margin-top:16px}
.mkc{border-radius:28px;padding:22px;color:#fff;min-height:210px;display:flex;flex-direction:column;justify-content:space-between;gap:10px;box-shadow:0 8px 0 var(--shade);transition:transform .15s}.mkc:hover{transform:translateY(-4px)}
.mkc .em{font-size:56px;line-height:1}.mkc h2{font-size:28px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 14px}.chips button{background:var(--panel2);border:3px solid transparent;border-radius:16px;padding:8px 12px;font-weight:800;font-size:16px}.chips button.on{border-color:var(--sun);background:color-mix(in srgb,var(--sun) 22%,var(--panel2))}
.spage{border-radius:24px;overflow:hidden;border:1px solid var(--line)}
.price .n{color:#1E1147!important}
.scene2{height:190px;display:grid;place-items:center;font-size:clamp(40px,11vw,64px);letter-spacing:8px;white-space:nowrap;text-shadow:0 6px 18px rgba(0,0,0,.25)}
.ptext{padding:18px 20px;font-size:21px;line-height:1.6;background:var(--panel)}
.dots{display:flex;gap:6px;justify-content:center;margin:12px 0}.dots i{width:10px;height:10px;border-radius:50%;background:var(--line)}.dots i.on{background:var(--sun)}
.cell.ed{cursor:pointer;border:0;font:inherit}.cell.ed:hover{outline:3px solid var(--sun)}
.code{font-family:ui-monospace,Consolas,monospace;font-size:26px;letter-spacing:3px;background:var(--panel2);padding:8px 16px;border-radius:12px;display:inline-block;font-weight:700}
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:var(--sun);color:#1E1147;padding:12px 22px;border-radius:99px;font-family:var(--display);font-weight:600;z-index:40;box-shadow:0 8px 24px rgba(0,0,0,.3);text-align:center;max-width:92vw}
.cf{position:fixed;top:-30px;font-style:normal;font-size:28px;z-index:30;pointer-events:none;animation:fall 2s ease-in forwards}@keyframes fall{to{transform:translate(var(--dx),105vh) rotate(360deg)}}
@media(max-width:760px){
  .hi{grid-template-columns:1fr}.hi .zuri-wrap{display:none}
  .bento,.ob{grid-template-columns:1fr}.cont{grid-row:auto;min-height:200px}
  .stop{width:100%}.tiles{grid-template-columns:repeat(2,1fr)}
  .pill.st{display:none}.lhero,.founder{grid-template-columns:1fr}.fav{width:90px;height:90px;font-size:40px}.top{padding:8px 14px}.logo{font-size:22px}
  .ob{min-height:0}.ob .zbig{width:110px;height:110px}.orb{width:44px!important;height:44px!important;top:64px;right:14px;opacity:.7}
}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

function mg(m){const R=[[10,6],[40,11],[90,13]][S.a],rn=n=>2+Math.random()*n|0;
  return[...Array(4)].map(()=>{let a,b,r,sg;
    if(m){a=rn(R[1]-2);b=rn(R[1]-2);r=a*b;sg="×"}else{a=rn(R[0]);b=rn(R[0]/2);if(Math.random()<.5){r=a+b;sg="+"}else{if(b>a)[a,b]=[b,a];r=a-b;sg="−"}}
    const s=new Set([r]);let g=0;while(s.size<3&&g++<50){const v=r+Math.max(1,Math.round(r/10))*(1+Math.random()*3|0)*(Math.random()<.5?-1:1);if(v>=0)s.add(v)}
    for(let v=r+1;s.size<3;v++)s.add(v);
    const o=shuffle([...s]);return[`What is ${a} ${sg} ${b}?`,o.map(String),o.indexOf(r),`${a} ${sg} ${b} = ${r}.`]})}
const RB=[{g:4,o:[0,0],s:[3,2],r:[],best:5,tx:"Guide me to the ⭐! Each arrow moves me one square."},
{g:4,o:[0,0],s:[3,3],r:[[1,0],[1,1],[3,1]],best:6,tx:"Rocks 🪨 block the way. Plan a path around them!"},
{g:5,o:[0,4],s:[4,0],r:[[3,4],[3,3],[4,2],[1,2],[0,0],[3,1]],best:8,gi:"🏪",ri:"📦",tx:"Mama Akinyi needs mangoes 🥭 at her stall 🏪. Deliver them without hitting the crates 📦!"},
{g:5,o:[0,4],s:[4,0],r:[[2,4],[0,3],[3,3],[1,2],[2,1],[4,2]],best:3,loop:1,gi:"🌻",ri:"🪴",tx:"Help me climb the steps to the rooftop garden 🌻! The moves repeat, so tap 🔁 Repeat to write less code."}];
const PY={"⬆️":"up","⬇️":"down","⬅️":"left","➡️":"right"};
function robot(L,fin,box){const N=L.g,A={"⬆️":[0,-1],"⬇️":[0,1],"⬅️":[-1,0],"➡️":[1,0]};let q=[],lp=null,p=[...L.o],busy=0,cur=-1;
  const at=(x,y)=>L.r.some(c=>c[0]==x&&c[1]==y);
  const cnt=()=>q.reduce((n,t)=>n+(typeof t=="string"?1:1+t.b.length),0);
  const flat=()=>q.flatMap((t,i)=>typeof t=="string"?[[t,i]]:Array.from({length:t.r},()=>t.b.map(a=>[a,i])).flat());
  const py=()=>q.map(t=>typeof t=="string"?`zuri.move("${PY[t]}")`:`for i in range(${t.r}):\n`+t.b.map(a=>`    zuri.move("${PY[a]}")`).join("\n")).join("\n");
  const reset=()=>{p=[...L.o];cur=-1};
  const draw=(m,win)=>{let g="";for(let y=0;y<N;y++)for(let x=0;x<N;x++){const me=p[0]==x&&p[1]==y,gl=L.s[0]==x&&L.s[1]==y;g+=`<div class="cell${L.o[0]==x&&L.o[1]==y?" st":""}">${me?"🤖":gl?(L.gi||"⭐"):at(x,y)?(L.ri||"🪨"):""}</div>`}
    const code=q.length?q.map((t,i)=>typeof t=="string"?`<span class="${i==cur?"hl":""}">${t}</span>`:`<span class="loop ${i==cur?"hl":""}">🔁×${t.r} [ ${t.b.join(" ")}${t==lp?" …":" ]"}</span>`).join(""):"<small>Tap the arrows to write your code</small>";
    const lctl=L.loop?(lp?`<button class="ar lp" id="lc" aria-label="Change how many times to repeat">×${lp.r} times ↻</button><button class="ar lp" id="le">Close loop ]</button>`:`<button class="ar lp" id="lo">🔁 Repeat</button>`):"";
    box.innerHTML=zsay(L.tx)+`<div class="grid" style="grid-template-columns:repeat(${N},1fr);max-width:${N*70}px" role="img" aria-label="Map, ${N} by ${N} squares">${g}</div><div class="pad">${Object.keys(A).map(a=>`<button class="ar" data-a="${a}" aria-label="Add a ${PY[a]} step">${a}</button>`).join("")}${lctl}</div>${lp?`<p class="c step">Arrows now go inside the loop. Tap “Close loop” when done.</p>`:""}<div class="q" aria-label="Your code">${code}</div><div class="pad"><button class="btn v" id="run">▶ Run code</button><button class="btn s" id="un">↶ Undo</button><button class="btn s" id="clr">↺ Clear</button></div><div class="c" aria-live="polite">${m?`<p>${m}</p>`:""}${win&&S.a?`<pre># The same code in Python\n${py()}</pre>`:""}${win?`<button class="btn" id="cn">Continue ▶</button>`:""}</div>`;
    box.querySelectorAll(".ar[data-a]").forEach(b=>b.onclick=()=>{if(busy)return;if(cnt()>=16)return draw("That’s a lot of code! Try running it.");(lp?lp.b:q).push(b.dataset.a);sfx("tap");reset();draw()});
    if($("#lo"))$("#lo").onclick=()=>{if(busy)return;lp={r:2,b:[]};q.push(lp);sfx("tap");reset();draw()};
    if($("#lc"))$("#lc").onclick=()=>{lp.r=lp.r>=5?2:lp.r+1;sfx("tap");draw()};
    if($("#le"))$("#le").onclick=()=>{if(!lp.b.length)q.pop();lp=null;sfx("tap");draw()};
    $("#un").onclick=()=>{if(busy)return;if(lp&&lp.b.length)lp.b.pop();else if(lp){q.pop();lp=null}else q.pop();reset();draw()};

  const run=()=>{if(busy)return;if(lp){if(!lp.b.length)q.pop();lp=null}const steps=flat();if(!steps.length)return draw("Add some arrow steps first!");busy=1;reset();let i=0;draw("Running…");
    const t=setInterval(()=>{if(i>=steps.length){clearInterval(t);busy=0;cur=-1;sfx("no");return draw("I stopped before the goal. Add more steps and run again!")}
      const[a,ti]=steps[i];cur=ti;const d=A[a],x=p[0]+d[0],y=p[1]+d[1],off=x<0||y<0||x>=N||y>=N;

/* mazes: 5x5, start/goal/rocks, encoded as a short share code */
const encMaze=m=>{let mask=0;m.r.forEach(([x,y])=>mask+=2**(y*5+x));return((m.o[1]*5+m.o[0])*25+m.s[1]*5+m.s[0]).toString(36).toUpperCase().padStart(2,"0")+"-"+mask.toString(36).toUpperCase()};
const decodeMaze=c=>{const m=/^([0-9A-Z]{2})-([0-9A-Z]{1,6})$/.exec(c||"");if(!m)return null;const a=parseInt(m[1],36),mask=parseInt(m[2],36);if(a>=625||mask>=2**25)return null;const oi=Math.floor(a/25),si=a%25;if(oi==si)return null;const r=[];for(let i=0;i<25;i++)if(Math.floor(mask/2**i)%2&&i!=oi&&i!=si)r.push([i%5,Math.floor(i/5)]);const L={g:5,o:[oi%5,Math.floor(oi/5)],s:[si%5,Math.floor(si/5)],r};const b=bfs(L);return b>0?Object.assign(L,{best:b}):null};
const bfs=L=>{const seen=new Set([L.o+""]),q=[[...L.o,0]],rock=new Set(L.r.map(String));while(q.length){const[x,y,d]=q.shift();if(x==L.s[0]&&y==L.s[1])return d;for(const[dx,dy]of[[1,0],[-1,0],[0,1],[0,-1]]){const nx=x+dx,ny=y+dy,k=nx+","+ny;if(nx<0||ny<0||nx>4||ny>4||seen.has(k)||rock.has(k))continue;seen.add(k);q.push([nx,ny,d+1])}}return -1};
function mazeMaker(){const L={g:5,o:[0,4],s:[4,0],r:[[1,3],[2,1],[3,3]]};let mode="rock";
  const box=focusShell("#create","linear-gradient(135deg,#0E8A63,#4361EE)","Create","Maze maker");prog(.15);
  const draw=()=>{const b=bfs(L),rk=(x,y)=>L.r.some(c=>c[0]==x&&c[1]==y);let g="";for(let y=0;y<5;y++)for(let x=0;x<5;x++)g+=`<button class="cell ed" data-x="${x}" data-y="${y}" aria-label="Square ${x+1}, ${y+1}">${L.o[0]==x&&L.o[1]==y?"🤖":L.s[0]==x&&L.s[1]==y?"⭐":rk(x,y)?"🪨":""}</button>`;
    box.innerHTML=zsay("Tap squares to build your maze. Then test it: you must solve your own maze before you can share it!")+`<div class="chips c" style="justify-content:center">${[["rock","🪨 Rocks"],["start","🤖 Move start"],["goal","⭐ Move goal"]].map(([k,t])=>`<button class="${mode==k?"on":""}" data-m="${k}" aria-pressed="${mode==k}">${t}</button>`).join("")}</div>
     <div class="grid" style="grid-template-columns:repeat(5,1fr);max-width:340px">${g}</div><p class="c" aria-live="polite"><b>${b>0?`✅ Zuri can reach the star. Shortest path: ${b} steps.`:"❌ No way through! Remove some rocks."}</b></p><p class="c"><button class="btn v" id="tm" ${b>0?"":"disabled"}>▶ Test my maze</button><button class="btn s" id="cl">Clear rocks</button></p>`;
    box.querySelectorAll("[data-m]").forEach(e=>e.onclick=()=>{mode=e.dataset.m;sfx("tap");draw()});
    box.querySelectorAll(".cell.ed").forEach(e=>e.onclick=()=>{const x=+e.dataset.x,y=+e.dataset.y,isO=L.o[0]==x&&L.o[1]==y,isS=L.s[0]==x&&L.s[1]==y;sfx("tap");
      if(mode=="rock"){if(isO||isS)return;const i=L.r.findIndex(c=>c[0]==x&&c[1]==y);i<0?L.r.push([x,y]):L.r.splice(i,1)}
      else if(!isO&&!isS){L.r=L.r.filter(c=>!(c[0]==x&&c[1]==y));L[mode=="start"?"o":"s"]=[x,y]}draw()});
    $("#cl").onclick=()=>{L.r=[];draw()};
    $("#tm").onclick=()=>{prog(.5);robot(Object.assign({},L,{best:b,tx:"Now solve your own maze! Write the code to reach the ⭐."}),()=>share(),box)}};
  const share=()=>{const c=encMaze(L);S.mk=(S.mk||0)+1;save();boom();sfx("win");prog(1);
    box.innerHTML=`<div class="big">🧩🎉</div><h2 class="c">Your maze works!</h2><p class="c mute">Give this code to a friend or sibling. They type it in Create → Play a friend’s maze.</p><p class="c"><span class="code">${c}</span></p><p class="c"><button class="btn v" id="cp">📋 Copy code</button><button class="btn s" id="ed">Edit maze</button><a class="btn s" href="#create">Done</a></p><p class="c" id="cm" aria-live="polite"></p>`;
    $("#cp").onclick=async()=>{try{await navigator.clipboard.writeText(c);$("#cm").textContent="Copied!"}catch(e){$("#cm").textContent="Copy didn’t work here. Write the code down instead!"}};$("#ed").onclick=()=>{prog(.15);draw()}};
  draw()}
function mazePlay(code){const L=decodeMaze(code);if(!L){toast("That maze code doesn’t work.");location.hash="create";return}

  twice($("#rm"),"Tap again to remove "+K.n,()=>{DB.kids=DB.kids.filter(k=>k!=K);if(S==K)useKid(DB.kids[0]||null);save();pz.close();location.hash=DB.kids.length?"kids":"new";route()})}

/* ---------- router ---------- */
function route(){const h=location.hash.slice(1)||"home",[a,w,t,l]=h.split("/");window.scrollTo(0,0);try{speechSynthesis.cancel()}catch(e){}
  const tab=a=="play"?"learn":a=="maze"?"create":a;document.querySelectorAll("#nav a").forEach(x=>{const on=x.dataset.t==tab;x.classList.toggle("on",on);on?x.setAttribute("aria-current","page"):x.removeAttribute("aria-current")});
  const noKid=!DB.kids.length||a=="new"||a=="kids"||!S;document.body.classList.toggle("focus",a=="play"||a=="maze"||(a=="create"&&w)||noKid);stats();
  if(a=="welcome"||(!DB.kids.length&&a!="new")){document.body.classList.add("focus");return landing()}
  if(a=="new")return onboard();if(a=="kids"||!S)return kidsPage();
  if(a=="play"){const T=D[w]&&D[w].topics[t];if(T&&T.L[l])return lesson(w,+t,+l);location.hash="learn";return}
  if(a=="learn")return D[w]?world(w):learn();
  if(a=="create")return w=="story"?storyMaker():w=="maze"?mazeMaker():createPage();
  if(a=="maze")return mazePlay(w);if(a=="awards")return awards();if(a=="me")return mePage();home()}
window.onhashchange=route;route();
</script>
