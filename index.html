    const lv1=Math.floor(xp()/100);if(lv1>lv0)setTimeout(()=>{sfx("up");toast(`🎉 Level up! You are now Level ${lv1+1}: ${TT[Math.min(lv1,4)]}`)},700);else if(mis)setTimeout(()=>toast("🎯 Today’s mission complete!"),700);
    const nx=T.L[l+1];
    box.innerHTML=`<div class="big" aria-label="${s} of 3 stars">${"⭐".repeat(s)}${"☆".repeat(3-s)}</div><h2 class="c">${s==3?"Brilliant, "+esc(S.n)+"!":s==2?"Great job!":"You finished it!"}</h2><p class="c mute">${s>old&&old?"New best! ":""}+${Math.max(0,s-old)*10} XP · best score ${st(w,t,l)} of 3 stars</p>${N.home?`<div class="homecard"><b>🏡 Try at home:</b> ${N.home}</div>`:""}<p class="c"><a class="btn" href="#${nx?`play/${w}/${t}/${l+1}`:`learn/${w}`}">${nx?"Next lesson ▶":"Back to the map"}</a><button class="btn s" id="ag">Play again</button></p>`;$("#ag").onclick=route};
  const Q=N.Q?N.Q.concat(S.a==2&&N.X?[N.X]:[]):0;
  const go={q:()=>quiz(Q,fin,box,S.a==2&&!!N.X),math:()=>quiz(mg(N.m),fin,box),robot:()=>robot(RB[N.lv],fin,box),feel:()=>feel(fin,box),breathe:()=>breathe(fin,box),order:()=>order(fin,box,N.steps),dream:()=>dream(fin,box),train:()=>train(fin,box),scam:()=>scam(fin,box,N.set||0),pass:()=>pass(fin,box),prompt:()=>promptGame(fin,box),words:()=>wordsGame(fin,box),verify:()=>verifyGame(fin,box,N.set||0),vid:()=>vid(fin,box,N.v,W.c)}[N.k];
  const start=()=>{prog(.3);go()};
  if(N.learn){box.innerHTML=zsay(N.learn)+`<p class="c"><button class="btn" id="gt">Got it, let’s play!</button></p>`;$("#gt").onclick=()=>{sfx("tap");start()}}else start()}

/* ---------- activities ---------- */
function quiz(it,fin,box,bx){let i=0,ok=0;
  const go=()=>{if(i>=it.length)return fin(Math.max(1,Math.round(3*ok/it.length)));prog(.3+.65*i/it.length);
    const[q,o,a,w]=it[i],ord=shuffle(o.map((_,j)=>j)),bonus=bx&&i==it.length-1;
    box.innerHTML=`<p class="step">${bonus?"⚡ Pioneer bonus · ":""}Question ${i+1} of ${it.length}</p><h3 style="font-size:24px;margin:4px 0">${q} ${tb(q)}</h3><div class="opts">${ord.map(j=>`<button class="opt" data-j="${j}">${o[j]}</button>`).join("")}</div><div id="fb" aria-live="polite"></div>`;
    let lock=0;const bs=[...box.querySelectorAll(".opt")];
    bs.forEach(b=>b.onclick=()=>{if(lock)return;lock=1;const r=+b.dataset.j==a;sfx(r?"ok":"no");
      if(r){ok++;b.classList.add("good")}else{b.classList.add("bad");bs.find(x=>+x.dataset.j==a).classList.add("good")}
      $("#fb").innerHTML=`<p><b>${r?"Yes! ":"Good try. "}</b>${w}</p><p class="c"><button class="btn" id="nx">${i+1<it.length?"Next":"Finish"}</button></p>`;$("#nx").focus();$("#nx").onclick=()=>{i++;go()}})};
  go()}
function mg(m){const A=S.a,rn=(lo,hi)=>lo+Math.floor(Math.random()*(hi-lo+1));
  const mk=(q,r,ex,f=v=>String(v),step=Math.max(1,Math.round(r/10)))=>{const s=new Set([r]);let g=0;while(s.size<3&&g++<60){const v=r+step*rn(1,3)*(Math.random()<.5?-1:1);if(v>=0)s.add(v)}for(let v=r+1;s.size<3;v++)s.add(v);const o=shuffle([...s]);return[q,o.map(f),o.indexOf(r),ex]};
  return[...Array(4)].map(()=>{
    if(m==0){const R=[10,40,90][A];let a=rn(2,R),b=rn(2,Math.max(2,R/2|0));if(Math.random()<.5)return mk(`What is ${a} + ${b}?`,a+b,`${a} + ${b} = ${a+b}.`);if(b>a)[a,b]=[b,a];return mk(`What is ${a} − ${b}?`,a-b,`${a} − ${b} = ${a-b}.`)}
    if(m==1){const R=[6,11,13][A],a=rn(2,R),b=rn(2,R);return mk(`What is ${a} × ${b}?`,a*b,`${a} × ${b} = ${a*b}.`)}
    if(m==2){const R=[5,10,12][A],b=rn(2,R),q=rn(2,R),a=b*q;return mk(`Share ${a} sweets equally between ${b} friends. How many does each friend get?`,q,`${a} ÷ ${b} = ${q}.`)}
    if(m==3){const notes=[[50,100],[100,200,500],[500,1000]][A],n=notes[rn(0,notes.length-1)],u=A==2?10:5,p=u*rn(1,n/u-1);return mk(`You pay KSh ${n} for something that costs KSh ${p}. What is your change?`,n-p,`${n} − ${p} = ${n-p}.`,v=>"KSh "+v,u)}
    if(m==4){if(A==2&&Math.random()<.4){const b=rn(1,5),g=[0,1,2,3].map(k=>b*2**k);return mk(`What comes next? ${g.join(", ")}, …`,b*16,`Each number doubles: ${b*8} × 2 = ${b*16}.`)}const d=rn(...[[1,5],[2,10],[3,15]][A]),a=rn(1,20),q=[0,1,2,3].map(k=>a+k*d);return mk(`What comes next? ${q.join(", ")}, …`,a+4*d,`Add ${d} each time: ${a+3*d} + ${d} = ${a+4*d}.`)}
    const ty=A==0?0:rn(0,A==1?1:2);if(ty==0){const n=2*rn(2,A==0?10:50);return mk(`What is half of ${n}?`,n/2,`${n} ÷ 2 = ${n/2}.`)}const n=4*rn(2,A==1?10:25);if(ty==1)return mk(`What is ¼ of ${n}?`,n/4,`${n} ÷ 4 = ${n/4}.`);return mk(`What is ¾ of ${n}?`,3*n/4,`${n} ÷ 4 = ${n/4}, and ${n/4} × 3 = ${3*n/4}.`)})}
const RB=[{g:4,o:[0,0],s:[3,2],r:[],best:5,tx:"Guide me to the ⭐! Each arrow moves me one square."},
{g:4,o:[0,0],s:[3,3],r:[[1,0],[1,1],[3,1]],best:6,tx:"Rocks 🪨 block the way. Plan a path around them!"},
{g:5,o:[0,4],s:[4,0],r:[[3,4],[3,3],[4,2],[1,2],[0,0],[3,1]],best:8,gi:"🏪",ri:"📦",tx:"Mama Akinyi needs mangoes 🥭 at her stall 🏪. Deliver them without hitting the crates 📦!"},
{g:5,o:[0,4],s:[4,0],r:[[2,4],[0,3],[3,3],[1,2],[2,1],[4,2]],best:3,loop:1,gi:"🌻",ri:"🪴",tx:"Help me climb the steps to the rooftop garden 🌻! The moves repeat, so tap 🔁 Repeat to write less code."},
{g:5,o:[0,2],s:[4,2],r:[[0,0],[1,0],[2,0],[3,0],[4,0],[1,1],[3,1],[1,3],[3,3],[0,4],[2,4],[4,4]],best:2,loop:1,gi:"🏁",ri:"🌵",tx:"Drive me down the long road to the finish 🏁! Use 🔁 Repeat to go far with very little code."}];
const PY={"⬆️":"up","⬇️":"down","⬅️":"left","➡️":"right"};
function robot(L,fin,box){const N=L.g,A={"⬆️":[0,-1],"⬇️":[0,1],"⬅️":[-1,0],"➡️":[1,0]};let q=[],lp=null,p=[...L.o],busy=0,cur=-1;
  const at=(x,y)=>L.r.some(c=>c[0]==x&&c[1]==y);
  const cnt=()=>q.reduce((n,t)=>n+(typeof t=="string"?1:1+t.b.length),0);
  const flat=()=>q.flatMap((t,i)=>typeof t=="string"?[[t,i]]:Array.from({length:t.r},()=>t.b.map(a=>[a,i])).flat());
  const py=()=>q.map(t=>typeof t=="string"?`akili.move("${PY[t]}")`:`for i in range(${t.r}):\n`+t.b.map(a=>`    akili.move("${PY[a]}")`).join("\n")).join("\n");
  const reset=()=>{p=[...L.o];cur=-1};
  const draw=(m,win)=>{let g="";for(let y=0;y<N;y++)for(let x=0;x<N;x++){const me=p[0]==x&&p[1]==y,gl=L.s[0]==x&&L.s[1]==y;g+=`<div class="cell${L.o[0]==x&&L.o[1]==y?" st":""}">${me?"🤖":gl?(L.gi||"⭐"):at(x,y)?(L.ri||"🪨"):""}</div>`}
    const code=q.length?q.map((t,i)=>typeof t=="string"?`<span class="${i==cur?"hl":""}">${t}</span>`:`<span class="loop ${i==cur?"hl":""}">🔁×${t.r} [ ${t.b.join(" ")}${t==lp?" …":" ]"}</span>`).join(""):"<small>Tap the arrows to write your code</small>";
    const lctl=L.loop?(lp?`<button class="ar lp" id="lc" aria-label="Change how many times to repeat">×${lp.r} times ↻</button><button class="ar lp" id="le">Close loop ]</button>`:`<button class="ar lp" id="lo">🔁 Repeat</button>`):"";
    box.innerHTML=zsay(L.tx)+`<div class="grid" style="grid-template-columns:repeat(${N},1fr);max-width:${N*70}px" role="img" aria-label="Map, ${N} by ${N} squares">${g}</div><div class="pad">${Object.keys(A).map(a=>`<button class="ar" data-a="${a}" aria-label="Add a ${PY[a]} step">${a}</button>`).join("")}${lctl}</div>${lp?`<p class="c step">Arrows now go inside the loop. Tap “Close loop” when done.</p>`:""}<div class="q" aria-label="Your code">${code}</div><div class="pad"><button class="btn v" id="run">▶ Run code</button><button class="btn s" id="un">↶ Undo</button><button class="btn s" id="clr">↺ Clear</button></div><div class="c" aria-live="polite">${m?`<p>${m}</p>`:""}${win&&S.a?`<pre># The same code in Python\n${py()}</pre>`:""}${win?`<button class="btn" id="cn">Continue ▶</button>`:""}</div>`;
    box.querySelectorAll(".ar[data-a]").forEach(b=>b.onclick=()=>{if(busy)return;if(cnt()>=16)return draw("That’s a lot of code! Try running it.");(lp?lp.b:q).push(b.dataset.a);sfx("tap");reset();draw()});
    if($("#lo"))$("#lo").onclick=()=>{if(busy)return;lp={r:2,b:[]};q.push(lp);sfx("tap");reset();draw()};
    if($("#lc"))$("#lc").onclick=()=>{lp.r=lp.r>=5?2:lp.r+1;sfx("tap");draw()};
    if($("#le"))$("#le").onclick=()=>{if(!lp.b.length)q.pop();lp=null;sfx("tap");draw()};
    $("#un").onclick=()=>{if(busy)return;if(lp&&lp.b.length)lp.b.pop();else if(lp){q.pop();lp=null}else q.pop();reset();draw()};
    $("#clr").onclick=()=>{if(busy)return;q=[];lp=null;reset();draw()};$("#run").onclick=run;if(win)$("#cn").onclick=()=>fin(cnt()<=L.best?3:2)};
  const run=()=>{if(busy)return;if(lp){if(!lp.b.length)q.pop();lp=null}const steps=flat();if(!steps.length)return draw("Add some arrow steps first!");busy=1;reset();let i=0;draw("Running…");
    const t=setInterval(()=>{if(i>=steps.length){clearInterval(t);busy=0;cur=-1;sfx("no");return draw("I stopped before the goal. Add more steps and run again!")}
      const[a,ti]=steps[i];cur=ti;const d=A[a],x=p[0]+d[0],y=p[1]+d[1],off=x<0||y<0||x>=N||y>=N;
      if(off||at(x,y)){clearInterval(t);busy=0;sfx("bump");return draw(`💥 Bump! The highlighted block ${off?"takes me off the map":"hits a "+(L.ri?"crate or pot":"rock")}. Fix it and try again. Finding mistakes is called <b>debugging</b>.`)}
      p=[x,y];i++;sfx("tap");
      if(p[0]==L.s[0]&&p[1]==L.s[1]){clearInterval(t);busy=0;cur=-1;prog(.9);const c=cnt();return draw(`🎉 You did it with ${c} blocks${c<=L.best?", the shortest code!":L.loop?". Now try 🔁 Repeat to use fewer blocks!":". Can you find a shorter path?"} A list of steps is called an <b>algorithm</b>.`,1)}
      draw("Running…")},calm?250:420)};
  draw()}
function order(fin,box,steps){const own=!!steps,T=steps||[["👀","See","A camera spots a smile"],["🧠","Think","The AI decides: smile means happy"],["💃","Act","The robot does a victory spin"]],K=T.length;let n=0,bad=0;
  box.innerHTML=`<p>Tap the ${K} steps in the right order! ${tb(`Tap the ${K} steps in the right order!`)}</p><div class="opts">${shuffle(T.map((_,i)=>i)).map(i=>`<button class="opt" data-i="${i}">${T[i][0]} ${T[i][2]}</button>`).join("")}</div><p class="c" id="fb" aria-live="polite"></p>`;
  box.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{const i=+b.dataset.i;if(b.disabled)return;
    if(i==n){sfx("ok");b.classList.add("good");b.disabled=1;b.textContent=`${n+1}. ${T[i][1]}: ${T[i][2]}`;n++;prog(.3+.6*n/K);if(n==K){$("#fb").innerHTML=`<b>${T.map(x=>x[1]).join(" → ")}.</b> ${own?"You got the order right!":"That’s how real AI works!"}<br><button class="btn" id="nx">Continue ▶</button>`;$("#nx").onclick=()=>fin(bad?2:3)}}
    else{bad++;sfx("no");b.classList.add("bad");setTimeout(()=>b.classList.remove("bad"),600)}})}
function train(fin,box){const TR=[.08,.92,.25,.8,.15,.7],TE=[.18,.85,.6,.35],lab=[];let i=0;
  const col=v=>`hsl(${Math.round(115-90*v)},72%,${Math.round(40+14*v)}%)`;
  const mango=(v,z)=>`<svg width="${z}" height="${z}" viewBox="0 0 100 100" aria-hidden="true"><path d="M52 20c-2-9 7-15 16-11-7 1-11 5-13 11z" fill="#2E7D32"/><ellipse cx="50" cy="58" rx="31" ry="37" transform="rotate(-20 50 58)" fill="${col(v)}"/><ellipse cx="39" cy="45" rx="7" ry="12" fill="#fff" opacity=".28" transform="rotate(-20 39 45)"/></svg>`;
  const step=()=>{if(i<TR.length){prog(.3+.4*i/TR.length);box.innerHTML=zsay(i?"And this one? Is it ripe?":"Teach me! Is this mango ripe? Look at its colour.")+`<p class="step c">Training example ${i+1} of ${TR.length}</p><div class="c">${mango(TR[i],130)}</div><div class="pad"><button class="btn" data-r="1">😋 Ripe</button><button class="btn s" data-r="0">🌱 Not ripe yet</button></div>`;
      box.querySelectorAll("[data-r]").forEach(b=>b.onclick=()=>{lab[i++]=+b.dataset.r;sfx("tap");step()});return}
    box.innerHTML=zsay("Asante! This is my <b>training data</b>. Now test me on new mangoes I have never seen.")+`<div class="mrow">${TR.map((v,k)=>`<div>${mango(v,60)}<small>${lab[k]?"Ripe":"Not ripe"}</small></div>`).join("")}</div><p class="c"><button class="btn v" id="tt">Test my AI ▶</button></p>`;
    $("#tt").onclick=test};
  const test=()=>{prog(.8);const pred=TE.map(v=>{let b=0;TR.forEach((t,k)=>{if(Math.abs(t-v)<Math.abs(TR[b]-v))b=k});return lab[b]});
    const good=TR.filter((v,k)=>(v>=.5)==!!lab[k]).length,right=TE.filter((v,k)=>(v>=.5)==!!pred[k]).length;
    box.innerHTML=`<p class="step c">Testing my AI on 4 new mangoes…</p><div class="mrow" id="tr"></div><div id="tm" aria-live="polite"></div>`;let k=0;
    const reveal=()=>{if(k<TE.length){const r=(TE[k]>=.5)==!!pred[k];$("#tr").insertAdjacentHTML("beforeend",`<div>${mango(TE[k],70)}<small>AI says: <b>${pred[k]?"Ripe":"Not ripe"}</b> ${r?"✅":"❌"}</small></div>`);sfx(r?"ok":"no");k++;setTimeout(reveal,calm?100:650);return}
      $("#tm").innerHTML=`<p class="c"><b>Your AI got ${right} of 4 right!</b></p><p>${good==6?"You taught it well, so it learned well.":"Some of your labels were mixed up, and the AI copied those mistakes."} An AI is only as good as the examples it learns from.${S.a==2?" This is called <b>supervised learning</b>: your labels are the training data, and this AI copies the label of the most similar example (a nearest-neighbour model).":""}</p><p class="c"><button class="btn" id="cn">Continue ▶</button><button class="btn s" id="rt">Teach it again</button></p>`;

const MS0=[["💚 M-PESA","Confirmed. You have received KSh 4,500 from JOHN K. Sorry, I sent it by mistake! Please send it back to 0712 345 678.",1,"Scammers send fake “mistake” messages from normal phone numbers. Check your real balance and show a grown-up before sending anything."],["👩🏾 Mum","I’ll pick you up at 4pm after football 💛",0,"A normal message from someone you know."],["+254 7xx xxx xxx","CONGRATS!!! You won a free phone 🎁 Tap bit.ly/fr33-ph0ne and enter your parent’s M-Pesa PIN to claim. Hurry, 10 minutes left!",1,"A prize, a rush and a PIN request: three red flags. Nobody needs a PIN to give you a gift."],["🏫 School","Reminder: Sports Day is on Friday. Please wear your house T-shirt.",0,"Expected news from a sender you know."],["🙂 NewFriend_12","Hi! I’m 12 too. Let’s be best friends. Don’t tell your parents about our chats, ok? Send me a photo of you.",1,"Asking for secrets and photos is a big red flag. Don’t reply, block, and tell a trusted grown-up."]];

function scam(fin,box,set){const M=shuffle([...MSS[set]]);let i=0,ok=0;
  const go=()=>{if(i>=M.length)return fin(ok==M.length?3:ok>=M.length-1?2:1);prog(.3+.65*i/M.length);const[f,t,bad,why]=M[i];

    let lock=0;box.querySelectorAll("[data-b]").forEach(b=>b.onclick=()=>{if(lock)return;lock=1;const r=+b.dataset.b==bad;if(r)ok++;sfx(r?"ok":"no");

  box.innerHTML=zsay("Build a super-strong password! This is practice only, so never type a real password here.")+`<label for="pw" class="step">Type a practice password</label><input id="pw" class="pw" autocomplete="off" spellcheck="false" autocapitalize="off"><div class="meter"><i id="mt"></i></div><p id="ml" class="c" aria-live="polite"></p><ul class="ck" id="ck"></ul><p class="c"><button class="btn s" id="idea">💡 Give me an idea</button><button class="btn" id="pd" disabled>Finish ✔</button></p>`;
  const R=[[`At least ${need} characters`,v=>v.length>=need],["Small letters (a–z)",v=>/[a-z]/.test(v)],["Capital letters (A–Z)",v=>/[A-Z]/.test(v)],["A number (0–9)",v=>/\d/.test(v)],["A symbol like ! ? #",v=>/[^A-Za-z0-9\s]/.test(v)],["Not a common password",v=>v.length>3&&!/(password|123456|qwerty|abc123|111111|baraka|letmein)/i.test(v)]];
  let was=0;const up=()=>{const v=$("#pw").value,ok=R.map(r=>r[1](v)),n=ok.filter(Boolean).length;$("#ck").innerHTML=R.map((r,j)=>`<li class="${ok[j]?"y":""}">${ok[j]?"✔":"○"} ${r[0]}</li>`).join("");

    prog(.3+.6*n/6);if(n==6&&!was)sfx("ok");was=n==6;$("#pd").disabled=n<6};

  $("#idea").onclick=()=>{const p=shuffle([...W]).slice(0,3);$("#pw").value=p.join(["!","#","?","-"][Math.random()*4|0])+(Math.random()*90+10|0);up();$("#ml").innerHTML+="<br><small>Three random words plus a number and a symbol: long, strong and easy to remember.</small>"};

/* mazes: 5x5, start/goal/rocks, encoded as a short share code */
const encMaze=m=>{let mask=0;m.r.forEach(([x,y])=>mask+=2**(y*5+x));return((m.o[1]*5+m.o[0])*25+m.s[1]*5+m.s[0]).toString(36).toUpperCase().padStart(2,"0")+"-"+mask.toString(36).toUpperCase()};
const decodeMaze=c=>{const m=/^([0-9A-Z]{2})-([0-9A-Z]{1,6})$/.exec(c||"");if(!m)return null;const a=parseInt(m[1],36),mask=parseInt(m[2],36);if(a>=625||mask>=2**25)return null;const oi=Math.floor(a/25),si=a%25;if(oi==si)return null;const r=[];for(let i=0;i<25;i++)if(Math.floor(mask/2**i)%2&&i!=oi&&i!=si)r.push([i%5,Math.floor(i/5)]);const L={g:5,o:[oi%5,Math.floor(oi/5)],s:[si%5,Math.floor(si/5)],r};const b=bfs(L);return b>0?Object.assign(L,{best:b}):null};
const bfs=L=>{const seen=new Set([L.o+""]),q=[[...L.o,0]],rock=new Set(L.r.map(String));while(q.length){const[x,y,d]=q.shift();if(x==L.s[0]&&y==L.s[1])return d;for(const[dx,dy]of[[1,0],[-1,0],[0,1],[0,-1]]){const nx=x+dx,ny=y+dy,k=nx+","+ny;if(nx<0||ny<0||nx>4||ny>4||seen.has(k)||rock.has(k))continue;seen.add(k);q.push([nx,ny,d+1])}}return -1};
function mazeMaker(){const L={g:5,o:[0,4],s:[4,0],r:[[1,3],[2,1],[3,3]]};let mode="rock";
  const box=focusShell("#create","linear-gradient(135deg,#0E8A63,#4361EE)","Create","Maze maker");prog(.15);
  const draw=()=>{const b=bfs(L),rk=(x,y)=>L.r.some(c=>c[0]==x&&c[1]==y);let g="";for(let y=0;y<5;y++)for(let x=0;x<5;x++)g+=`<button class="cell ed" data-x="${x}" data-y="${y}" aria-label="Square ${x+1}, ${y+1}">${L.o[0]==x&&L.o[1]==y?"🤖":L.s[0]==x&&L.s[1]==y?"⭐":rk(x,y)?"🪨":""}</button>`;
    box.innerHTML=zsay("Tap squares to build your maze. Then test it: you must solve your own maze before you can share it!")+`<div class="chips c" style="justify-content:center">${[["rock","🪨 Rocks"],["start","🤖 Move start"],["goal","⭐ Move goal"]].map(([k,t])=>`<button class="${mode==k?"on":""}" data-m="${k}" aria-pressed="${mode==k}">${t}</button>`).join("")}</div>
     <div class="grid" style="grid-template-columns:repeat(5,1fr);max-width:340px">${g}</div><p class="c" aria-live="polite"><b>${b>0?`✅ Akili can reach the star. Shortest path: ${b} steps.`:"❌ No way through! Remove some rocks."}</b></p><p class="c"><button class="btn v" id="tm" ${b>0?"":"disabled"}>▶ Test my maze</button><button class="btn s" id="cl">Clear rocks</button></p>`;
    box.querySelectorAll("[data-m]").forEach(e=>e.onclick=()=>{mode=e.dataset.m;sfx("tap");draw()});
    box.querySelectorAll(".cell.ed").forEach(e=>e.onclick=()=>{const x=+e.dataset.x,y=+e.dataset.y,isO=L.o[0]==x&&L.o[1]==y,isS=L.s[0]==x&&L.s[1]==y;sfx("tap");
      if(mode=="rock"){if(isO||isS)return;const i=L.r.findIndex(c=>c[0]==x&&c[1]==y);i<0?L.r.push([x,y]):L.r.splice(i,1)}
      else if(!isO&&!isS){L.r=L.r.filter(c=>!(c[0]==x&&c[1]==y));L[mode=="start"?"o":"s"]=[x,y]}draw()});
    $("#cl").onclick=()=>{L.r=[];draw()};
    $("#tm").onclick=()=>{prog(.5);robot(Object.assign({},L,{best:b,tx:"Now solve your own maze! Write the code to reach the ⭐."}),()=>share(),box)}};
  const share=()=>{const c=encMaze(L);S.mk=(S.mk||0)+1;save();boom();sfx("win");prog(1);
    box.innerHTML=`<div class="big">🧩🎉</div><h2 class="c">Your maze works!</h2><p class="c mute">Give this code to a friend or sibling. They type it in Create → Play a friend’s maze.</p><p class="c"><span class="code">${c}</span></p><p class="c"><button class="btn v" id="cp">📋 Copy code</button><button class="btn s" id="ed">Edit maze</button><a class="btn s" href="#create">Done</a></p><p class="c" id="cm" aria-live="polite"></p>`;
    $("#cp").onclick=async()=>{try{await navigator.clipboard.writeText(c);$("#cm").textContent="Copied!"}catch(e){$("#cm").textContent="Copy didn’t work here. Write the code down instead!"}};$("#ed").onclick=()=>{prog(.15);draw()}};
  draw()}
function mazePlay(code){const L=decodeMaze(code);if(!L){toast("That maze code doesn’t work.");location.hash="create";return}
  const box=focusShell("#create","linear-gradient(135deg,#0E8A63,#4361EE)","Friend’s maze · "+code,"Solve the maze");prog(.3);
  robot(Object.assign(L,{tx:"A friend built this maze for you. Can you guide me to the ⭐?"}),s=>{boom();sfx("win");prog(1);box.innerHTML=`<div class="big">${"⭐".repeat(s)}</div><h2 class="c">You solved it!</h2><p class="c mute">${s==3?"And with the shortest code. Brilliant!":"Can you find an even shorter path?"}</p><p class="c"><a class="btn" href="#create/maze">Build your own maze</a><a class="btn s" href="#create">Back to Create</a></p>`},box)}

function promptGame(fin,box){const P={role:0,aud:0,ken:0,fmt:0,pii:0};let best=0;
  const parts=[["role","🎭 Act like a friendly science teacher."],["aud","🧒 Explain it for a 10-year-old."],["ken","🇰🇪 Use an example from Kenya."],["fmt","📋 Answer in 3 short bullet points."],["pii","🏫 My name is Baraka and I go to Hillside School."]];
  const reply=()=>{if(P.pii)return null;const easy=P.aud,pts=easy?["A volcano is a mountain with hot, melted rock called magma deep inside.","When pressure builds up, the magma bursts out as lava, ash and gas."]:["Volcanoes are vents in the Earth’s crust through which magma, volcanic gases and pyroclastic material are ejected during effusive or explosive eruptions."];
    if(P.ken)pts.push(easy?"Kenya has volcanoes too! Mount Longonot in the Rift Valley is an old volcano that people hike today.":"Kenyan examples include Mount Longonot, a volcano in the Rift Valley.");
    return{txt:(P.role?"Hi there, young scientist! 👋 ":"")+(P.fmt?"<ul style='margin:6px 0'>"+pts.map(x=>`<li>${x}</li>`).join("")+"</ul>":pts.join(" ")),score:P.role+P.aud+P.ken+P.fmt}};

    box.querySelectorAll("[data-k]").forEach(b=>b.onclick=()=>{P[b.dataset.k]^=1;sfx("tap");draw()});
    $("#rn").onclick=()=>{const r=reply();if(!r){sfx("no");return draw(`<p class="help">🛑 <b>Stop!</b> Your prompt has a name and a school in it. Never put personal details in a prompt. Remove that part and try again.</p>`)}
      best=Math.max(best,r.score);sfx("ok");prog(.3+.15*r.score);
      draw(`<div class="card" style="background:var(--panel2);box-shadow:none"><span class="step">🤖 Practice AI answer</span><div style="margin-top:4px">${r.txt}</div></div><p>${["That answer is hard to understand! Add who it’s for and how to answer.","Getting better! Add more parts to improve it.","Nice! The answer is clearer and more useful.","Great prompt! One more part to make it perfect.","Perfect prompt! A clear role, audience, local example and format."][r.score]}</p>${r.score>=3?`<p class="c"><button class="btn" id="dn">Finish ✔</button></p>`:""}`);
      if($("#dn"))$("#dn").onclick=()=>fin(best==4?3:2)}};
  draw()}
const KW=[["You are a great friend",1],["Well done on your drawing",1],["Thank you for helping me",1],["Want to play with us?",1],["You are so stupid",0],["Nobody likes you",0],["Go away, loser",0],["Your drawing is ugly",0]],TW=["Thank you, friend","Go away, you are ugly","Well done, great job","Nobody wants your drawing"];
function wordsGame(fin,box){const lab={},tok=t=>t.toLowerCase().match(/[a-z']+/g)||[];let model;
  const draw=()=>{const n=Object.keys(lab).length;prog(.3+.3*n/KW.length);
    box.innerHTML=zsay("Teach me! Is each message kind or unkind? Label all 8, then train your AI.")+`<div class="opts">${KW.map((k,i)=>`<div class="opt" style="display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;cursor:default"><span>“${k[0]}”</span><span><button class="btn ${lab[i]===1?"":"s"}" style="font-size:15px;padding:6px 12px;margin:2px" data-i="${i}" data-v="1" aria-pressed="${lab[i]===1}">😊 Kind</button><button class="btn ${lab[i]===0?"r":"s"}" style="font-size:15px;padding:6px 12px;margin:2px" data-i="${i}" data-v="0" aria-pressed="${lab[i]===0}">😠 Unkind</button></span></div>`).join("")}</div><p class="c"><button class="btn v" id="tr" ${n<KW.length?"disabled":""}>🧠 Train my AI (${n}/${KW.length})</button></p>`;
    box.querySelectorAll("[data-i]").forEach(b=>b.onclick=()=>{lab[b.dataset.i]=+b.dataset.v;sfx("tap");draw()});$("#tr").onclick=train};
  const train=()=>{const c=[{},{}],tot=[0,0],docs=[0,0];KW.forEach((k,i)=>{const y=lab[i];docs[y]++;tok(k[0]).forEach(w=>{c[y][w]=(c[y][w]||0)+1;tot[y]++})});const V=new Set(KW.flatMap(k=>tok(k[0]))).size;
    model=t=>{const ws=tok(t),lp=[0,1].map(y=>Math.log((docs[y]+1)/(KW.length+2))+ws.reduce((a,w)=>a+Math.log(((c[y][w]||0)+1)/(tot[y]+V)),0)),m=Math.max(...lp),e=lp.map(v=>Math.exp(v-m));return{pk:e[1]/(e[0]+e[1]),known:ws.filter(w=>c[0][w]||c[1][w]),unknown:ws.filter(w=>!(c[0][w]||c[1][w]))}};
    sfx("ok");test()};
  const test=()=>{prog(.7);let tries=0;
    box.innerHTML=zsay("I’m trained! Test me with messages I’ve never seen. Tap one, or type your own (no real names, please).")+`<div class="chips">${TW.map((t,i)=>`<button data-t="${i}">“${t}”</button>`).join("")}</div><input id="wt" class="pw" maxlength="60" placeholder="Type a message…" autocomplete="off" aria-label="Type a message to test"><p class="c"><button class="btn v" id="ck">Ask my AI</button></p><div id="out" aria-live="polite"></div><p class="c"><button class="btn" id="dn" disabled>Finish ✔</button></p>`;
    const ask=t=>{if(!t.trim())return;const r=model(t),k=r.pk>=.5,pc=Math.round((k?r.pk:1-r.pk)*100);tries++;sfx("tap");
      $("#out").innerHTML=`<div class="say" style="margin:10px 0"><b>“${esc(t)}”</b><br>My AI says: <b>${k?"😊 Kind":"😠 Unkind"}</b> (${pc}% sure)<br><small>Words it knew: ${r.known.map(esc).join(", ")||"none!"}${r.unknown.length?` · Never seen: ${r.unknown.map(esc).join(", ")}`:""}</small>${r.known.length?"":"<br><small>It had to guess, because it never saw these words in training.</small>"}</div>`;if(tries>=2)$("#dn").disabled=false};
    box.querySelectorAll("[data-t]").forEach(b=>b.onclick=()=>{$("#wt").value=TW[b.dataset.t];ask(TW[b.dataset.t])});
    $("#ck").onclick=()=>ask($("#wt").value);$("#wt").onkeydown=e=>{if(e.key=="Enter")ask(e.target.value)};
    $("#dn").onclick=()=>{const good=KW.every((k,i)=>lab[i]===k[1]);prog(.95);box.innerHTML=zsay(`You built a real AI! It learned which words show up in kind and unkind messages. It only knows the words you taught it, so more examples make it smarter, and wrong labels make it worse.${S.a==2?" This kind of model is called a <b>Naive Bayes classifier</b>. Early email spam filters worked this way.":""}`)+`<p class="c"><button class="btn" id="cn">Continue ▶</button></p>`;$("#cn").onclick=()=>fin(good?3:2)}};
  draw()}

/* ---------- Lab tool 1: drawing recogniser (k-nearest neighbours) ---------- */
function labPad(c){const x=c.getContext("2d"),W=c.width;let d=0,last;
  const clear=()=>{x.fillStyle="#fff";x.fillRect(0,0,W,W)};clear();x.lineCap="round";x.lineJoin="round";x.lineWidth=W/16;x.strokeStyle="#1E1147";
  const pt=e=>{const r=c.getBoundingClientRect();return[(e.clientX-r.left)*W/r.width,(e.clientY-r.top)*W/r.height]};
  c.onpointerdown=e=>{d=1;last=pt(e);try{c.setPointerCapture(e.pointerId)}catch(_){}x.beginPath();x.arc(last[0],last[1],W/32,0,7);x.fillStyle="#1E1147";x.fill()};
  c.onpointermove=e=>{if(!d)return;const p=pt(e);x.beginPath();x.moveTo(last[0],last[1]);x.lineTo(p[0],p[1]);x.stroke();last=p};
  c.onpointerup=c.onpointercancel=c.onpointerleave=()=>d=0;
  return{clear,vec:()=>labFeat(c),thumb:()=>{const t=document.createElement("canvas");t.width=t.height=64;t.getContext("2d").drawImage(c,0,0,64,64);return t.toDataURL()}}}
function labFeat(c){const W=c.width,data=c.getContext("2d").getImageData(0,0,W,W).data;let x0=W,y0=W,x1=-1,y1=-1;
  for(let y=0;y<W;y++)for(let x=0;x<W;x++)if(data[(y*W+x)*4]<128){if(x<x0)x0=x;if(x>x1)x1=x;if(y<y0)y0=y;if(y>y1)y1=y}
  if(x1<0)return null;const s=Math.max(x1-x0,y1-y0)+W/10,cx=(x0+x1)/2,cy=(y0+y1)/2,t=document.createElement("canvas");t.width=t.height=20;const g=t.getContext("2d");g.fillStyle="#fff";g.fillRect(0,0,20,20);g.drawImage(c,cx-s/2,cy-s/2,s,s,0,0,20,20);
  const dd=g.getImageData(0,0,20,20).data,v=[];for(let i=0;i<400;i++)v.push(+(1-dd[i*4]/255).toFixed(3));return v}
function labKnn(Sm,v,k=3){const ds=Sm.map((s,i)=>({i,l:s.l,d:s.v.reduce((a,x,j)=>a+(x-v[j])**2,0)})).sort((a,b)=>a.d-b.d).slice(0,k),votes={};ds.forEach(o=>votes[o.l]=(votes[o.l]||0)+1);const best=Object.entries(votes).sort((a,b)=>b[1]-a[1])[0];return{l:+best[0],conf:best[1]/ds.length,near:ds}}

/* ---------- Lab tool 5: scam guard ---------- */
const GTR=[["You have WON KSh 50,000! Send your PIN to claim",1],["URGENT: your account is blocked, click this link now",1],["Send a KSh 1,000 fee today to get your prize",1],["Congratulations winner! Reply with your password",1],["Free data offer! Click the link and enter your PIN now",1],["Mum: dinner is ready, come home",0],["Teacher: homework is on page 12",0],["Grandpa: happy birthday my dear",0],["Coach: training moved to 4pm today",0],["Friend: see you at the library tomorrow",0]];
const GTE=[["WINNER! Claim your KSh 10,000 prize, send PIN now",1],["Click this link now to unblock your account",1],["You won free airtime, reply with your password",1],["Coach: well done at training today",0],["Mum: please buy bread on your way home",0],["Teacher: the prize giving is on Friday",0]];
LT.guard=(pn,done)=>{const st=lms("guard");let lab=st.lab||{},th=50,model=null;const tok=t=>t.toLowerCase().match(/[a-z]+/g)||[];
  const train=()=>{const c=[{},{}],tot=[0,0],docs=[0,0];GTR.forEach(([m],i)=>{const y=lab[i];docs[y]++;tok(m).forEach(w=>{c[y][w]=(c[y][w]||0)+1;tot[y]++})});const V=new Set(GTR.flatMap(([m])=>tok(m))).size;
    model=t=>{const lp=[0,1].map(y=>Math.log((docs[y]+1)/(GTR.length+2))+tok(t).reduce((a,w)=>a+Math.log(((c[y][w]||0)+1)/(tot[y]+V)),0));return 1/(1+Math.exp(-(lp[1]-lp[0])/3))}};
  const draw=()=>{const n=Object.keys(lab).length;
    if(!model){pn.innerHTML=zsay("Label Bibi Zawadi’s old messages: <b>scam</b> or <b>safe</b>? Your labels are the guard’s training data.")+`<div class="xmsgl">${GTR.map(([m],i)=>`<div class="xmrow"><p>“${m}”</p><span class="xchips"><button class="xchip ${lab[i]===1?"on":""}" data-i="${i}" data-v="1">🚩 Scam</button><button class="xchip ${lab[i]===0?"t":""}" data-i="${i}" data-v="0">✅ Safe</button></span></div>`).join("")}</div><p class="c"><button class="btn v" id="xtr" ${n<GTR.length?"disabled":""}>🧠 Train the guard (${n}/${GTR.length})</button></p>`;
      pn.querySelectorAll("[data-i]").forEach(b=>b.onclick=()=>{lab[b.dataset.i]=+b.dataset.v;st.lab=lab;save();sfx("tap");draw()});$("#xtr").onclick=()=>{train();sfx("ok");draw()};return}
    const sc=GTE.map(([m,y])=>({m,y,p:model(m)})),blocked=sc.filter(r=>r.p*100>=th),caught=blocked.filter(r=>r.y).length,fa=blocked.filter(r=>!r.y).length;
    pn.innerHTML=zsay("Your guard has learned! Here are <b>6 new messages</b> with scam scores. Move the slider to set how strict it is. Can you catch all 3 scams <b>without</b> blocking any good messages?")+
     `<label for="xth"><b>Block messages with a scam score above ${th}%</b></label><input type="range" id="xth" min="5" max="95" step="5" value="${th}"><div class="xrow mute" style="justify-content:space-between;font-size:13px"><span>◀ Strict: blocks more</span><span>Relaxed: blocks less ▶</span></div>
     <div class="xmsgl" style="margin-top:10px">${sc.map(r=>`<div class="xmrow"><p>“${r.m}”</p><span class="xscore" title="Scam score ${Math.round(r.p*100)}%"><i style="width:${r.p*100}%;background:${r.p*100>=th?"var(--pink)":"var(--mint)"}"></i></span><b style="min-width:120px">${r.p*100>=th?"🚩 Blocked":"✅ Allowed"} ${(r.p*100>=th)==!!r.y?"✔":"✘"}</b></div>`).join("")}</div>
     <div class="xgrid2" style="margin-top:12px"><div class="xres" style="background:rgba(20,184,134,.15)">🛡️ Scams caught: <b>${caught} of 3</b></div><div class="xres" style="background:rgba(255,93,143,.15)">😬 Good messages wrongly blocked: <b>${fa} of 3</b></div></div>
     ${engn("Caught scams are <b>true positives</b>. Wrongly blocked messages are <b>false positives</b>. Missed scams are <b>false negatives</b>. Moving the threshold trades one kind of mistake for another.")}

     ${(()=>{const bi=slots.indexOf("bat"),bp=bi<0?null:pos[bi];return `<g aria-hidden="true"><rect x="10" y="118" width="70" height="44" rx="6" fill="${solar?"#2E5AAC":"#C9CFE0"}" stroke="#1E1147" stroke-width="2"/><text x="45" y="150" text-anchor="middle" font-size="22">☀️</text><text x="45" y="180" text-anchor="middle" font-size="11" font-weight="800" fill="#1E1147">solar panel</text></g>${solar&&bp?`<line x1="80" y1="140" x2="${bp[0]-34}" y2="${bp[1]}" stroke="#1E1147" stroke-width="3" stroke-dasharray="5 4"/>`:""}`})()}</svg>

/* ---------- Lab tool 7 (hardware + software): smart watering ---------- */
LT.farm=(pn,done)=>{let th=35,ran=null;
  const sim=t=>{let m=50,dry=0,wet=0,water=0;const pts=[],pump=[];for(let h=0;h<48;h++){const hr=h%24,on=m<t;if(on){m+=9;water+=20}m-=(hr>=7&&hr<=18)?4.5:1.5;m=Math.max(0,Math.min(100,m));if(m<25)dry++;if(m>80)wet++;pts.push(m);pump.push(on)}return{pts,pump,dry,wet,water}};
  const ok=r=>r.dry==0&&r.wet==0,bestW=Math.min(...[20,25,30,35,40,45,50,55,60,65,70].map(sim).filter(ok).map(r=>r.water));
  const draw=()=>{const code=`while True:\n    moisture = soil.read()\n    if moisture < ${th}:\n        pump.on()\n    else:\n        pump.off()\n    sleep(1 hour)`;
    pn.innerHTML=zsay("Program Mzee Mutua’s smart farm! Set the rule: below what moisture should the pump switch on? Then run 2 days and nights of weather.")+
    `<div class="xgrid2"><div><div class="xtree" style="font-size:18px"><b>IF</b> soil moisture is below <b style="font-size:24px;color:var(--vio)">${th}%</b><br><b>THEN</b> 🚿 pump ON for 1 hour<br><b>ELSE</b> pump OFF</div><label for="xft" class="step" style="margin-top:10px">Move to change the rule</label><input type="range" id="xft" min="10" max="85" step="5" value="${th}"><p class="c"><button class="btn v" id="xrun2">▶ Run 48 hours</button></p></div>
    <div><p class="step">The same rule as real hardware code</p><pre>${code}</pre><div class="xeng" style="margin:0">This is MicroPython-style code, like you could run on a micro:bit with a moisture sensor and a pump.</div></div></div>
    <div id="xfo" aria-live="polite">${ran?farmChart(ran):""}</div>
    ${ran?`<div class="xgrid2"><div class="xres" style="background:${ran.dry?"rgba(255,93,143,.15)":"rgba(20,184,134,.15)"}">🥀 Hours too dry: <b>${ran.dry}</b> · 🌊 Hours too wet: <b>${ran.wet}</b></div><div class="xres">💧 Water used: <b>${ran.water} litres</b>${ok(ran)?` <span class="mute">(the least possible while keeping plants healthy is ${bestW} L)</span>`:""}</div></div>
    <p class="mute" style="margin:8px 0">${!ok(ran)?(ran.dry?"The plants got too dry. Try switching the pump on earlier (a higher number).":"The soil got soggy and water was wasted. Try a lower number."):ran.water<=bestW*1.25?"Healthy plants and very little water wasted. Mzee Mutua is thrilled!":"Plants are healthy! Can you save more water with a lower number?"}</p>
    <p class="c"><button class="btn" id="xfin">${ok(ran)?"Finish building ▶":"Finish anyway ▶"}</button></p>`:""}
    ${engn("This is a <b>feedback loop</b>, like a fridge thermostat. A real system would also add <b>hysteresis</b> (switch on at 30%, off at 45%) so the pump doesn’t flick on and off too often.")}`;
    $("#xft").oninput=e=>{th=+e.target.value;ran=null;draw();$("#xft").focus()};
    $("#xrun2").onclick=()=>{ran=sim(th);sfx(ok(ran)?"ok":"no");draw()};
    if($("#xfin"))$("#xfin").onclick=()=>done(ok(ran)&&ran.water<=bestW*1.25?3:ok(ran)?2:1,`Pump on below ${th}% · ${ran.water} L used`)};
  draw()};
function farmChart(r){const W=560,H=220,L=40,R=10,T=10,B=30,X=i=>L+i/47*(W-L-R),Y=v=>H-B-v/100*(H-T-B);let g=`<rect width="${W}" height="${H}" fill="#fff"/><rect x="${L}" y="${Y(80)}" width="${W-L-R}" height="${Y(25)-Y(80)}" fill="#C9F5E4"/><text x="${W-R-4}" y="${Y(80)+14}" text-anchor="end" font-size="11" fill="#0B3B2C" font-weight="800">healthy zone</text>`;
  for(let d=0;d<2;d++)g+=`<rect x="${X(d*24+19)}" y="${T}" width="${X(d*24+30>47?47:d*24+30)-X(d*24+19)}" height="${H-T-B}" fill="#1E1147" opacity=".06"/>`;
  [0,25,50,75,100].forEach(v=>g+=`<text x="${L-6}" y="${Y(v)+4}" text-anchor="end" font-size="11" fill="#5A5480">${v}%</text>`);
  [0,12,24,36,47].forEach(i=>g+=`<text x="${X(i)}" y="${H-10}" text-anchor="middle" font-size="11" fill="#5A5480">${i==47?"48h":i+"h"}</text>`);
  r.pump.forEach((p,i)=>{if(p)g+=`<rect x="${X(i)-3}" y="${H-B-8}" width="6" height="8" fill="#3BB7E0"/>`});
  g+=`<polyline points="${r.pts.map((v,i)=>X(i)+","+Y(v)).join(" ")}" fill="none" stroke="#6A3CE0" stroke-width="3"/>`;
  return `<p class="step" style="margin-top:12px">Soil moisture over 2 days (shaded = night, blue ticks = pump on)</p><svg class="xplot" viewBox="0 0 ${W} ${H}" role="img" aria-label="Soil moisture chart over 48 hours">${g}</svg>`}

/* ---------- Parent Zone: grown-up gate, then each child's real saved progress ---------- */
const FAM=["We never share names, schools, addresses, passwords or photos with an AI or with strangers online.","We pause and check important AI answers with a book, a trusted website or a grown-up.","Younger children use AI tools with a grown-up nearby.","If something online feels wrong or scary, we stop and tell a grown-up straight away. Nobody gets in trouble for telling.","We take screen breaks, and screens stay out of bedrooms at night.","Mistakes are okay. We learn from them together."];
function parent(){if(!S)return;
  const shell=h=>{pz.innerHTML=`<div class="dh" style="background:var(--vio)"><h2>👨‍👩‍👧 Parent Zone</h2></div><div class="pbody">${h}</div>`;if(!pz.open)pz.showModal()};
  const setup=()=>{shell(`<p><b>Create a 4-digit Parent PIN.</b> You’ll use it to open the Parent Zone. Keep it secret from the kids!</p><input id="p1" class="pw" inputmode="numeric" maxlength="4" type="password" aria-label="New PIN" placeholder="PIN" style="width:150px;display:inline-block"> <input id="p2" class="pw" inputmode="numeric" maxlength="4" type="password" aria-label="Repeat PIN" placeholder="Repeat" style="width:150px;display:inline-block"><p><button class="btn v" id="ps">Save PIN</button><button class="btn s" id="gx">Close</button></p><p id="ge" aria-live="polite"></p>`);
    $("#p1").focus();$("#gx").onclick=()=>pz.close();$("#ps").onclick=()=>{const a=$("#p1").value,b=$("#p2").value;if(!/^\d{4}$/.test(a)){$("#ge").textContent="The PIN must be 4 numbers.";return}if(a!=b){$("#ge").textContent="The two PINs don’t match. Try again.";return}DB.pin=a;save();view(S.id)}};
  const ask=()=>{shell(`<p>Grown-ups only. Enter your Parent PIN.</p><input id="ga" class="pw" inputmode="numeric" maxlength="4" type="password" aria-label="Parent PIN" style="width:150px;display:inline-block"><button class="btn v" id="gb">Open</button><button class="btn s" id="gx">Close</button><p id="ge" aria-live="polite"></p><p><button class="tts" id="fg" style="font-size:14px;padding:4px 12px">Forgot PIN?</button></p>`);
    $("#ga").focus();$("#gx").onclick=()=>pz.close();$("#ga").onkeydown=e=>{if(e.key=="Enter")$("#gb").click()};
    $("#gb").onclick=()=>{if($("#ga").value!==DB.pin){$("#ge").textContent="That PIN isn’t right. Try again.";$("#ga").value="";return}view(S.id)};
    $("#fg").onclick=()=>{const a=13+Math.random()*12|0,b=14+Math.random()*12|0;shell(`<p>To reset the PIN, solve this grown-up sum: <b>${a} × ${b}</b></p><input id="gr" class="pw" inputmode="numeric" style="width:150px;display:inline-block" aria-label="Answer"><button class="btn v" id="gb2">Reset PIN</button><p id="ge" aria-live="polite"></p>`);
      $("#gb2").onclick=()=>{if(+$("#gr").value!=a*b){$("#ge").textContent="Not quite. Try again.";return}DB.pin="";save();setup()}}};
  DB.pin?ask():setup()}
function view(id){const K=DB.kids.find(k=>k.id==id),me=S;S=K;
  const all=allL(),done=all.filter(x=>x.done).length,wk=[...Array(7)].map((_,i)=>{const d=new Date(Date.now()-(6-i)*864e5),k=dk(d);return[d.toLocaleDateString("en",{weekday:"short"}),K.mn[k]||0]}),mins=wk.reduce((s,d)=>s+d[1],0),mx=Math.max(10,...wk.map(d=>d[1]));
  const weak=all.filter(x=>x.done==1).map(x=>`${x.W.e} ${x.N.t}`),next=all.find(x=>x.open&&!x.done);
  const last7=[...Array(7)].map((_,i)=>dk(new Date(Date.now()-i*864e5))),wkL=last7.reduce((a,k)=>a+(K.h[k]||0),0),wkS=last7.reduce((a,k)=>a+((K.sg||{})[k]||0),0),days=last7.filter(k=>K.h[k]).length;
  const plan=[];all.filter(x=>x.done==1).slice(0,1).forEach(x=>plan.push(x));Object.keys(D).forEach(w=>{const x=all.find(y=>y.w==w&&y.open&&!y.done);if(x&&plan.length<3&&!plan.includes(x))plan.push(x)});
  const report=`DigiSoma weekly report for ${K.n} (${AGs[K.a]})\n• Learned on ${days} of the last 7 days, ${pl(mins,"minute")} in total\n• ${pl(wkL,"lesson")} played, ${pl(wkS,"new star")} earned\n• ${done} of ${all.length} lessons finished overall\n• This week’s plan: ${plan.map(x=>x.N.t).join(", ")||"replay favourite lessons"}`;
  const body=`<div class="ptabs" role="tablist">${DB.kids.map(k=>`<button role="tab" aria-selected="${k.id==id}" class="${k.id==id?"on":""}" data-k="${k.id}">${k.av} ${esc(k.n)}</button>`).join("")}</div>
  <h3 style="font-size:22px">${K.av} ${esc(K.n)} · ${AG[K.a]}</h3>
  <div class="tiles"><div class="tile"><b>${done}/${all.length}</b>lessons done</div><div class="tile"><b>${mins} min</b>this week</div><div class="tile"><b>${streakOf(K)}</b>day streak</div><div class="tile"><b>${stars()}</b>stars</div></div>
  <b>Minutes learning, last 7 days</b><div class="wk" role="img" aria-label="Minutes learning per day for the last 7 days">${wk.map(d=>`<div><small>${d[1]||""}</small><i style="height:${d[1]/mx*64}px"></i>${d[0]}</div>`).join("")}</div><p class="step" style="font-weight:600">Short daily sessions of 15–30 minutes, with breaks, work well for ages 6–16.</p>
  <p style="margin-top:12px"><b>Progress by world</b></p>${Object.entries(D).map(([w,W])=>{const L=lessons(w),k=L.filter(Boolean).length;return `<div style="margin-bottom:8px"><b>${W.e} ${W.t}</b> <small class="mute">${k}/${L.length}</small><div class="pb k"><i style="width:${k/L.length*100}%;background:${W.c}"></i></div></div>`}).join("")}
  <div class="card" style="background:var(--panel2);box-shadow:none;margin:12px 0"><b>📅 This week</b><p style="margin:6px 0">${esc(K.n)} learned on <b>${days} of the last 7 days</b>, played <b>${pl(wkL,"lesson")}</b> and earned <b>${pl(wkS,"new star")}</b>.</p><b>This week’s plan</b><ol style="margin:6px 0 8px;padding-left:22px">${plan.map(x=>`<li>${x.W.e} ${x.N.t}${x.done==1?" (practice again)":""}</li>`).join("")||"<li>Replay favourite lessons for 3 stars</li>"}</ol><button class="btn v" id="cpr" style="font-size:16px;padding:8px 16px">📋 Copy report for WhatsApp</button><span id="cpm" class="mute" aria-live="polite"></span></div>
  <p><b>Up next:</b> ${next?`${next.W.e} ${next.N.t}`:"everything is finished. Amazing!"}<br><b>Could use practice:</b> ${weak.length?weak.slice(0,3).join(", ")+". Replaying together helps.":"nothing yet. Great going!"}<br><b>Last feeling shared:</b> ${K.m||"none yet"}<br><b>Dream:</b> ${K.dr||"not chosen yet"}</p>
  <p><button class="btn" id="trial">Start 7-day free trial</button><button class="btn s" id="pin">Change PIN</button><button class="btn s" id="rs">Reset progress</button><button class="btn r" id="rm">Remove ${esc(K.n)}</button><button class="btn s" id="cx">Close</button></p><p id="pm" aria-live="polite"></p>
  <details style="margin-top:12px"><summary>🤝 Family AI agreement</summary><p>Agree on these rules together, then keep them somewhere everyone can see.</p><ol id="fam" style="margin:8px 0;padding-left:22px">${FAM.map(x=>`<li>${x}</li>`).join("")}</ol><button class="btn v" id="cpf" style="font-size:16px;padding:8px 16px">📋 Copy agreement</button><span id="cpfm" class="mute" aria-live="polite"></span></details>
  <p class="note"><b>Prototype note.</b> Progress is saved only in this browser. Before launch, DigiSoma still needs: a data-protection review (including Kenya’s Data Protection Act and verifiable parental consent), content review by teachers and child psychologists, secure parent accounts, and real M-Pesa and card billing.</p>`;
  S=me;pz.querySelector(".pbody").innerHTML=body;
  pz.querySelectorAll("[data-k]").forEach(b=>b.onclick=()=>view(b.dataset.k));
  $("#cpr").onclick=async()=>{try{await navigator.clipboard.writeText(report);$("#cpm").textContent=" Copied! Paste it into WhatsApp or SMS."}catch(e){$("#cpm").textContent=" Copy isn’t allowed here."}};
  $("#pin").onclick=()=>{DB.pin="";save();parent()};
  $("#cpf").onclick=async()=>{try{await navigator.clipboard.writeText("Our family AI agreement\n"+FAM.map((x,i)=>`${i+1}. ${x}`).join("\n"));$("#cpfm").textContent=" Copied!"}catch(e){$("#cpfm").textContent=" Copy isn’t allowed here."}};
  $("#cx").onclick=()=>pz.close();$("#trial").onclick=()=>$("#pm").textContent="Preview only: payments will go live in the real app.";
  const twice=(el,msg,f)=>{let sure=0;el.onclick=()=>{if(!sure){sure=1;el.textContent=msg;return}f()}};
  twice($("#rs"),"Tap again to erase "+K.n+"’s progress",()=>{Object.assign(K,{p:{},s:0,b:0,d:"",h:{},mn:{},m:"",dr:"",l:"",ms:{}});save();pz.close();route()});
  twice($("#rm"),"Tap again to remove "+K.n,()=>{DB.kids=DB.kids.filter(k=>k!=K);if(S==K)useKid(DB.kids[0]||null);save();pz.close();location.hash=DB.kids.length?"kids":"new";route()})}

/* ---------- SOMA helper bot (rule-based, offline, private) ---------- */
const GL=[[/circuit/,"A <b>circuit</b> is a complete loop that electricity flows around. Any gap stops it. Build one in the Lab: <a href='#lab/solar'>Light up evening study</a>!"],[/sensor/,"A <b>sensor</b> is a machine’s sense, like a light, temperature or moisture sensor. Try <a href='#lab/farm'>Smart farm watering</a>."],[/microcontroller|micro:?bit|arduino/,"A <b>microcontroller</b> is a tiny computer on a chip. Boards like the micro:bit and Arduino let learners program real hardware."],[/resistor/,"A <b>resistor</b> limits electric current to protect parts like LEDs."],[/\bled\b/,"An <b>LED</b> is a tiny light. It needs a resistor so it doesn’t burn out!"],[/actuator|motor|pump/,"An <b>actuator</b> turns a signal into action: motors spin, pumps move water, buzzers beep."],[/\blab\b|mission/,"The <a href='#lab'>Lab</a> has 8 build missions where you make real AI tools and hardware for communities in Kenya! 🧪"],[/replace|take over|jobs?|future of (coding|software)/,"AI can write lots of code now, but people still decide what to build, check it’s right and safe, design systems and build hardware. Learn to code AND to lead the AI! Try <a href='#play/hw/3/1'>AI writes code, you lead</a>."],[/\b(ai|artificial intelligence|akili bandia)\b/,"<b>AI</b> (artificial intelligence) means computers that can learn from examples and make guesses, like spotting faces or understanding words. In Swahili we say <i>akili bandia</i>."],
[/machine learning|\bml\b/,"<b>Machine learning</b> is how AI learns: you show it lots of examples and it finds patterns. Try it in <a href='#play/code/2/2'>Teach the AI</a>!"],
[/algorithm/,"An <b>algorithm</b> is a list of steps to get something done, like a recipe. Code is algorithms for computers."],
[/\bloops?\b/,"A <b>loop</b> repeats steps for you. Instead of ➡️➡️➡️➡️ you say “repeat 4 times: ➡️”. Practise in <a href='#play/code/1/1'>Rooftop garden</a>."],
[/\bbugs?\b|debug/,"A <b>bug</b> is a mistake in code. <b>Debugging</b> is finding and fixing it, one step at a time. Every coder makes bugs!"],
[/\b(code|coding|program|programming)\b/,"<b>Code</b> is instructions that tell a computer exactly what to do. Start with <a href='#play/code/0/0'>What is code?</a> 🎬"],
[/prompt/,"A <b>prompt</b> is the message you give an AI. Say who it should act like, who it’s for and how to answer. And never add personal details! Try <a href='#play/code/3/0'>Prompt power</a>."],
[/\bdata\b/,"<b>Data</b> is information we collect: numbers, words, pictures. AI learns from data, so good data matters!"],
[/\bbias\b|unfair/,"<b>Bias</b> is when AI is unfair because its training data left people out. Varied data makes fairer AI."],
[/deepfake/,"A <b>deepfake</b> is a fake photo, voice or video made by AI. If something looks shocking, pause and check trusted sources."],
[/hallucinat/,"When an AI confidently makes up something false, it’s called a <b>hallucination</b>. Always verify important facts!"],
[/password/,"Strong passwords are long and mixed. Try three random words plus a number and a symbol, like Simba#Chai#Moto42. Keep it secret!"],
[/\bscams?\b|fraud/,"A <b>scam</b> is a trick to steal money or information. Red flags: a rush, a prize, a secret, or asking for PINs. Practise in <a href='#play/safe/0/1'>Scam or safe?</a>"],
[/python/,"<b>Python</b> is a popular text coding language. Builders and Pioneers see the Python version of their robot code after each win!"],
[/binary/,"<b>Binary</b> is how computers count, using only 0 and 1. Binary 101 = 5!"],

[/internet|online/,"The <b>internet</b> connects computers all over the world. Remember: pause, protect, verify! 🛡️"],
[/empathy/,"<b>Empathy</b> means trying to feel what someone else feels, as if you were in their shoes."],

const JOKES=["Why did the computer go to the doctor? It had a virus! 🤒","Why was the robot so tired? It had a hard drive! 💾","What do you call a sleeping dinosaur? A dino-snore! 🦕","Why did the mango go to school? To become a smoothie operator! 🥭","Why do programmers mix up Halloween and Christmas? Because Oct 31 = Dec 25! 🎃 (Ask a Pioneer to explain!)"];
const FACTS=["M-Pesa launched in Kenya in 2007 and changed how millions of people send money. 💚","The first computer “bug” was a real moth, found in 1947! 🦋","Your brain has about 86 billion neurons. AI “neural networks” are inspired by them. 🧠","Binary uses only 0 and 1, yet it can store every photo, song and game! 💾","Kiswahili is spoken by tens of millions of people across East Africa. 🌍"];
let somaInit=0;
function somaSay(h,me){const d=document.createElement("div");d.className="bm "+(me?"me":"bot");d.innerHTML=h;$("#smsgs").append(d);$("#smsgs").scrollTop=1e6}
function somaChips(a){$("#squick").innerHTML=a.map(x=>`<button type="button">${x}</button>`).join("");$("#squick").querySelectorAll("button").forEach(b=>b.onclick=()=>somaAsk(b.textContent))}
function nextLesson(){if(!S)return null;const x=allL().find(y=>y.open&&!y.done);return x}
function somaReply(t){const s=t.toLowerCase(),nm=S?esc(S.n):"rafiki";
  if(/\b0?7\d{8}\b|\+?254\d{9}|\b\d{9,}\b|my (address|school|phone|password|pin)|i live (in|at|on)|i go to [a-z ]*school/.test(s))return "Whoa, careful! 🛑 Please don’t share personal details like phone numbers, addresses, school names, PINs or passwords, even with me. <b>Pause, protect, verify!</b>";
  if(/suicide|kill myself|want to die|hurt myself|self.?harm|end my life/.test(s))return `I’m really glad you told me, ${nm}. 💛 This is important: please talk to a grown-up you trust <b>right now</b>, like a parent, carer or teacher. In Kenya you can call <b>Childline on 116</b>, free, any time. You matter, and you don’t have to handle this alone.`;
  if(/\b(sad|worried|scared|afraid|angry|lonely|alone|bullied|bully|unsafe|crying|upset|anxious|stressed)\b/.test(s))return `I’m sorry you feel that way, ${nm}. 💛 Every feeling is okay. Try a few slow belly breaths with me in <a href='#play/feel/1/0'>Belly breathing</a>. And please tell a trusted grown-up how you feel. You can also call <b>Childline Kenya on 116</b> for free.`;
  if(/^(hi|hello|hey|jambo|habari|mambo|sasa|niaje|hujambo|good (morning|afternoon|evening))\b/.test(s))return `Jambo, ${nm}! 👋 I’m Soma, your DigiSoma helper. Ask me what a word means, what to learn next, or for a joke!`;
  if(/joke|funny|laugh/.test(s))return JOKES[Math.random()*JOKES.length|0];
  if(/fact|did you know/.test(s))return "Did you know? "+FACTS[Math.random()*FACTS.length|0];
  if(/who (made|built|created)|founder|allan/.test(s))return "DigiSoma was founded by <b>Allan</b>, an AI and data engineer in Nairobi who uses AI and data for social change and cares deeply about children’s wellbeing. Read more in <a href='#welcome'>About DigiSoma</a>.";
  if(/price|cost|pay|m-?pesa plan|subscri|how much/.test(s))return "The Explorer Pass is <b>$5 a month</b> for up to 3 children, with a 7-day free trial. Families will be able to pay by M-Pesa or card. (Payments aren’t switched on in this preview yet.)";
  if(/\bsafe|privacy|private|my data\b/.test(s))return "DigiSoma has no ads and no chat with strangers. Children only give a first name and age group, and progress stays on this device. Grown-ups use a PIN-protected Parent Zone. 🛡️";
  for(const[re,ans]of GL)if(re.test(s))return ans;
  if(/next|recommend|what should|bored|learn/.test(s)){if(!S)return "Tap <a href='#new'>Start learning</a> to set up a learner, and I’ll suggest lessons!";const x=nextLesson();return x?`How about <a href='#play/${x.w}/${x.t}/${x.l}'>${x.N.t}</a> in ${x.W.e} ${x.W.t}? Let’s go! 🚀`:"Wow, you’ve finished every lesson! Replay any lesson to win 3 stars. 🌟"}
  if(/star|progress|xp|level|streak|how am i/.test(s)){if(!S)return "Set up a learner first and I’ll track your stars!";const done=allL().filter(x=>x.done).length;return `You’ve finished <b>${done} of ${allL().length}</b> lessons and <b>${labDone()} of ${LM.length}</b> Lab missions, earned <b>${stars()} stars</b> and have a <b>${streakOf(S)}-day streak</b>. Keep going, ${nm}! 🔥`}
  if(/swahili|kiswahili|word/.test(s)){const w=WD[Math.random()*WD.length|0];return `Here’s a Swahili tech word: <b>${w[0]}</b> means “${w[1]}”. ${w[2]}`}
  if(/video|watch/.test(s))return "DigiSoma has short animated videos! Find them in the 🎬 shelf on the <a href='#learn'>Learn</a> page.";
  if(/story|maze|create|make/.test(s))return "Go to <a href='#create'>Create</a> to make an Akili’s Story or build a maze for a friend! 🎨";
  if(/thank|asante/.test(s))return "Karibu sana! 😊 Happy learning!";
  if(/help|how|stuck/.test(s))return "I can help! Try asking me: “What is a loop?”, “What should I learn next?”, “How many stars do I have?” or “Tell me a joke”. In a lesson, read Akili’s tip and tap 🔊 to hear it.";
  return "Hmm, I’m still learning that one! 🤔 Try asking: “What is AI?”, “What should I learn next?” or “Tell me a fun fact”.";}
function somaAsk(t){t=(t||"").trim();if(!t)return;somaSay(esc(t),1);sfx("tap");setTimeout(()=>{somaSay(somaReply(t));somaChips(["What should I learn next?","What is AI?","Tell me a joke","Fun fact"])},calm?50:450)}
function somaOpen(o){const p=$("#somap");p.classList.toggle("open",o);p.setAttribute("aria-hidden",!o);$("#somafab").setAttribute("aria-expanded",o);
  if(o&&!somaInit){somaInit=1;somaSay(`Jambo${S?", "+esc(S.n):""}! 👋 I’m <b>Soma</b>, your DigiSoma helper. I can explain tech words, suggest lessons, tell jokes and help when you’re stuck.`);somaChips(["What should I learn next?","What is a loop?","Is DigiSoma safe?","Tell me a joke"])}
  if(o)setTimeout(()=>$("#sin").focus(),250)}
$("#somafab").onclick=()=>somaOpen(!$("#somap").classList.contains("open"));$("#somax").onclick=()=>somaOpen(false);
