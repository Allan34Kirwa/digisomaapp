<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="DigiSoma Lab: children in Kenya build real AI tools on missions for their communities.">
<meta name="theme-color" content="#0F1B3D">
<title>DigiSoma Lab</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Lexend:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* Concept: a maker's lab. Children are junior AI engineers on missions across Kenya.
   Look: bold "maker" cards with thick navy outlines and offset shadows, kitenge-inspired zigzag bands, saffron/teal/magenta on warm paper. */
:root{--navy:#0F1B3D;--navy2:#1D2C63;--teal:#0FA88F;--saffron:#FFB703;--magenta:#D63A6E;--sky:#3BB7E0;--paper:#FBF6EC;--card:#fff;--ink:#0F1B3D;--mute:#535C7A;--line:#E3DACA;
  --disp:"Bricolage Grotesque","Trebuchet MS",system-ui,sans-serif;--body:"Lexend","Segoe UI",system-ui,sans-serif;color-scheme:light}
*{box-sizing:border-box}[hidden]{display:none!important}
html,body{margin:0}body{background:var(--paper);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.55}
h1,h2,h3{font-family:var(--disp);font-weight:800;line-height:1.05;margin:0;letter-spacing:-.01em;text-wrap:balance}
a{color:inherit;text-decoration:none}button{font:inherit;cursor:pointer;color:inherit}
:focus-visible{outline:4px solid var(--sky);outline-offset:3px;border-radius:10px}
.zig{height:14px;background:linear-gradient(135deg,var(--navy) 33%,transparent 33%) 0 0/22px 22px,linear-gradient(225deg,var(--navy) 33%,transparent 33%) 0 0/22px 22px,var(--saffron)}
.zig.t{background:linear-gradient(135deg,var(--navy) 33%,transparent 33%) 0 0/22px 22px,linear-gradient(225deg,var(--navy) 33%,transparent 33%) 0 0/22px 22px,var(--teal)}
header{position:sticky;top:0;z-index:20;background:var(--navy);color:#fff}
.bar{max-width:1120px;margin:0 auto;display:flex;align-items:center;gap:14px;padding:10px 18px;flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:8px;font-family:var(--disp);font-weight:800;font-size:24px}.logo svg{width:34px;height:34px}.logo i{font-style:normal;color:var(--saffron)}
.logo small{font-family:var(--body);font-size:11px;font-weight:700;background:var(--teal);color:#fff;border-radius:6px;padding:2px 6px;letter-spacing:.06em}
nav.tabs{display:flex;gap:6px;margin-left:auto}
nav.tabs a{padding:7px 14px;border-radius:12px;font-weight:700;font-size:15px;color:#D8DDF0}
nav.tabs a.on{background:var(--saffron);color:var(--navy)}
.eng{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:700;color:#D8DDF0;background:var(--navy2);border:0;border-radius:12px;padding:7px 12px}
.eng b{display:inline-block;width:34px;height:20px;border-radius:99px;background:#46557F;position:relative;transition:background .2s}.eng b:after{content:"";position:absolute;top:3px;left:3px;width:14px;height:14px;border-radius:50%;background:#fff;transition:transform .2s}
.eng[aria-pressed="true"] b{background:var(--teal)}.eng[aria-pressed="true"] b:after{transform:translateX(14px)}
main{max-width:1120px;margin:0 auto;padding:26px 18px 90px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--saffron);color:var(--navy);border:3px solid var(--navy);box-shadow:4px 4px 0 var(--navy);border-radius:14px;padding:10px 20px;font-family:var(--disp);font-weight:800;font-size:18px;margin:4px;transition:transform .08s,box-shadow .08s}
.btn:hover{transform:translate(-1px,-1px);box-shadow:5px 5px 0 var(--navy)}.btn:active{transform:translate(3px,3px);box-shadow:1px 1px 0 var(--navy)}
.btn.w{background:#fff}.btn.t{background:var(--teal);color:#fff}.btn.m{background:var(--magenta);color:#fff}.btn.n{background:var(--navy);color:#fff;box-shadow:4px 4px 0 var(--saffron)}
.btn.sm{font-size:15px;padding:6px 12px;box-shadow:3px 3px 0 var(--navy)}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none;box-shadow:4px 4px 0 var(--navy)}
.card{background:var(--card);border:3px solid var(--navy);border-radius:20px;box-shadow:6px 6px 0 var(--navy);padding:20px}
.kick{font-family:var(--body);font-weight:700;text-transform:uppercase;letter-spacing:.1em;font-size:13px;color:var(--magenta);margin:0 0 6px}
.mute{color:var(--mute)}.c{text-align:center}
h1{font-size:clamp(36px,6vw,64px)}h2{font-size:clamp(26px,3.6vw,38px)}h3{font-size:22px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:20px}.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:18px}
.pill{display:inline-block;border:2px solid var(--navy);border-radius:99px;padding:3px 12px;font-weight:700;font-size:14px;background:#fff;margin:2px}
/* hero */
.hero{background:var(--navy);color:#fff;border-radius:28px;padding:34px;display:grid;grid-template-columns:1.25fr .75fr;gap:24px;align-items:center;position:relative;overflow:hidden;box-shadow:8px 8px 0 var(--saffron)}
.hero h1 em{font-style:normal;color:var(--saffron)}.hero p{color:#D8DDF0;font-size:19px}
.hero .glow{position:absolute;right:-80px;top:-80px;width:320px;height:320px;border-radius:50%;background:radial-gradient(circle,rgba(15,168,143,.55),transparent 70%)}
.akb{width:100%;max-width:260px;filter:drop-shadow(0 14px 30px rgba(15,168,143,.45));animation:bob 3.2s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-10px)}}
.eye{transform-origin:center;transform-box:fill-box;animation:blink 4s infinite}@keyframes blink{0%,94%,100%{transform:scaleY(1)}97%{transform:scaleY(.1)}}
.steps5{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-top:16px}
.st5{background:#fff;border:3px solid var(--navy);border-radius:16px;padding:14px;box-shadow:4px 4px 0 var(--navy)}.st5 b{font-family:var(--disp);font-size:20px;display:block}.st5 span{font-size:28px}.st5 small{color:var(--mute);font-size:14px;line-height:1.35;display:block;margin-top:4px}
/* map */
.mapw{position:relative;background:#E8F6F3;border:3px solid var(--navy);border-radius:24px;box-shadow:6px 6px 0 var(--navy);overflow:hidden}
.mapw svg{display:block;width:100%;height:auto}.mapw text{font-family:var(--body)}
.mnode{cursor:pointer}.mnode circle.r{transition:r .15s}.mnode:hover circle.r,.mnode:focus circle.r{r:34}
.mnode:focus{outline:none}.mnode:focus-visible circle.r{stroke:var(--sky);stroke-width:6}
.mlist{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px;margin-top:22px}
.mcard{display:flex;gap:14px;align-items:flex-start;background:#fff;border:3px solid var(--navy);border-radius:20px;box-shadow:5px 5px 0 var(--navy);padding:16px;transition:transform .1s}.mcard:hover{transform:translate(-2px,-2px)}
.mcard .ic{flex:none;width:62px;height:62px;border-radius:16px;border:3px solid var(--navy);display:grid;place-items:center;font-size:30px}
.mcard b{font-family:var(--disp);font-size:21px;line-height:1.1;display:block}.mcard small{color:var(--mute);font-size:14px}
.badge{display:inline-block;font-size:12px;font-weight:700;border-radius:8px;padding:2px 8px;border:2px solid var(--navy);margin-top:6px}
/* mission shell */
.mhead{border-radius:24px;border:3px solid var(--navy);box-shadow:6px 6px 0 var(--navy);padding:20px 22px;color:#fff;display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.mhead .ic{font-size:52px;line-height:1}.mhead a{font-weight:700;font-size:14px;color:#fff;opacity:.9}
.stepper{display:flex;gap:6px;margin:18px 0;flex-wrap:wrap}.stepper span{flex:1;min-width:90px;text-align:center;border:3px solid var(--navy);border-radius:12px;padding:6px 8px;font-weight:700;font-size:14px;background:#fff}
.stepper span.on{background:var(--saffron)}.stepper span.done{background:var(--teal);color:#fff}
.panel{background:#fff;border:3px solid var(--navy);border-radius:22px;box-shadow:6px 6px 0 var(--navy);padding:22px}
.say{display:flex;gap:12px;align-items:flex-start;margin-bottom:14px}.say svg{flex:none;width:64px;height:64px}.say div{background:#EEF7F5;border:2px solid var(--navy);border-radius:4px 18px 18px 18px;padding:10px 14px}
.who{display:flex;gap:12px;align-items:center;background:#FFF3D1;border:2px solid var(--navy);border-radius:16px;padding:12px 14px;margin:10px 0}.who span{font-size:40px}
.lcards{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;margin:10px 0}
.lcard{border:3px solid var(--navy);border-radius:18px;padding:14px;background:#fff}.lcard span{font-size:34px}.lcard b{font-family:var(--disp);font-size:19px;display:block;margin:4px 0}.lcard p{margin:0;font-size:15px;color:var(--mute)}
.engnote{display:none;background:#E9EDFB;border:2px dashed var(--navy2);border-radius:14px;padding:10px 14px;font-size:15px;margin:10px 0}.engnote b{color:var(--navy2)}
body.engineer .engnote{display:block}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.row.c{justify-content:center}
/* tool: drawing */
.draw{display:grid;grid-template-columns:auto 1fr;gap:20px;align-items:start}
canvas.pad{width:260px;height:260px;border:3px solid var(--navy);border-radius:18px;background:#fff;touch-action:none;cursor:crosshair;box-shadow:4px 4px 0 var(--navy)}
.classes{display:grid;gap:12px}.cls{border:3px solid var(--navy);border-radius:16px;padding:10px 12px;background:#fff}.cls .row{gap:6px}
.cls input{font:inherit;font-weight:700;border:2px solid var(--line);border-radius:10px;padding:4px 8px;width:150px}
.thumbs{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px;min-height:44px}.thumbs img{width:44px;height:44px;border:2px solid var(--navy);border-radius:8px;background:#fff}
.result{border:3px solid var(--navy);border-radius:16px;padding:12px 14px;background:#FFF3D1;margin-top:12px}
.meterb{height:16px;border:2px solid var(--navy);border-radius:99px;overflow:hidden;background:#fff}.meterb i{display:block;height:100%;background:var(--teal)}
/* tool: tree */
.leaves{display:grid;grid-template-columns:repeat(auto-fill,minmax(78px,1fr));gap:8px;margin:10px 0}.lf{border:2px solid var(--navy);border-radius:12px;background:#fff;text-align:center;padding:4px;font-size:12px;font-weight:700}.lf svg{width:56px;height:56px}
.lf.ok{background:#DDF5EF}.lf.no{background:#FBE0E8}
.tree{border:3px solid var(--navy);border-radius:16px;padding:12px;background:#F6F8FF}.tq{font-family:var(--disp);font-weight:800;font-size:19px}
.br{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}.brb{border:2px dashed var(--navy2);border-radius:14px;padding:10px;background:#fff}.brb>b{display:block;margin-bottom:6px}
.chips{display:flex;gap:6px;flex-wrap:wrap}.chip{border:2px solid var(--navy);background:#fff;border-radius:99px;padding:5px 12px;font-weight:700;font-size:14px}.chip.on{background:var(--saffron)}.chip.t{background:var(--teal);color:#fff}
/* tool: chat */
.intents{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:12px}
.intent{border:3px solid var(--navy);border-radius:16px;padding:12px;background:#fff}.intent h3{font-size:18px;margin-bottom:6px}
.intent textarea{width:100%;font:inherit;font-size:15px;border:2px solid var(--line);border-radius:10px;padding:6px 8px;resize:vertical;min-height:54px}
.kw{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0}
.addkw{display:flex;gap:6px;margin-top:6px}.addkw input{flex:1;font:inherit;font-size:14px;border:2px solid var(--line);border-radius:10px;padding:4px 8px;min-width:0}
.phone{max-width:380px;margin:0 auto;border:3px solid var(--navy);border-radius:28px;background:#ECE5DD;padding:12px;box-shadow:5px 5px 0 var(--navy)}
.phead{background:var(--teal);color:#fff;border-radius:16px;padding:8px 12px;font-weight:700;display:flex;gap:8px;align-items:center}
.msgs{height:300px;overflow-y:auto;padding:10px 4px;display:flex;flex-direction:column;gap:8px}
.bub{max-width:85%;padding:8px 12px;border-radius:14px;font-size:15px;border:1.5px solid rgba(15,27,61,.15)}.bub.u{align-self:flex-end;background:#DCF8C6}.bub.b{align-self:flex-start;background:#fff}.bub small{display:block;color:var(--mute);font-size:12px;margin-top:2px}
.pform{display:flex;gap:6px}.pform input{flex:1;font:inherit;border:2px solid var(--navy);border-radius:99px;padding:8px 12px;min-width:0}
/* tool: line */
.plot{width:100%;max-width:560px;border:3px solid var(--navy);border-radius:18px;background:#fff;touch-action:none;display:block;margin:0 auto}
.handle{cursor:ns-resize}
/* tool: guard */
.msgl{display:grid;gap:8px}.mrow{display:flex;gap:10px;align-items:center;justify-content:space-between;border:2px solid var(--navy);border-radius:14px;padding:8px 10px;background:#fff;flex-wrap:wrap}.mrow p{margin:0;flex:1;min-width:180px;font-size:15px}
.score{width:120px;height:14px;border:2px solid var(--navy);border-radius:99px;overflow:hidden;background:#fff;flex:none}.score i{display:block;height:100%}
input[type=range]{width:100%;accent-color:var(--magenta)}
/* council */
.opts{display:grid;gap:10px;margin:12px 0}.opt{text-align:left;border:3px solid var(--navy);border-radius:14px;background:#fff;padding:12px 14px;font-weight:500;box-shadow:3px 3px 0 var(--navy)}.opt:hover{background:#FFF3D1}.opt.on{background:var(--saffron)}.opt.good{background:#DDF5EF}.opt.bad{background:#FBE0E8}
.persp{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;margin-top:10px}.persp div{border:2px solid var(--navy);border-radius:14px;padding:10px 12px;background:#F6F8FF;font-size:15px}.persp b{display:block}
/* lab */
.lab{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:18px}
.tool{background:#fff;border:3px solid var(--navy);border-radius:20px;box-shadow:5px 5px 0 var(--navy);overflow:hidden}.tool .top{padding:14px 16px;color:#fff;display:flex;gap:10px;align-items:center}.tool .top span{font-size:34px}.tool .top b{font-family:var(--disp);font-size:20px;line-height:1.1}
.tool .bd{padding:14px 16px}.tool.locked{opacity:.55}
.stars{font-size:22px;letter-spacing:2px}
.cert{border:6px double var(--saffron);border-radius:22px;padding:26px;text-align:center;background:#fff}
dialog{border:3px solid var(--navy);border-radius:22px;box-shadow:8px 8px 0 var(--navy);padding:22px;max-width:min(520px,92vw)}dialog::backdrop{background:rgba(15,27,61,.6)}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--navy);color:#fff;border:3px solid var(--saffron);border-radius:16px;padding:10px 18px;font-weight:700;z-index:50;max-width:92vw;text-align:center}
.cf{position:fixed;top:-30px;font-style:normal;font-size:26px;z-index:40;pointer-events:none;animation:fall 2s ease-in forwards}@keyframes fall{to{transform:translate(var(--dx),105vh) rotate(360deg)}}
footer{max-width:1120px;margin:0 auto;padding:0 18px 40px;color:var(--mute);font-size:14px}
@media(max-width:820px){
  .hero,.grid2,.draw{grid-template-columns:1fr}.hero{padding:24px}.hero .akw{display:none}
  .steps5{grid-template-columns:1fr 1fr}.br{grid-template-columns:1fr}
  nav.tabs{position:fixed;left:0;right:0;bottom:0;margin:0;background:var(--navy);justify-content:space-around;padding:8px 6px calc(8px + env(safe-area-inset-bottom));z-index:30;border-top:3px solid var(--saffron)}
  nav.tabs a{font-size:14px}.eng span i{display:none}.bar{padding:8px 14px}
  canvas.pad{width:100%;max-width:300px;height:auto;aspect-ratio:1;margin:0 auto;display:block}
}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<svg style="display:none"><symbol id="ak" viewBox="0 0 200 200"><line x1="100" y1="22" x2="100" y2="48" stroke="#0F1B3D" stroke-width="7" stroke-linecap="round"/><circle cx="100" cy="18" r="12" fill="#D63A6E" stroke="#0F1B3D" stroke-width="4"/><rect x="35" y="45" width="130" height="115" rx="44" fill="#FFB703" stroke="#0F1B3D" stroke-width="6"/><rect x="52" y="68" width="96" height="58" rx="26" fill="#0F1B3D"/><ellipse class="eye" cx="80" cy="96" rx="10" ry="13" fill="#5FF0D5"/><ellipse class="eye" cx="120" cy="96" rx="10" ry="13" fill="#5FF0D5"/><path d="M84 113q16 12 32 0" stroke="#5FF0D5" stroke-width="5" fill="none" stroke-linecap="round"/><rect x="62" y="160" width="76" height="24" rx="10" fill="#0FA88F" stroke="#0F1B3D" stroke-width="5"/><path d="M35 92h-12M165 92h12" stroke="#0F1B3D" stroke-width="8" stroke-linecap="round"/></symbol></svg>
<header><div class="bar"><a class="logo" href="#about" aria-label="DigiSoma Lab, about"><svg aria-hidden="true"><use href="#ak"/></svg>Digi<i>Soma</i> <small>LAB</small></a>
<nav class="tabs" aria-label="Main"><a href="#missions" data-t="missions">🗺️ Missions</a><a href="#lab" data-t="lab">🧪 My Lab</a><a href="#about" data-t="about">ℹ️ About</a></nav>
<button class="eng" id="eng" aria-pressed="false" title="Engineer mode shows the real technical words"><span>🔬<i style="font-style:normal"> Engineer mode</i></span><b aria-hidden="true"></b></button></div><div class="zig"></div></header>
<main id="app"></main>
<footer><div class="zig t" style="margin-bottom:14px;border-radius:4px"></div>DigiSoma Lab preview · Every AI tool here runs inside your browser. Nothing you draw or type leaves this device. · Built in Nairobi.</footer>
<dialog id="dlg"></dialog>
<script>
const $=s=>document.querySelector(s),app=$("#app"),dlg=$("#dlg");
const esc=s=>String(s).replace(/[&<>"']/g,c=>"&#"+c.charCodeAt(0)+";");
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const calm=matchMedia("(prefers-reduced-motion: reduce)").matches;
let DB={name:"",m:{},eng:0};try{Object.assign(DB,JSON.parse(localStorage.getItem("digisoma.lab")||"{}"))}catch(e){}
const save=()=>{try{localStorage.setItem("digisoma.lab",JSON.stringify(DB))}catch(e){}};
const setEng=v=>{DB.eng=v;document.body.classList.toggle("engineer",!!v);$("#eng").setAttribute("aria-pressed",!!v);save()};setEng(DB.eng);
$("#eng").onclick=()=>{setEng(DB.eng?0:1);toast(DB.eng?"🔬 Engineer mode on: you’ll see the real AI words.":"Engineer mode off.")}
let tt;const toast=t=>{let e=$(".toast");if(!e){e=document.createElement("div");e.className="toast";e.setAttribute("role","status");document.body.append(e)}e.textContent=t;clearTimeout(tt);tt=setTimeout(()=>e.remove(),3200)};
function boom(){if(calm)return;for(let i=0;i<26;i++){const s=document.createElement("i");s.className="cf";s.textContent=["⭐","✨","🧪","💡"][i%4];s.style.cssText=`left:${Math.random()*100}vw;--dx:${Math.random()*200-100}px;animation-delay:${Math.random()*.4}s`;document.body.append(s);setTimeout(()=>s.remove(),2600)}}
const ak=(t,sz=64)=>`<div class="say"><svg viewBox="0 0 200 200" style="width:${sz}px;height:${sz}px" aria-hidden="true"><use href="#ak"/></svg><div>${t}</div></div>`;
const eng=t=>`<div class="engnote">🔬 <b>Engineer note:</b> ${t}</div>`;

/* ---------------- MISSIONS ---------------- */
const M=[
{id:"see",town:"Nairobi",x:505,y:392,c:"#3BB7E0",e:"✏️",t:"Teach Akili to see",tool:"Drawing recogniser",idea:"Learning from data",
 who:["👩🏾‍🎨","Wanjiru, art club captain","Our school art club has hundreds of drawings to sort for the exhibition. Can you build an AI that sorts them by itself?"],
 learn:[["👀","Computers see numbers","A drawing is a grid of tiny squares called pixels. To a computer, each pixel is just a number: dark or light."],["📚","Examples, not rules","We won’t tell Akili the rules for a mango. We’ll show examples, and it will find the patterns itself."],["🔍","Closest match wins","For a new drawing, Akili finds the examples it looks most like, and picks the label they share."]],
 eng:"This tool is a <b>k-nearest-neighbours classifier</b>. Each drawing is shrunk to 20 × 20 pixels, turned into a list of 400 numbers, and compared with every example using distance. The 3 closest examples vote (k = 3).",
 reflect:["Akili was trained only on two kinds of drawing. You draw a cat. What will happen?",["It will still pick one of the two labels","It will say “cat”"],0,"An AI only knows the labels it was taught. It can’t say “I don’t know” unless we design it to."]},
{id:"tree",town:"Eldoret",x:300,y:205,c:"#0FA88F",e:"🌽",t:"Save the maize harvest",tool:"Leaf doctor",idea:"Thinking with rules",
 who:["👨🏾‍🌾","Kiprop, maize farmer","Some of my maize leaves are sick. I need a quick way to check them before the disease spreads."],

/* ---------------- TOOL 1: drawing recogniser (k-nearest neighbours) ---------------- */
function pad(c){const x=c.getContext("2d");let d=0,last,ink=0;const W=c.width;
  const clear=()=>{x.fillStyle="#fff";x.fillRect(0,0,W,W);ink=0};clear();x.lineCap="round";x.lineJoin="round";x.lineWidth=W/16;x.strokeStyle="#0F1B3D";
  const pt=e=>{const r=c.getBoundingClientRect();return[(e.clientX-r.left)*W/r.width,(e.clientY-r.top)*W/r.height]};
  c.onpointerdown=e=>{d=1;ink=1;last=pt(e);try{c.setPointerCapture(e.pointerId)}catch(_){}x.beginPath();x.arc(last[0],last[1],W/32,0,7);x.fillStyle="#0F1B3D";x.fill()};
  c.onpointermove=e=>{if(!d)return;const p=pt(e);x.beginPath();x.moveTo(last[0],last[1]);x.lineTo(p[0],p[1]);x.stroke();last=p};
  c.onpointerup=c.onpointercancel=c.onpointerleave=()=>d=0;
  return{clear,has:()=>ink,vec:()=>feat(c),thumb:()=>{const t=document.createElement("canvas");t.width=t.height=64;t.getContext("2d").drawImage(c,0,0,64,64);return t.toDataURL()}}}
function feat(c){const W=c.width,data=c.getContext("2d").getImageData(0,0,W,W).data;let x0=W,y0=W,x1=-1,y1=-1;
  for(let y=0;y<W;y++)for(let x=0;x<W;x++){if(data[(y*W+x)*4]<128){if(x<x0)x0=x;if(x>x1)x1=x;if(y<y0)y0=y;if(y>y1)y1=y}}
  if(x1<0)return null;const s=Math.max(x1-x0,y1-y0)+W/10,cx=(x0+x1)/2,cy=(y0+y1)/2,t=document.createElement("canvas");t.width=t.height=20;const g=t.getContext("2d");g.fillStyle="#fff";g.fillRect(0,0,20,20);g.drawImage(c,cx-s/2,cy-s/2,s,s,0,0,20,20);
  const d=g.getImageData(0,0,20,20).data,v=[];for(let i=0;i<400;i++)v.push(+(1-d[i*4]/255).toFixed(3));return v}
function knn(S,v,k=3){const ds=S.map((s,i)=>({i,l:s.l,d:s.v.reduce((a,x,j)=>a+(x-v[j])**2,0)})).sort((a,b)=>a.d-b.d).slice(0,k);const votes={};ds.forEach(o=>votes[o.l]=(votes[o.l]||0)+1);const best=Object.entries(votes).sort((a,b)=>b[1]-a[1])[0];return{l:+best[0],conf:best[1]/ds.length,near:ds}}

TOOLS.guard=(pn,done)=>{const st=ms("guard");let lab=st.lab||{},th=st.th??50,model=null;const tok=t=>t.toLowerCase().match(/[a-z]+/g)||[];

    model=t=>{const lp=[0,1].map(y=>Math.log((docs[y]+1)/(GTR.length+2))+tok(t).reduce((a,w)=>a+Math.log(((c[y][w]||0)+1)/(tot[y]+V)),0));return 1/(1+Math.exp(-(lp[1]-lp[0])/3))}};

    if(!model){pn.innerHTML=ak("Label Bibi Zawadi’s old messages: <b>scam</b> or <b>safe</b>? Your labels are the guard’s training data.")+`<div class="msgl">${GTR.map(([m],i)=>`<div class="mrow"><p>“${m}”</p><span class="row" style="gap:4px"><button class="chip ${lab[i]===1?"on":""}" data-i="${i}" data-v="1">🚩 Scam</button><button class="chip ${lab[i]===0?"t":""}" data-i="${i}" data-v="0">✅ Safe</button></span></div>`).join("")}</div><p class="row c"><button class="btn n" id="tr" ${n<GTR.length?"disabled":""}>🧠 Train the guard (${n}/${GTR.length})</button></p>`;
      pn.querySelectorAll("[data-i]").forEach(b=>b.onclick=()=>{lab[b.dataset.i]=+b.dataset.v;st.lab=lab;save();draw()});$("#tr").onclick=()=>{train();draw()};return}
    const sc=GTE.map(([m,y])=>({m,y,p:model(m)})),blocked=sc.filter(r=>r.p*100>=th),caught=blocked.filter(r=>r.y).length,fa=blocked.filter(r=>!r.y).length;

     `<label for="th"><b>Block messages with a scam score above ${th}%</b></label><input type="range" id="th" min="5" max="95" step="5" value="${th}"><div class="row mute" style="justify-content:space-between;font-size:13px"><span>◀ Strict: blocks more</span><span>Relaxed: blocks less ▶</span></div>

  draw()};

/* ---------------- TOOL 6: AI council (ethics, no single right answer) ---------------- */
const DIL=[{e:"📷",q:"A school wants cameras with face recognition to take attendance automatically.",o:["Yes, it saves teachers time","No, it’s too risky for children’s privacy","Only if parents agree, the data is deleted quickly and it works fairly for every child"],p:[["🧒🏾 Student","“I don’t like being watched all day. Where do the pictures go?”"],["👩🏾 Parent","“I want to know who can see my child’s face data.”"],["👨🏾‍🏫 Teacher","“It would save time, but only if it’s fair and safe.”"]]},
{e:"📝",q:"An AI tool can write a whole essay in seconds. Should students be allowed to use it for homework?",o:["Yes, for anything","No, never","Yes for ideas and checking, but students must do their own thinking and say how they used it"],p:[["🧒🏾 Student","“It helps me when I’m stuck, but then I don’t really learn.”"],["👨🏾‍🏫 Teacher","“I need to know what the student can actually do.”"],["👩🏾 Parent","“Honesty matters most to me.”"]]},
{e:"💳",q:"A loan app uses AI to decide who can borrow money. It learned from old data where fewer women got loans.",o:["Use it, AI is neutral","Stop using it until it’s checked and fixed for bias","Let the AI decide alone, it’s faster"],p:[["👩🏾‍💼 Business owner","“I was refused, and nobody can explain why.”"],["🧑🏾‍💻 Engineer","“The AI copied unfairness from old data. We must test it.”"],["🏦 Bank","“We want speed, but not unfair decisions.”"]]},
{e:"🎭",q:"An app can make very realistic fake videos of real people. What rule should it have?",o:["No rules needed","Fake videos must be clearly labelled, and using someone’s face needs their permission","Ban all video apps"],p:[["🧑🏾 Young person","“Someone could make a fake video of me!”"],["🎬 Film maker","“It’s a great tool for creative stories.”"],["📰 Journalist","“Fake videos can spread lies very fast.”"]]}];
TOOLS.council=(pn,done)=>{const st=ms("council");st.ch=st.ch||{};let i=0;
  const go=()=>{if(i>=DIL.length){pn.innerHTML=ak(`Thank you, Councillor ${esc(DB.name)}! You thought about <b>privacy</b>, <b>honesty</b>, <b>fairness</b> and <b>truth</b>. Real AI experts argue about these same questions every day.`)+`<p class="c"><button class="btn" id="fin">Submit my advice ▶</button></p>`;$("#fin").onclick=()=>done(3,"4 decisions");return}
    const d=DIL[i];pn.innerHTML=`<p class="kick">Council question ${i+1} of ${DIL.length}</p><h2 style="font-size:26px">${d.e} ${d.q}</h2><p class="mute">There’s no single right answer. Choose what you think is best.</p><div class="opts">${d.o.map((x,j)=>`<button class="opt ${st.ch[i]===j?"on":""}" data-j="${j}">${x}</button>`).join("")}</div><div id="pv" aria-live="polite"></div>`;
    pn.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{st.ch[i]=+b.dataset.j;save();pn.querySelectorAll(".opt").forEach(x=>x.classList.toggle("on",x==b));
      $("#pv").innerHTML=`<p><b>Here’s how different people might see it:</b></p><div class="persp">${d.p.map(x=>`<div><b>${x[0]}</b>${x[1]}</div>`).join("")}</div>${eng("Ask four questions about any AI: Is it <b>private</b>? Is it <b>fair</b> to everyone? Is it <b>transparent</b> (can it explain itself)? Who is <b>accountable</b> when it goes wrong?")}<p class="c"><button class="btn" id="nx">${i+1<DIL.length?"Next question ▶":"Finish ▶"}</button></p>`;$("#nx").onclick=()=>{i++;go()}})};
  go()};

/* ---------------- MY LAB (portfolio) ---------------- */
function lab(){const n=M.filter(m=>ms(m.id).done).length;
  app.innerHTML=`<p class="kick">${DB.name?esc(DB.name)+"’s":"My"} portfolio</p><div class="row" style="justify-content:space-between;align-items:flex-end"><h1>My Lab</h1><span class="pill">${n} of 6 tools built</span></div><p class="mute">Everything you build lives here. Reopen a tool to improve it or show it to your family.</p>
  <div class="lab" style="margin-top:16px">${M.map(m=>{const s=ms(m.id);return `<div class="tool ${s.done?"":"locked"}"><div class="top" style="background:${m.c}"><span aria-hidden="true">${s.done?m.e:"🔒"}</span><b>${m.tool}</b></div><div class="bd"><small class="mute">For ${m.who[1].split(",")[0]} in ${m.town}</small><p style="margin:6px 0">${s.done?`<span class="stars" aria-label="${s.stars} of 3 stars">${"⭐".repeat(s.stars||1)}</span><br><b>${esc(s.sum||"")}</b>`:"Not built yet"}</p>${m.id=="see"&&s.S&&s.S.length?`<div class="thumbs">${s.S.slice(0,8).map(x=>`<img src="${x.t}" alt="">`).join("")}</div>`:""}<a class="btn ${s.done?"w":""} sm" href="#m/${m.id}${s.done?"/2":""}">${s.done?"🛠️ Open tool":"Start mission"}</a></div></div>`}).join("")}</div>
  <div class="card" style="margin-top:24px;display:flex;gap:16px;align-items:center;flex-wrap:wrap"><span style="font-size:48px">🎓</span><div style="flex:1;min-width:220px"><h2 style="font-size:26px">Junior AI Engineer certificate</h2><p class="mute" style="margin:4px 0 0">${n==6?"You built all six tools. You earned it!":`Build all six tools to earn it. ${6-n} to go!`}</p></div><button class="btn ${n==6?"":"w"}" id="ct" ${n==6?"":"disabled"}>View certificate</button></div>
  ${DB.name?`<p class="c" style="margin-top:20px"><button class="btn w sm" id="rst">Start fresh (erase my lab)</button></p>`:""}`;
  if(n==6)$("#ct").onclick=cert;
  if($("#rst")){let sure=0;$("#rst").onclick=()=>{if(!sure){sure=1;$("#rst").textContent="Tap again to erase everything";return}DB={name:"",m:{},eng:DB.eng};save();lab()}}}
function cert(){dlg.innerHTML=`<div class="cert"><svg viewBox="0 0 200 200" width="90" height="90" aria-hidden="true"><use href="#ak"/></svg><p class="kick" style="margin-top:8px">DigiSoma Lab · Certificate</p><p style="margin:4px 0">This certifies that</p><h2>${esc(DB.name)}</h2><p style="margin:6px 0">is a</p><h2 style="color:var(--teal)">Junior AI Engineer</h2><p class="mute" style="margin:10px 0 0">Built 6 AI tools for communities in Nairobi, Eldoret, Mombasa, Kisumu, Malindi and Nakuru.<br>${new Date().toLocaleDateString("en-GB",{day:"numeric",month:"long",year:"numeric"})}</p></div><p class="c"><button class="btn" id="pr">🖨️ Print</button><button class="btn w" id="cx">Close</button></p><p class="c mute" id="pm" aria-live="polite"></p>`;
  dlg.showModal();boom();$("#cx").onclick=()=>dlg.close();$("#pr").onclick=()=>{try{window.print()}catch(e){$("#pm").textContent="Printing isn’t available here. Try it on the live website."}}}

/* ---------------- router ---------------- */
function route(){const h=location.hash.slice(1)||"about",[a,b,c]=h.split("/");
  document.querySelectorAll("nav.tabs a").forEach(x=>{const on=x.dataset.t==(a=="m"?"missions":a);x.classList.toggle("on",on);on?x.setAttribute("aria-current","page"):x.removeAttribute("aria-current")});
  window.scrollTo(0,0);if(a=="m")return mission(b,+c||0);if(a=="missions")return missions();if(a=="lab")return lab();about()}
window.onhashchange=route;route();
</script>
