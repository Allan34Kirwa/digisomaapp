<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DigiSoma Prototype</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Plan: violet + sunshine world, one colour per world, chunky 3D buttons, Zuri the robot as guide. Four levels: Home > World > Topic > Lesson. */
:root{--ink:#1E1147;--bg:#F4F0FF;--sun:#FFC93C;--vio:#3B1F8F;--good:#0B7A5C;--soft:#E5E0F7;color-scheme:light}
*{box-sizing:border-box}
body{margin:0;font-family:Fredoka,"Trebuchet MS",system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:18px;line-height:1.5}
a{color:inherit;text-decoration:none}button{font:inherit;cursor:pointer;color:inherit}:focus-visible{outline:4px solid var(--sun);outline-offset:3px}
header{position:sticky;top:0;z-index:5;background:var(--vio);color:#fff;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 20px;flex-wrap:wrap}
.logo{font-weight:700;font-size:28px}.logo b{color:var(--sun)}
.stats{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.chip{background:rgba(255,255,255,.15);border-radius:99px;padding:3px 13px;font-weight:600;font-size:16px;border:0;color:#fff}
.bar{width:90px;height:14px;border-radius:99px;background:rgba(255,255,255,.2);overflow:hidden}.bar i{display:block;height:100%;width:0;background:var(--sun);transition:width .5s}
.wrap{max-width:1050px;margin:0 auto}
.hero{background:linear-gradient(120deg,#3B1F8F,#6A3CE0);color:#fff;padding:28px 20px 60px;border-radius:0 0 40px 40px}
.hero .wrap{display:grid;grid-template-columns:1.2fr 1fr;gap:20px;align-items:center}
h1{font-size:clamp(34px,6vw,54px);line-height:1.05;margin:0 0 12px}.hero p{font-size:20px;margin:0 0 14px}
.ages{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:6px}.ages button{border:0;border-radius:99px;padding:6px 14px;background:rgba(255,255,255,.18);color:#fff;font-weight:600;font-size:15px}.ages .on{background:var(--sun);color:var(--ink)}
.tk{font-size:15px;opacity:.85;margin:0 0 12px!important}
input{font:inherit;border:0;border-radius:99px;padding:10px 18px;width:190px;margin:0 6px 8px 0}
.cta,.go{background:var(--sun);color:var(--ink);border:0;border-radius:99px;padding:12px 24px;font-weight:700;box-shadow:0 5px 0 #C79A00;display:inline-block}
.go{background:var(--vio);color:#fff;box-shadow:0 5px 0 #1E1147;margin:6px 4px;font-size:17px}.go.alt{background:#6F6596;box-shadow:0 5px 0 #4A4270}
.cta:active,.go:active{transform:translateY(3px);box-shadow:none}
.mascot{text-align:center}.bz{width:min(250px,70%);cursor:pointer;animation:bob 3s ease-in-out infinite}
.sw button{width:28px;height:28px;border-radius:50%;border:3px solid #fff;margin:4px 3px}
.say{background:#fff;color:var(--ink);border-radius:22px;padding:10px 18px;display:inline-block;max-width:360px;font-weight:500;font-size:17px;position:relative;margin-bottom:14px}
.say:after{content:"";position:absolute;bottom:-11px;left:50%;margin-left:-11px;border:11px solid transparent;border-top-color:#fff;border-bottom:0}
.tts{border:0;background:var(--soft);border-radius:99px;padding:0 8px;font-size:16px;margin-left:4px;vertical-align:middle}
.eye{transform-origin:center;transform-box:fill-box;animation:blink 4s infinite}
@keyframes bob{50%{transform:translateY(-10px)}}@keyframes blink{0%,94%,100%{transform:scaleY(1)}97%{transform:scaleY(.1)}}
section{padding:36px 20px}h2{font-size:clamp(26px,4vw,34px);margin:0 0 6px}.sub{margin:0 0 20px;opacity:.8}
.worlds{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:18px}
.w{display:block;border-radius:28px;color:#fff;padding:20px;min-height:190px;box-shadow:0 8px 0 rgba(0,0,0,.22);transition:transform .15s}
.w:hover{transform:translateY(-6px) rotate(-1deg)}.w .em{font-size:50px;line-height:1.1;display:block}.w h3{margin:6px 0 2px;font-size:24px}.w .d{font-size:16px}
.pb{height:10px;background:rgba(255,255,255,.3);border-radius:9px;margin-top:10px;overflow:hidden}.pb i{display:block;height:100%;background:#fff}.pb.dk{background:var(--soft)}
.prog{display:block;font-size:15px;font-weight:600;margin-top:6px}
.row{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:16px}
.card{background:#fff;border-radius:24px;padding:16px 20px;border:4px solid transparent}.card.now{border-color:var(--sun)}.card small{opacity:.8}
.b{background:#fff;border-radius:22px;padding:10px 16px;text-align:center}.b span{font-size:36px;display:block}.b.off{filter:grayscale(1);opacity:.4}.badges{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:24px}
.price{max-width:420px;margin:0 auto;background:var(--sun);border-radius:36px;padding:26px;text-align:center;box-shadow:0 10px 0 #C79A00}
.price .n{font-size:60px;font-weight:700;line-height:1}.price .n small{font-size:22px;font-weight:500}.price ul{list-style:none;padding:0;text-align:left;font-weight:500;margin:12px 0}.price li:before{content:"✔ ";color:var(--vio)}
.cr{max-width:1050px;margin:0 auto;padding:16px 20px 0;font-weight:500}.cr a{color:var(--vio);text-decoration:underline}.page{padding:14px 20px 50px}
.path{display:grid;gap:18px;max-width:560px;margin:10px auto}
.node{display:flex;align-items:center;gap:14px;background:#fff;border-radius:99px;padding:12px 24px;width:84%;box-shadow:0 6px 0 rgba(30,17,71,.15);border:4px solid var(--c);transition:transform .15s}
.node:nth-child(even){margin-left:auto}a.node:hover{transform:scale(1.03)}.node.lock{opacity:.45;border-color:#999}.node .em{font-size:32px}.node b{display:block;font-size:20px;line-height:1.2}.node small{font-size:15px}
.lc,dialog{background:#fff;border-radius:32px;overflow:hidden;box-shadow:0 10px 0 rgba(30,17,71,.15);color:var(--ink)}.lc{max-width:640px;margin:10px auto}
dialog{border:0;padding:0;width:min(560px,94vw);max-height:92vh;overflow:auto}dialog::backdrop{background:rgba(30,17,71,.7)}
.dh{color:#fff;padding:14px 24px}.dh h3{margin:0;font-size:25px}#st,.pbody{padding:20px 24px 24px}
.zrow{display:flex;gap:12px;align-items:center;margin-bottom:12px}.zrow svg{flex:none}.zrow .say{margin:0;background:var(--bg)}.zrow .say:after{display:none}
.step{margin:0;font-size:15px;opacity:.7}.c{text-align:center}
.opts{display:grid;gap:10px;margin:12px 0}.opt{background:var(--bg);border:3px solid transparent;border-radius:18px;padding:12px 16px;text-align:left;font-weight:500}
.opt:hover{border-color:var(--vio)}.opt.good{background:#C9F5E4;border-color:#12A87F}.opt.bad{background:#FFD6E1;border-color:#FF5D8F}
.grid{display:grid;gap:6px;margin:10px auto}.cell{aspect-ratio:1;background:var(--bg);border-radius:14px;display:grid;place-items:center;font-size:clamp(22px,6vw,32px)}.cell.st{background:#FFF1C4}
.pad{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:6px 0}.ar{background:#E1E7FF;border:0;border-radius:14px;padding:8px 16px;font-size:24px;box-shadow:0 4px 0 #B9C2EE}.ar:active{transform:translateY(3px);box-shadow:none}
.q{min-height:48px;background:var(--bg);border-radius:14px;padding:8px;text-align:center;font-size:26px;display:flex;flex-wrap:wrap;gap:4px;justify-content:center;align-items:center}
.q span{border-radius:10px;padding:0 4px}.q .hl{background:var(--sun)}.q small{font-size:16px}
pre{background:#1E293B;color:#7CF5D0;border-radius:14px;padding:12px;text-align:left;font-size:14px;overflow:auto;margin:10px 0}
.moods{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}.moods button{background:var(--bg);border:3px solid transparent;border-radius:20px;padding:6px 12px;font-size:34px;line-height:1.2}.moods button:hover{border-color:var(--vio)}.moods small{display:block;font-size:14px;font-family:inherit}
.breath{width:90px;height:90px;border-radius:50%;background:#B9A6FF;margin:16px auto;animation:br 8s ease-in-out infinite;display:grid;place-items:center;font-weight:600}@keyframes br{0%,100%{transform:scale(.6)}50%{transform:scale(1.15)}}
.big{font-size:54px;text-align:center}
.help{background:#FFF1C4;border-radius:16px;padding:10px 14px;font-size:16px}
.wk{display:flex;gap:6px;align-items:flex-end;height:90px;margin:8px 0 2px}.wk div{flex:1;text-align:center;font-size:13px}.wk i{display:block;background:var(--vio);border-radius:6px 6px 0 0;margin:0 auto 2px;width:70%;min-height:3px}
.note{font-size:14px;opacity:.85;border-top:2px dashed var(--soft);margin-top:14px;padding-top:10px}
.cf{position:fixed;top:-30px;font-style:normal;font-size:28px;z-index:30;pointer-events:none;animation:fall 2s ease-in forwards}@keyframes fall{to{transform:translate(var(--dx),105vh) rotate(360deg)}}
footer{text-align:center;padding:24px;opacity:.75;font-size:15px}
@media(max-width:760px){.hero .wrap{grid-template-columns:1fr}.node{width:100%}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<svg style="display:none"><symbol id="z" viewBox="0 0 200 200">
<line x1="100" y1="22" x2="100" y2="48" stroke="#FFC93C" stroke-width="6" stroke-linecap="round"/><circle cx="100" cy="18" r="11" fill="#FF5D8F"/>
<rect x="35" y="45" width="130" height="115" rx="48" fill="var(--z,#FFC93C)"/><rect x="50" y="66" width="100" height="62" rx="30" fill="#1E1147"/>
<ellipse class="eye" cx="78" cy="94" rx="10" ry="13" fill="#7CF5D0"/><ellipse class="eye" cx="122" cy="94" rx="10" ry="13" fill="#7CF5D0"/>
<path d="M82 114q18 14 36 0" stroke="#7CF5D0" stroke-width="5" fill="none" stroke-linecap="round"/>
<circle cx="48" cy="118" r="8" fill="#FF8A3D" opacity=".8"/><circle cx="152" cy="118" r="8" fill="#FF8A3D" opacity=".8"/><rect x="60" y="158" width="80" height="26" rx="13" fill="#4361EE"/></symbol></svg>
<header>
  <a href="#" class="logo" aria-label="DigiSoma home">Digi<b>Soma</b></a>
  <div class="stats"><span class="chip">🔥 <span id="streak">0</span>-day streak</span><span class="chip">⭐ <span id="xp">0</span> XP</span><span class="chip" id="lvl"></span><div class="bar" title="Progress to next level"><i id="fill"></i></div><button class="chip" id="pzb" aria-label="Open Parent Zone">👨‍👩‍👧 Parent Zone</button></div>
</header>
<main id="app"></main>
<footer>DigiSoma preview prototype · “Soma” means “learn” in Swahili · Built in Nairobi</footer>
<dialog id="pz" aria-label="Parent Zone"></dialog>

<script>
const $=s=>document.querySelector(s),app=$("#app"),pz=$("#pz");
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const esc=s=>String(s).replace(/[&<>"']/g,c=>"&#"+c.charCodeAt(0)+";"),strip=s=>s.replace(/<[^>]+>/g,"");
const calm=matchMedia("(prefers-reduced-motion: reduce)").matches,canTalk="speechSynthesis" in window;
const TT=["Explorer","Maker","Inventor","Wizard","Legend"];
const AG=["Sprouts · 6–8","Builders · 9–12","Pioneers · 13–16"],HL=["Ready to train your first AI robot?","Build smart AI logic and beat online tricks!","Go from block code to real AI and Python!"];
const TK=["Sprouts get easier maths, bigger buttons and a 🔊 read-aloud helper.","Builders see the Python version of their robot code.","Pioneers get Python code, harder maths and bonus challenge questions."];
const D={
code:{t:"Code & AI Lab",e:"🤖",c:"#4361EE",d:"Teach robots, understand AI",topics:[
{t:"Robot Basics",e:"🕹️",d:"Tell a robot what to do",L:[{t:"Guide Zuri",k:"robot",lv:0},{t:"Dodge the rocks",k:"robot",lv:1},{t:"Mango delivery",k:"robot",lv:2}]},
{t:"How AI Works",e:"🧠",d:"See, think, act",L:[
{t:"See, Think, Act",k:"order",learn:"Every AI robot works in 3 steps. It sees the world, thinks about what it saw, then acts."},
{t:"Learning from examples",k:"q",learn:"AI isn’t told every rule. It studies lots of examples, like cat photos, and finds patterns.",Q:[["How does AI learn to spot a cat?",["It’s born knowing","It studies lots of cat photos"],1,"Examples are what AI learns from."],["Next in the pattern: 🔴🔵🔴🔵 ?",["🔴","🔵","🟢"],0,"Spotting patterns is what AI does best."]],X:["The examples an AI learns from are called…",["Training data","Wi-Fi","A charger"],0,"Training data shapes everything the AI learns."]},
{t:"Using AI wisely",k:"q",learn:"AI can be wrong. Check facts with a book or a grown-up, and keep private things private.",Q:[["An AI says something odd. You…",["Believe it","Check another source"],1,"AI makes mistakes, so double-check."],["Tell an AI your home address?",["Sure","No, keep it private"],1,"Private stays private, even with robots."]],X:["An AI learned only from photos of one country. It may…",["Work the same everywhere","Make more mistakes with other places and faces"],1,"That is called bias. Varied data makes fairer AI."]}]}]},
math:{t:"Math Arena",e:"🧮",c:"#C2570C",d:"Numbers, puzzles, real life",topics:[
{t:"Number Power",e:"🔢",d:"New puzzles every time, set to your age",L:[{t:"Add and subtract",k:"math",m:0},{t:"Times tables",k:"math",m:1}]},
{t:"Math in Real Life",e:"🛒",d:"Money sense",L:[{t:"Shopping with shillings",k:"q",learn:"To find your change, subtract. Pay KSh 100 for something that costs KSh 60 and you get 100 − 60 = 40 back.",Q:[["3 mandazi at KSh 20 each. Total?",["KSh 40","KSh 60","KSh 80"],1,"3 × 20 = 60."],["Pay KSh 100 for KSh 65. Change?",["KSh 25","KSh 35","KSh 45"],1,"100 − 65 = 35."]],X:["You save KSh 50 a week. How long to reach KSh 400?",["6 weeks","8 weeks","10 weeks"],1,"400 ÷ 50 = 8."]}]}]},
safe:{t:"Cyber Shield",e:"🛡️",c:"#0B7A5C",d:"Smart, kind and balanced online",topics:[
{t:"Protect Yourself",e:"🔒",d:"Secrets, scams, passwords",L:[
{t:"Strangers and secrets",k:"q",learn:"Online, anyone can pretend to be anyone. Keep your school, address and photos private.",Q:[["A gamer says, “Free gems! Send your address and password.”",["Send them","Block, and tell a grown-up"],1,"Real prizes never ask for passwords or addresses."],["Someone says, “Keep this secret from your parents.”",["OK","Tell a trusted grown-up now"],1,"Safe people never ask for secrets like that."]]},
{t:"Passwords and scams",k:"q",learn:"Strong passwords are long and mixed. Free-prize messages are usually tricks.",Q:[["Strongest password?",["baraka123","Zebra!Moon7Tea"],1,"Long and mixed beats names and numbers."],["“YOU WON A PHONE! Tap here!”",["Tap it","Ignore it, show a parent"],1,"Surprise prizes are usually scams."]],X:["Best extra lock for an account?",["Two-step verification","Writing the password on your desk"],0,"A code sent to a phone stops people who guess your password."]}]},
{t:"Be Kind Online",e:"💬",d:"Bullying and balance",L:[
{t:"If someone is mean",k:"q",learn:"If someone is unkind online: don’t reply, save proof, block them, tell a grown-up. It’s never your fault.",Q:[["First step if someone bullies you online?",["Be mean back","Don’t reply, tell a grown-up"],1,"Getting help is the brave move."],["Is bullying ever your fault?",["Yes","Never"],1,"Never."]]},
{t:"Screen balance",k:"q",learn:"Try the 20-20-20 rule: every 20 minutes, look at something 20 feet away for 20 seconds. Sleep, play and friends matter too.",Q:[["The 20-20-20 rule helps your…",["Eyes","Shoes"],0,"Looking far away rests tired eyes."],["Screens right before bed…",["Help you sleep","Make sleep harder"],1,"Screen light keeps your brain awake."]]}]}]},
feel:{t:"Mind & Heart",e:"💛",c:"#C22E5F",d:"Understand and calm big feelings",topics:[
{t:"Know Your Feelings",e:"🪞",d:"Name it to tame it",L:[{t:"Mood check-in",k:"feel"},
{t:"Feelings detective",k:"q",learn:"Feelings have names: happy, sad, angry, scared, proud. Naming one makes it easier to handle.",Q:[["Your heart races before a test. You may feel…",["Nervous","Sleepy"],0,"Nerves make the heart beat faster."],["You lose a game and want to cry. That’s…",["Normal","Silly"],0,"All feelings are okay."]]}]},
{t:"Calm Toolbox",e:"🧘",d:"Tools for big feelings",L:[{t:"Belly breathing",k:"breathe"},
{t:"Kind self-talk",k:"q",learn:"The voice in your head can be a friend or a bully. Talk to yourself like you would to a friend.",Q:[["You made a mistake. Kind self-talk is…",["“I’m so dumb”","“I’m still learning”"],1,"Mistakes help you learn."],["Who can you talk to when you feel low?",["Nobody","A trusted grown-up or friend"],1,"Sharing makes it lighter."]]}]}]},
grow:{t:"Growing Up",e:"🌱",c:"#7B4DE0",d:"Changes, friends and your future",topics:[
{t:"Me and My Body",e:"📏",d:"Everyone grows differently",L:[{t:"Growing at your pace",k:"q",learn:"Bodies and voices change at different times for everyone. There is no “right” time. Questions? Ask a parent, carer or school nurse.",Q:[["Your voice and body are changing. That is…",["Wrong","Normal for growing up"],1,"Everyone goes through it."],["A friend grows faster than you. This means…",["Something’s wrong","Everyone has their own pace"],1,"No two bodies grow the same."]]}]},
{t:"Friends and Me",e:"🤝",d:"Respect and choices",L:[
{t:"Being a good friend",k:"q",learn:"Good friends listen, share, include others and say sorry.",Q:[["A classmate sits alone. Kind move?",["Ignore it","Invite them to join"],1,"Small kindness, big difference."],["A friend hurt you. You can…",["Say how you feel, calmly","Never speak again"],0,"Talking helps friendships grow."]]},
{t:"Saying no",k:"q",learn:"You can say no to things that feel wrong, even to friends. Your body and choices belong to you.",Q:[["A friend wants you to do something unsafe. You…",["Say no and walk away","Go along"],0,"Real friends respect your no."],["If you feel unsafe, you should…",["Keep quiet","Tell a trusted adult"],1,"Telling is always right."]]}]},
{t:"Future You",e:"🚀",d:"Tech that helps Africa",L:[{t:"Your big dream",k:"dream"},
{t:"African tech heroes",k:"q",learn:"Africa builds amazing tech! M-Pesa, made in Kenya, lets people send money by phone. Ushahidi, also from Kenya, maps reports during emergencies. Zipline drones carry medicine to clinics in Rwanda.",Q:[["Which Kenyan invention lets people send money with a phone?",["M-Pesa","Bluetooth","Email"],0,"M-Pesa changed how millions of people pay."],["Drones in Rwanda deliver…",["Pizza","Medicine to clinics","Homework"],1,"Fast deliveries help clinics far from cities."]],X:["Ushahidi helps people during emergencies by…",["Mapping reports people send in","Selling phones"],0,"Many small reports on a map show where help is needed."]}]}]}
};

/* saved progress */
const D0=()=>({p:{},n:"",s:0,d:"",z:"",a:1,m:"",dr:"",l:"",h:{}});
let S=D0();try{Object.assign(S,JSON.parse(localStorage.getItem("ds")||"{}"))}catch(e){}
const save=()=>{try{localStorage.setItem("ds",JSON.stringify(S))}catch(e){}};
const dk=d=>d.toISOString().slice(0,10),today=()=>dk(new Date()),yday=()=>dk(new Date(Date.now()-864e5));
if(S.z)document.documentElement.style.setProperty("--z",S.z);
const key=(w,t,l)=>w+"."+t+"."+l,st=(w,t,l)=>S.p[key(w,t,l)]||0,xp=()=>Object.values(S.p).reduce((a,b)=>a+b*10,0);
const lessons=w=>D[w].topics.flatMap((t,i)=>t.L.map((_,l)=>st(w,i,l)));
const streak=()=>S.d==today()||S.d==yday()?S.s:0;
function stats(){const x=xp(),l=Math.floor(x/50);$("#xp").textContent=x;$("#streak").textContent=streak();$("#lvl").textContent="Level "+(l+1)+" · "+TT[Math.min(l,4)];$("#fill").style.width=x%50*2+"%"}
function boom(){if(calm)return;for(let i=0;i<28;i++){const s=document.createElement("i");s.className="cf";s.textContent=["⭐","🎉","✨","💛"][i%4];s.style.cssText=`left:${Math.random()*100}vw;--dx:${Math.random()*200-100}px;animation-delay:${Math.random()*.4}s`;document.body.append(s);setTimeout(()=>s.remove(),2600)}}
const speak=t=>{try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.rate=.9;speechSynthesis.speak(u)}catch(e){}};
document.addEventListener("click",e=>{const b=e.target.closest(".tts");if(b)speak(b.dataset.t)});
const tb=t=>canTalk?`<button class="tts" data-t="${esc(strip(t))}" aria-label="Read aloud">🔊</button>`:"";
const zsay=t=>`<div class="zrow"><svg viewBox="0 0 200 200" width="76" height="76" aria-hidden="true"><use href="#z"/></svg><div class="say">${t} ${tb(t)}</div></div>`;
const crumbs=a=>`<nav class="cr" aria-label="Breadcrumb"><a href="#">🏠 Home</a>${a.map(([t,h])=>" › "+(h?`<a href="#${h}">${t}</a>`:`<b>${t}</b>`)).join("")}</nav>`;

/* LEVEL 1: home */
function home(){
  const total=Object.keys(D).reduce((a,w)=>a+lessons(w).filter(Boolean).length,0),all=Object.keys(D).reduce((a,w)=>a+lessons(w).length,0);
  const B=[[1,"🌟","First step"],[5,"🚀","Rocket"],[10,"🏅","Champion"],[all,"👑","Legend"]];
  const RM=[["🐣","Sprouts 6–8","Arrow coding, number sense, feelings, basic online safety"],["🛠️","Builders 9–12","How AI learns, spotting scams, bullying defence, growth mindset"],["🧠","Pioneers 13–16","From blocks to Python, AI bias and ethics, real projects for Africa"]];
  const lines=["Fun fact: AI learns from examples, just like you!","Never share your password, not even with a best friend.","Big feelings are okay. Breathe with me.","Code is just instructions. You tell the computer what to do!","If something online feels weird, tell a grown-up you trust.","M-Pesa was invented right here in Kenya!"];let li=0;
  app.innerHTML=`<div class="hero"><div class="wrap"><div><h1>Learn the future. Grow up strong.</h1><div class="ages" role="group" aria-label="Age track">${AG.map((x,i)=>`<button data-a="${i}" class="${S.a==i?"on":""}" aria-pressed="${S.a==i}">${x}</button>`).join("")}</div><p class="tk">${TK[S.a]}</p><p id="gr"></p><input id="nm" placeholder="Your first name" maxlength="14" aria-label="Your first name" value="${esc(S.n)}"><a class="cta" href="#${S.l||"worlds"}" id="go">${S.l?"Continue ▶":"Start playing"}</a></div>
  <div class="mascot"><div class="say" id="say" aria-live="polite">Jambo! I’m Zuri. Tap me.</div><br><svg class="bz" id="zuri" viewBox="0 0 200 200" role="button" tabindex="0" aria-label="Zuri the robot. Tap for a tip"><use href="#z"/></svg>
  <div class="sw">${[["#FFC93C","yellow"],["#7CF5D0","mint"],["#FF9BB8","pink"],["#8FD3FF","blue"]].map(c=>`<button style="background:${c[0]}" data-c="${c[0]}" aria-label="Make Zuri ${c[1]}"></button>`).join("")}</div></div></div></div>
  <section id="worlds"><div class="wrap"><h2>Pick a world</h2><p class="sub">Open a world, pick a topic, play lessons, collect stars.</p><div class="worlds">${Object.entries(D).map(([w,W])=>{const L=lessons(w),n=L.filter(Boolean).length;return `<a class="w" href="#${w}" style="background:${W.c}"><span class="em" aria-hidden="true">${W.e}</span><h3>${W.t}</h3><span class="d">${W.d}</span><div class="pb"><i style="width:${n/L.length*100}%"></i></div><span class="prog">${n}/${L.length} lessons</span></a>`}).join("")}</div></div></section>
  <section style="padding-top:0"><div class="wrap"><h2>My badges</h2><div class="badges">${B.map(b=>`<div class="b ${total>=b[0]?"":"off"}"><span aria-hidden="true">${b[1]}</span><b>${b[2]}</b><br><small>${b[0]} lessons</small></div>`).join("")}</div>
  <h2>The road to future tech</h2><p class="sub">DigiSoma grows with your child.</p><div class="row">${RM.map((r,i)=>`<div class="card ${S.a==i?"now":""}"><span style="font-size:34px" aria-hidden="true">${r[0]}</span><h3 style="margin:0">${r[1]}</h3><small>${r[2]}</small></div>`).join("")}</div></div></section>
  <section style="background:#fff"><div class="wrap"><div class="price"><b>Explorer Pass</b><div class="n">$5<small> / month</small></div><ul><li>All five worlds, new lessons weekly</li><li>Up to 3 child profiles</li><li>No ads, no chat with strangers</li><li>Weekly progress report for parents</li><li>Pay by M-Pesa or card</li></ul><button class="cta" id="try">Parent Zone · 7 days free</button></div></div></section>`;
  const gr=()=>$("#gr").textContent=`${S.n?"Karibu, "+S.n+"! ":"Karibu! "}${HL[S.a]}`;gr();
  $("#nm").oninput=e=>{S.n=e.target.value.trim();save();gr()};
  const tip=()=>{const t=lines[li++%lines.length];$("#say").textContent=t;if(S.a==0)speak(t)};
  $("#zuri").onclick=tip;$("#zuri").onkeydown=e=>{if(e.key=="Enter"||e.key==" "){e.preventDefault();tip()}};
  app.querySelectorAll(".sw button").forEach(b=>b.onclick=()=>{S.z=b.dataset.c;document.documentElement.style.setProperty("--z",S.z);save()});
  app.querySelectorAll(".ages button").forEach(b=>b.onclick=()=>{S.a=+b.dataset.a;save();home()});
  $("#try").onclick=parent;if(!S.l)$("#go").onclick=e=>{e.preventDefault();$("#worlds").scrollIntoView({behavior:calm?"auto":"smooth"})};
}
/* LEVEL 2: world */
function world(w){const W=D[w];
  app.innerHTML=crumbs([[W.t]])+`<div class="wrap page"><h2 style="color:${W.c}">${W.e} ${W.t}</h2><p class="sub">${W.d}. Pick a topic.</p><div class="worlds">${W.topics.map((T,i)=>{const n=T.L.filter((_,l)=>st(w,i,l)).length;return `<a class="w" href="#${w}/${i}" style="background:${W.c}"><span class="em" aria-hidden="true">${T.e}</span><h3>${T.t}</h3><span class="d">${T.d}</span><div class="pb"><i style="width:${n/T.L.length*100}%"></i></div><span class="prog">${n}/${T.L.length} lessons done</span></a>`}).join("")}</div></div>`}
/* LEVEL 3: topic */
function topic(w,t){const W=D[w],T=W.topics[t];
  app.innerHTML=crumbs([[W.t,w],[T.t]])+`<div class="wrap page"><h2 style="color:${W.c}">${T.e} ${T.t}</h2><p class="sub">Finish a lesson to unlock the next one.</p><div class="path" style="--c:${W.c}">${T.L.map((N,l)=>{const lock=l>0&&!st(w,t,l-1),s=st(w,t,l),tg=lock?"div":"a";return `<${tg} ${lock?"":`href="#${w}/${t}/${l}"`} class="node${lock?" lock":""}"><span class="em" aria-hidden="true">${lock?"🔒":N.k=="q"?"📖":"🎮"}</span><span><b>${N.t}</b><small>${lock?"Locked: finish the lesson before":s?`<span aria-label="${s} of 3 stars">${"⭐".repeat(s)+"☆".repeat(3-s)}</span>`:"Start"}</small></span></${tg}>`}).join("")}</div></div>`}
/* LEVEL 4: lesson */
function lesson(w,t,l){const W=D[w],T=W.topics[t],N=T.L[l];
  if(l>0&&!st(w,t,l-1))return topic(w,t);
  S.l=`${w}/${t}/${l}`;save();
  app.innerHTML=crumbs([[W.t,w],[T.t,w+"/"+t],[N.t]])+`<div class="page"><div class="lc"><div class="dh" style="background:${W.c}"><h3>${N.t}</h3></div><div id="st"></div></div></div>`;
  const box=$("#st");
  const fin=s=>{const old=st(w,t,l);if(s>old){S.p[key(w,t,l)]=s}
    const d=today();if(S.d!=d){S.s=S.d==yday()?S.s+1:1;S.d=d}S.h[d]=(S.h[d]||0)+1;
    Object.keys(S.h).sort().slice(0,-30).forEach(k=>delete S.h[k]);save();stats();boom();const nx=T.L[l+1];
    box.innerHTML=`<div class="big" aria-label="${s} of 3 stars">${"⭐".repeat(s)}${"☆".repeat(3-s)}</div><h3 class="c">${s==3?"Brilliant!":s==2?"Great job!":"You finished it!"}</h3><p class="c">${s>old&&old?"New best! ":""}Best score: ${st(w,t,l)} of 3 stars</p><p class="c"><a class="go" href="#${nx?`${w}/${t}/${l+1}`:`${w}/${t}`}">${nx?"Next lesson ▶":"Back to topic"}</a><button class="go alt" id="ag">Play again</button></p>`;$("#ag").onclick=route};
  const Q=N.Q?N.Q.concat(S.a==2&&N.X?[N.X]:[]):0;
  const go={q:()=>quiz(Q,fin,box),math:()=>quiz(mg(N.m),fin,box),robot:()=>robot(N.lv,fin,box),feel:()=>feel(fin,box),breathe:()=>breathe(fin,box),order:()=>order(fin,box),dream:()=>dream(fin,box)}[N.k];
  if(N.learn){box.innerHTML=zsay(N.learn)+`<button class="go" id="gt">Got it, let’s play!</button>`;$("#gt").onclick=go}else go();
}
/* activities */
function quiz(it,fin,box){let i=0,ok=0;
  const go=()=>{if(i>=it.length)return fin(Math.max(1,Math.round(3*ok/it.length)));
    const[q,o,a,w]=it[i],ord=shuffle(o.map((_,j)=>j)),bonus=S.a==2&&i==it.length-1&&it.length>2&&!/^What is/.test(q);
    box.innerHTML=`<p class="step">${bonus?"⚡ Pioneer bonus · ":""}Question ${i+1} of ${it.length}</p><h3>${q} ${tb(q)}</h3><div class="opts">${ord.map(j=>`<button class="opt" data-j="${j}">${o[j]}</button>`).join("")}</div><div id="fb" aria-live="polite"></div>`;
    let lock=0;const bs=[...box.querySelectorAll(".opt")];
    bs.forEach(b=>b.onclick=()=>{if(lock)return;lock=1;const r=+b.dataset.j==a;
      if(r){ok++;b.classList.add("good")}else{b.classList.add("bad");bs.find(x=>+x.dataset.j==a).classList.add("good")}
      $("#fb").innerHTML=`<p><b>${r?"Yes! ":"Good try. "}</b>${w}</p><button class="go" id="nx">${i+1<it.length?"Next":"Finish"}</button>`;$("#nx").focus();$("#nx").onclick=()=>{i++;go()}})};
  go()}
function mg(m){const R=[[10,6],[40,11],[90,13]][S.a],rn=n=>2+Math.random()*n|0;
  return[...Array(4)].map(()=>{let a,b,r,sg;
    if(m){a=rn(R[1]-2);b=rn(R[1]-2);r=a*b;sg="×"}else{a=rn(R[0]);b=rn(R[0]/2);if(Math.random()<.5){r=a+b;sg="+"}else{if(b>a)[a,b]=[b,a];r=a-b;sg="−"}}
    const s=new Set([r]);let g=0;while(s.size<3&&g++<50){const v=r+Math.max(1,Math.round(r/10))*(1+Math.random()*3|0)*(Math.random()<.5?-1:1);if(v>=0)s.add(v)}
    for(let v=r+1;s.size<3;v++)s.add(v);
    const o=shuffle([...s]);return[`What is ${a} ${sg} ${b}?`,o.map(String),o.indexOf(r),`${a} ${sg} ${b} = ${r}.`]})}
const RB=[{g:4,o:[0,0],s:[3,2],r:[],best:5,tx:"Guide me to the ⭐! Each arrow moves me one square."},
{g:4,o:[0,0],s:[3,3],r:[[1,0],[1,1],[3,1]],best:6,tx:"Rocks 🪨 block the way. Plan a path around them!"},
{g:5,o:[0,4],s:[4,0],r:[[3,4],[3,3],[4,2],[1,2],[0,0],[3,1]],best:8,gi:"🏪",ri:"📦",tx:"Mama Akinyi needs mangoes 🥭 at her stall 🏪. Deliver them without hitting the crates 📦!"}];
const PY={"⬆️":"up","⬇️":"down","⬅️":"left","➡️":"right"};
function robot(lv,fin,box){const L=RB[lv],N=L.g,A={"⬆️":[0,-1],"⬇️":[0,1],"⬅️":[-1,0],"➡️":[1,0]};let q=[],p=[...L.o],busy=0,cur=-1;
  const at=(x,y)=>L.r.some(c=>c[0]==x&&c[1]==y);
  const draw=(m,win)=>{let g="";for(let y=0;y<N;y++)for(let x=0;x<N;x++){const me=p[0]==x&&p[1]==y,go=L.s[0]==x&&L.s[1]==y;g+=`<div class="cell${L.o[0]==x&&L.o[1]==y?" st":""}">${me?"🤖":go?(L.gi||"⭐"):at(x,y)?(L.ri||"🪨"):""}</div>`}
    box.innerHTML=zsay(L.tx)+`<div class="grid" style="grid-template-columns:repeat(${N},1fr);max-width:${N*70}px" role="img" aria-label="Map, ${N} by ${N} squares">${g}</div><div class="pad">${Object.keys(A).map(a=>`<button class="ar" data-a="${a}" aria-label="Add a ${PY[a]} step">${a}</button>`).join("")}</div><div class="q" aria-label="Your code">${q.length?q.map((a,i)=>`<span class="${i==cur?"hl":""}">${a}</span>`).join(""):"<small>Tap the arrows to write your code</small>"}</div><div class="pad"><button class="go" id="run">▶ Run code</button><button class="go alt" id="un">↶ Undo</button><button class="go alt" id="clr">↺ Clear</button></div><div class="c" aria-live="polite">${m?`<p>${m}</p>`:""}${win&&S.a?`<pre># The same code in Python\n${q.slice(0,win).map(a=>`zuri.move("${PY[a]}")`).join("\n")}</pre>`:""}${win?`<button class="go" id="cn">Continue ▶</button>`:""}</div>`;
    box.querySelectorAll(".ar").forEach(b=>b.onclick=()=>{if(!busy&&q.length<14){q.push(b.dataset.a);p=[...L.o];cur=-1;draw()}});
    $("#un").onclick=()=>{if(!busy){q.pop();p=[...L.o];cur=-1;draw()}};
    $("#clr").onclick=()=>{if(!busy){q=[];p=[...L.o];cur=-1;draw()}};$("#run").onclick=run;if(win)$("#cn").onclick=()=>fin(win<=L.best?3:2)};
  const run=()=>{if(busy)return;if(!q.length)return draw("Add some arrow steps first!");busy=1;p=[...L.o];let i=0;cur=-1;draw("Running…");
    const t=setInterval(()=>{if(i>=q.length){clearInterval(t);busy=0;cur=-1;return draw("I stopped before the goal. Add more steps and run again!")}
      cur=i;const d=A[q[i]],x=p[0]+d[0],y=p[1]+d[1],off=x<0||y<0||x>=N||y>=N;
      if(off||at(x,y)){clearInterval(t);busy=0;return draw(`💥 Bump! Step ${i+1} ${off?"takes me off the map":"hits a "+(L.ri?"crate":"rock")}. Fix that step and try again. Finding mistakes is called <b>debugging</b>.`)}
      p=[x,y];i++;
      if(p[0]==L.s[0]&&p[1]==L.s[1]){clearInterval(t);busy=0;cur=-1;return draw(`🎉 You did it in ${i} steps${i<=L.best?", the shortest way!":"! Can you find a shorter path?"} A list of steps is called an <b>algorithm</b>.`,i)}
      draw("Running…")},calm?250:450)};
  draw()}
function order(fin,box){const T=[["👀","See","A camera spots a smile"],["🧠","Think","The AI decides: smile means happy"],["💃","Act","The robot does a victory spin"]];let n=0,bad=0;
  box.innerHTML=`<p>Tap the 3 steps in the right order! ${tb("Tap the 3 steps in the right order!")}</p><div class="opts">${shuffle(T.map((_,i)=>i)).map(i=>`<button class="opt" data-i="${i}">${T[i][0]} ${T[i][2]}</button>`).join("")}</div><p class="c" id="fb" aria-live="polite"></p>`;
  box.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{const i=+b.dataset.i;if(b.disabled)return;
    if(i==n){b.classList.add("good");b.disabled=1;b.textContent=`${n+1}. ${T[i][1]}: ${T[i][2]}`;n++;if(n==3){$("#fb").innerHTML=`<b>See → Think → Act.</b> That’s how real AI works!<br><button class="go" id="nx">Continue ▶</button>`;$("#nx").onclick=()=>fin(bad?2:3)}}
    else{bad++;b.classList.add("bad");setTimeout(()=>b.classList.remove("bad"),600)}})}
const CL="If a feeling stays big for a long time, talk to a trusted grown-up. In Kenya you can also call Childline on 116 for free, any time.";
function feel(fin,box){const M=[["😄","Happy","Awesome! Notice what made you feel this way."],["🙂","Okay","Okay is fine. Maybe do one small thing you enjoy."],["😢","Sad","It’s okay to feel sad. Breathe slowly and tell someone you trust."],["😠","Angry","Anger is a signal. Pause, breathe, then say what you need."],["😰","Worried","Worries get smaller when shared. Breathe, then talk to a grown-up."],["😴","Tired","Your body may need rest, water or a snack."]];
  box.innerHTML=zsay("How are you feeling right now? Every feeling is okay.")+`<div class="moods">${M.map((m,i)=>`<button data-i="${i}" aria-label="${m[1]}">${m[0]}<small>${m[1]}</small></button>`).join("")}</div><div id="fb" aria-live="polite"></div>`;
  box.querySelectorAll("[data-i]").forEach(b=>b.onclick=()=>{const k=+b.dataset.i,m=M[k];S.m=m[0]+" "+m[1];save();$("#fb").innerHTML=`<p><b>${m[1]}.</b> ${m[2]}</p><div class="breath">Breathe</div>${k>1&&k<5?`<p class="help">${CL}</p>`:""}<p class="c"><button class="go" id="fd">Done ✔</button></p>`;$("#fd").onclick=()=>fin(3)})}
function breathe(fin,box){box.innerHTML=zsay("Watch the circle. Breathe in through your nose as it grows, and out slowly as it shrinks. Do 4 slow breaths.")+`<div class="breath">Breathe</div><p class="help">${CL}</p><p class="c"><button class="go" id="bd">I did 4 breaths ✔</button></p>`;$("#bd").onclick=()=>fin(3)}
function dream(fin,box){const M=[["🌾","Farming","AI can spot sick crops in phone photos, so farmers save their harvest."],["🏥","Health","AI helps doctors read scans faster and find illness early."],["🎮","Games","AI makes game characters smart and levels more fun."],["⚡","Clean energy","AI helps solar and wind power waste less energy."],["💸","Money","Apps like M-Pesa use smart code to keep payments safe."]];
  box.innerHTML=zsay("What would you love to help with one day?")+`<div class="moods">${M.map((m,i)=>`<button data-i="${i}" aria-label="${m[1]}">${m[0]}<small>${m[1]}</small></button>`).join("")}</div><div id="fb" aria-live="polite"></div>`;
  box.querySelectorAll("[data-i]").forEach(b=>b.onclick=()=>{const m=M[+b.dataset.i];S.dr=m[0]+" "+m[1];save();$("#fb").innerHTML=`<p><b>${m[1]}.</b> ${m[2]} Coding and maths are your superpowers for this!</p><p class="c"><button class="go" id="fd">Save my dream ✔</button></p>`;$("#fd").onclick=()=>fin(3)})}

/* Parent Zone: grown-up gate, then the child's real saved progress */
function parent(){const a=6+Math.random()*7|0,b=12+Math.random()*7|0;
  pz.innerHTML=`<div class="dh" style="background:var(--vio)"><h3>👨‍👩‍👧 Parent Zone</h3></div><div class="pbody"><p>Grown-ups only. What is <b>${a} × ${b}</b>?</p><input id="ga" inputmode="numeric" aria-label="Answer" style="background:var(--bg)"><button class="go" id="gb">Open</button><button class="go alt" id="gx">Close</button><p id="ge" aria-live="polite"></p></div>`;
  pz.showModal();$("#ga").focus();$("#gx").onclick=()=>pz.close();$("#ga").onkeydown=e=>{if(e.key=="Enter")$("#gb").click()};
  $("#gb").onclick=()=>{if(+$("#ga").value!=a*b){$("#ge").textContent="That’s not right. Try again.";return}
    const n=Object.values(S.p).filter(Boolean).length,days=[...Array(7)].map((_,i)=>{const d=new Date(Date.now()-(6-i)*864e5);return[d.toLocaleDateString("en",{weekday:"short"}),S.h[dk(d)]||0]}),mx=Math.max(1,...days.map(d=>d[1]));
    const weak=[];Object.entries(D).forEach(([w,W])=>W.topics.forEach((T,i)=>T.L.forEach((L,l)=>{if(st(w,i,l)==1)weak.push(`${W.e} ${L.t}`)})));
    pz.querySelector(".pbody").innerHTML=`<h3 style="margin:0 0 4px">${esc(S.n)||"Your child"} · ${AG[S.a]}</h3><p class="sub" style="margin-bottom:12px">${n} lessons done · ${xp()} XP · ${streak()}-day streak</p>
    ${Object.entries(D).map(([w,W])=>{const L=lessons(w),k=L.filter(Boolean).length;return `<div style="margin-bottom:8px"><b>${W.e} ${W.t}</b> <small>${k}/${L.length}</small><div class="pb dk"><i style="width:${k/L.length*100}%;background:${W.c}"></i></div></div>`}).join("")}
    <b>Lessons played, last 7 days</b><div class="wk" role="img" aria-label="Lessons played per day, last 7 days">${days.map(d=>`<div><small>${d[1]||""}</small><i style="height:${d[1]/mx*60}px"></i>${d[0]}</div>`).join("")}</div>
    <p><b>Could use practice:</b> ${weak.length?weak.slice(0,3).join(", ")+". Replaying a lesson together helps.":"nothing yet. Great going!"}<br><b>Last feeling shared:</b> ${S.m||"none yet"}<br><b>Dream:</b> ${S.dr||"not chosen yet"}</p>
    <div class="card now" style="background:var(--bg)"><b>Explorer Pass: $5 / month</b><br><small>7 days free. Pay by M-Pesa or card. Cancel any time.</small></div>
    <p><button class="go" id="trial">Start free trial</button><button class="go alt" id="rs">Reset progress</button><button class="go alt" onclick="pz.close()">Close</button></p><p id="pm" aria-live="polite"></p>
    <p class="note"><b>Prototype note.</b> Progress is saved only in this browser. Before launch, DigiSoma still needs: a data-protection review (including Kenya’s Data Protection Act and parental consent), content review by teachers and child psychologists, secure accounts, and real M-Pesa and card billing.</p>`;
    $("#trial").onclick=()=>$("#pm").textContent="Preview only: payments will go live in the real app.";
    let sure=0;$("#rs").onclick=()=>{if(!sure){sure=1;$("#rs").textContent="Tap again to erase all progress";return}const z=S.z;S=D0();S.z=z;save();pz.close();location.hash="";route()}}}
$("#pzb").onclick=parent;

function route(){const[w,t,l]=location.hash.slice(1).split("/"),W=D[w];window.scrollTo(0,0);try{speechSynthesis.cancel()}catch(e){}stats();
  if(!W)return home();const T=W.topics[t];if(!T)return world(w);if(!T.L[l])return topic(w,t);lesson(w,t,+l)}
window.onhashchange=route;route();
</script>
